<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos · Catálogo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1113">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<!--
  Página de pedidos para el móvil (la genera catalogo/web.py y se publica con el catálogo, en pedidos/). Es la página
  «Pedidos» de la app (static/js/pedidos.js y static/css/pedidos.css van aquí dentro), pero habla directamente con el
  script de la hoja de Google, sin la app. No lleva ningún pedido ni la clave: la clave llega tras «#» al escanear el
  QR de la app (Pedidos → «En el móvil») y se queda en este móvil.
-->
<style>
/* Lo de static/css/base.css que usa la página, con el mismo aspecto pero sin desenfoques (en el móvil van a tirones) */
:root{
  --bg: #0b1113;
  --panel: rgba(26, 36, 39, .86);
  --line: rgba(190, 230, 220, .11);
  --line-fuerte: rgba(190, 230, 220, .2);
  --acrilico: none;
  --radio: 16px;
  --ink: #eef3f2;
  --ink-dim: #9fb0ad;
  --ink-faint: #6b7b79;
  --accent: #3ddc97;
  --accent-dim: #2a8f66;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --sans: system-ui, "Segoe UI", Roboto, sans-serif;
  --borde-x: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
}
*{ box-sizing: border-box; }
html{ background: var(--bg); color-scheme: dark; -webkit-text-size-adjust: 100%; }
body{ margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); font-family: var(--sans); line-height: 1.45;
  -webkit-tap-highlight-color: transparent; }
body::before{ content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vmax 40vmax at 0% 0%, rgba(61, 220, 151, .16), transparent 70%),
    radial-gradient(50vmax 40vmax at 100% 10%, rgba(40, 110, 224, .16), transparent 70%),
    radial-gradient(60vmax 40vmax at 70% 100%, rgba(150, 80, 230, .12), transparent 70%); }
a{ color: var(--accent); }
[hidden]{ display: none !important; }

input, select{ width: 100%; background: rgba(6, 10, 12, .5); border: 1px solid var(--line-fuerte); color: var(--ink);
  padding: 8px 10px; border-radius: 10px; font-family: var(--sans); font-size: 16px; outline: none; }
select option{ background: #1a2225; }
input::placeholder{ color: var(--ink-faint); }
input:focus, select:focus{ border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(61, 220, 151, .16); }
button{ font-family: var(--sans); font-weight: 600; font-size: 14px; border-radius: 10px; border: 1px solid transparent;
  padding: 10px 14px; cursor: pointer; touch-action: manipulation; color: var(--ink); }
button:active:not(:disabled){ transform: translateY(1px); }
.btn-primary{ background: linear-gradient(135deg, #52e8a6, #2fc4a0); color: #06120d; }
.btn-primary:disabled{ background: rgba(80, 96, 94, .45); color: #7c8b88; }
.btn-ghost{ background: rgba(255, 255, 255, .04); border-color: var(--line-fuerte); color: var(--ink); }
.btn-link{ background: none; border: none; padding: 0; color: var(--accent); font-size: inherit; font-weight: 600; }
.hint{ font-size: 13px; color: var(--ink-dim); margin: 6px 0 0; }
.panel{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radio); padding: 14px; }
.panel h2{ margin: 0 0 6px; font-size: 18px; }
.panel p{ margin: 0 0 8px; }

/* Cabecera fija arriba: el título, cuándo se leyó y los botones (siempre a mano al bajar por la lista) */
.cabecera{ position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) var(--borde-x) 10px; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.cabecera h1{ margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.cabecera .estado{ display: block; font: 12px/1.4 var(--mono); color: var(--accent); white-space: nowrap; }
.cab-acciones{ display: flex; align-items: center; gap: 8px; flex: none; }
.cab-acciones .boton-enlace, .cab-acciones button{ min-height: 42px; padding: 0 14px; font-size: 14px; }
.cab-acciones .boton-enlace{ color: var(--ink); background: rgba(255, 255, 255, .04); }

.wrap{ padding: 12px var(--borde-x) max(28px, env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
.columna-pedidos{ padding: 12px; }
/* En el ordenador, todo el ancho (el panel «Por imprimir» a la izquierda y los pedidos a la derecha: pedidos.css), y la
   cabecera alineada con lo de debajo */
@media (min-width: 1100px){
  .wrap{ max-width: 1440px; padding-top: 18px; }
  .cabecera{ padding-left: max(var(--borde-x), calc((100% - 1440px) / 2 + 16px));
    padding-right: max(var(--borde-x), calc((100% - 1440px) / 2 + 16px)); }
  .columna-pedidos{ padding: 14px 16px; }
}
.pie{ margin-top: 22px; text-align: center; }
.pie .hint{ margin-top: 10px; }
#instalar{ width: 100%; min-height: 46px; }

.toast{ position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 50; width: max-content;
  max-width: calc(100vw - 32px); transform: translateX(-50%) translateY(20px); padding: 11px 16px; border-radius: 12px;
  background: #3ddc97; color: #06120d; font-size: 14px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none;
  box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .7); transition: opacity .18s ease, transform .18s ease; }
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

/* static/css/pedidos.css, igual que en la app */
/* Pedidos de la web (static/js/pedidos.js): resumen arriba y una tarjeta por pedido con su estado, su cobro y sus piezas;
   o, en «Por imprimir», una entrada por línea con piezas que faltan. La página del móvil (web/pedidos.html) lleva este
   mismo archivo dentro: lo de pantallas estrechas va al final */
.boton-enlace{ display:inline-flex; align-items:center; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-fuerte);
  font-weight: 600; font-size: 13.5px; text-decoration: none; }
.aviso-pedidos h2{ margin: 0 0 6px; font-size: 18px; }
.aviso-pedidos p{ margin: 0 0 8px; max-width: 90ch; }

.resumen-pedidos{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.cifra{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radio); padding: 14px 16px;
  backdrop-filter: var(--acrilico); }
.cifra .num{ font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.cifra .que{ font-size: 12.5px; color: var(--ink-dim); }
.cifra.aviso .num{ color: #f5b14a; }
.cifra.bien .num{ color: var(--accent); }
.cifra.lista{ grid-column: span 2; }
.cifra.lista summary{ display:flex; justify-content: space-between; align-items:center; gap: 8px; cursor: pointer; list-style: none; }
.cifra.lista summary::-webkit-details-marker{ display: none; }
.cifra.lista summary::after{ content: "▾"; font-size: 12px; transition: transform .15s; }
.cifra.lista:not([open]) summary::after{ transform: rotate(-90deg); }
.cifra.lista ol{ margin: 6px 0 0; padding-left: 20px; font-size: 13px; }
.cifra.lista li{ margin: 2px 0; }
.cifra.lista .n{ color: var(--ink-dim); font-variant-numeric: tabular-nums; }
/* La página: en el móvil y en pantallas medianas, una columna (el panel «Por imprimir», el resumen y los pedidos); en el
   ordenador, el panel a la izquierda, fijo al bajar (por debajo de la barra fija: --arriba, de pedidos.js), y el
   resumen y los pedidos a la derecha */
.pedidos-rejilla{ display:grid; grid-template-columns: minmax(0, 1fr); }
.columna-imprimir{ margin-bottom: 12px; }
@media (min-width: 1100px){
  .pedidos-rejilla{ grid-template-columns: minmax(340px, 410px) minmax(0, 1fr); grid-template-areas: "imprimir resumen" "imprimir pedidos";
    column-gap: 20px; align-items: start; }
  .columna-imprimir{ grid-area: imprimir; position: sticky; top: var(--arriba, 16px); margin: 0; }
  .columna-imprimir .panel-imprimir{ max-height: calc(100vh - var(--arriba, 16px) - 16px); overflow-y: auto; }
  .resumen-pedidos{ grid-area: resumen; }
  .columna-pedidos{ grid-area: pedidos; }
}

/* El panel «Por imprimir»: lo que queda de todos los pedidos, por producto (foto, código, piezas y tiempo) y lo que
   eligió el cliente (pedidos.js, panelImprimir) */
.imprimir-lista{ display:grid; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
.cifra.lista .imprimir-lista > li{ display:grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: start;
  margin: 0; padding-top: 8px; border-top: 1px solid var(--line); }
.imprimir-lista .foto{ width: 56px; height: 56px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover;
  background: rgba(255, 255, 255, .04); }
.imprimir-lista .sin-foto{ display:grid; place-items: center; font-size: 22px; filter: grayscale(1); opacity: .5; }
.imprimir-lista .prod{ display:grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.imprimir-lista .izq, .imprimir-lista .der{ display:flex; flex-direction: column; }
.imprimir-lista .der{ align-items: flex-end; text-align: right; }
.imprimir-lista .nombre{ font-size: 14px; font-weight: 650; line-height: 1.3; }
.cifra.lista .imprimir-lista .prod .n{ font-size: 16px; font-weight: 800; color: var(--ink); }
.imprimir-lista .t{ font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.imprimir-lista .variantes{ display:grid; gap: 2px; margin: 4px 0 0; padding: 0 0 0 12px; list-style: none; font-size: 12.5px; }
.cifra.lista .imprimir-lista .variantes li{ display:flex; justify-content: space-between; gap: 10px; margin: 0; color: var(--accent); }
.cifra.lista .imprimir-lista .variantes .n{ flex: none; color: var(--ink); font-weight: 700; }

.barra-pedidos{ display:flex; flex-wrap: wrap; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.barra-pedidos input[type=search]{ max-width: 340px; }
.filtros{ display:flex; flex-wrap:wrap; gap: 4px; }
.filtros button{ padding: 4px 11px; font-size: 12.5px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
  color: var(--ink-dim); }
.filtros button.activo{ border-color: var(--accent); color: var(--accent); }
.filtros .cuenta{ margin-left: 6px; font: 600 11px/1 var(--mono); color: var(--ink-faint); }
.filtros button.activo .cuenta{ color: inherit; }

.lista-pedidos{ display:flex; flex-direction:column; gap: 6px; }
.lista-pedidos .vacio{ margin: 0; padding: 18px 0; text-align: center; color: var(--ink-dim); }
.pedido{ border: 1px solid var(--line); border-left: 4px solid var(--line-fuerte); border-radius: 12px;
  background: rgba(255, 255, 255, .02); }
.pedido.pagado{ border-left-color: var(--accent); }
.pedido.por-cobrar{ border-left-color: #f5b14a; }
.pedido.cancelado{ opacity: .55; }
/* Plegado: una línea con el número, el cliente y el estado; al tocarla se despliega el resto (.pedido-cuerpo) */
.pedido-linea{ display:flex; align-items:center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; }
.pedido-linea::-webkit-details-marker{ display: none; }
.pedido-linea::before{ content: "▸"; flex: none; font-size: 12px; color: var(--ink-faint); transition: transform .15s; }
.pedido[open] > .pedido-linea::before{ transform: rotate(90deg); }
.pedido-linea .num{ flex: none; font-weight: 800; }
/* El nombre, entero si cabe en dos líneas */
.pedido-linea .quien{ flex: 1; min-width: 0; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.pedido-linea .etiqueta{ flex: none; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-fuerte);
  font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.pedido.pagado .etiqueta{ color: var(--accent); border-color: rgba(61, 220, 151, .45); }
.pedido.por-cobrar .etiqueta{ color: #f5b14a; border-color: rgba(245, 177, 74, .45); }
.pedido-cuerpo{ padding: 0 14px 12px; border-top: 1px solid var(--line); }
.pedido-cab{ display:flex; flex-wrap:wrap; align-items:center; gap: 4px 14px; padding-top: 10px; }
.pedido-cab .fecha, .pedido-cab .tel{ color: var(--ink-dim); font-size: 13px; }
.pedido-cab .total{ font-size: 17px; font-weight: 800; white-space: nowrap; }
.pedido-cab .tel{ margin-left: auto; }
.pedido ul{ margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; }
.pedido li{ margin: 2px 0; }
.pedido .detalle, .cola-item .detalle{ display:block; color: var(--accent); font-size: 12.5px; }
/* El código del producto (P-037) y, si es enlace, a su modelo en Printables o a su ficha */
.pedido .ref, .cola-item .ref, .panel-imprimir .ref{ display:flex; width: fit-content; margin: 3px 0 4px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line-fuerte); font: 600 12px/1.5 var(--mono); color: var(--ink-dim); text-decoration: none; }
.pedido a.ref, .cola-item a.ref, .panel-imprimir a.ref{ color: #7fb4ff; border-color: rgba(127, 180, 255, .45);
  background: rgba(127, 180, 255, .08); }
.pedido a.ref:hover, .cola-item a.ref:hover, .panel-imprimir a.ref:hover{ background: rgba(127, 180, 255, .16); }
/* Lo que tarda cada pieza y cuándo acabaría (tiempoLinea); en la cabecera del pedido, lo que le falta */
.tiempo{ display:block; margin: 2px 0; font-size: 12.5px; color: var(--ink-dim); }
.tiempo.sin{ color: var(--ink-faint); }
.tiempo .fin, .plan-texto .fin{ color: var(--ink); font-weight: 600; }
.pedido-cab .falta{ font-size: 13px; font-weight: 600; }
/* Las piezas de una línea: con una, Pendiente / Impreso / Entregado; con varias, cuántas impresas y entregadas */
.piezas{ display:flex; flex-wrap:wrap; gap: 6px 16px; margin: 5px 0 9px; }
.piezas.una{ gap: 0; width: fit-content; border: 1px solid var(--line-fuerte); border-radius: 10px; overflow: hidden; }
.piezas.una button{ padding: 5px 12px; border: 0; border-radius: 0; background: transparent; color: var(--ink-dim);
  font-size: 12.5px; font-weight: 600; }
.piezas.una button + button{ border-left: 1px solid var(--line-fuerte); }
.piezas.una button.e0{ background: rgba(255, 255, 255, .1); color: var(--ink); }
.piezas.una button.e1{ background: rgba(127, 180, 255, .18); color: #a9cdff; }
.piezas.una button.e2{ background: rgba(61, 220, 151, .18); color: var(--accent); }
.contador{ display:flex; align-items:center; gap: 6px; font-size: 12.5px; }
.contador .que{ min-width: 70px; color: var(--ink-dim); }
.contador button{ width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid var(--line-fuerte);
  background: rgba(255, 255, 255, .04); color: var(--ink); font-size: 17px; line-height: 1; }
.contador button:disabled{ opacity: .3; cursor: default; }
.contador .cuantas{ min-width: 52px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.contador.completo .cuantas{ color: var(--accent); }
.pedido .comentario{ margin: 6px 0 0; font-size: 13px; color: var(--ink-dim); white-space: pre-line; }
.pedido-acciones{ display:flex; flex-wrap:wrap; align-items:center; gap: 8px 16px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--line); }
.pedido-acciones label{ display:flex; align-items:center; gap: 6px; font-size: 13px; margin: 0; }
.pedido-acciones select{ width: auto; padding: 5px 8px; font-size: 13px; }
.pedido-acciones input[type=checkbox]{ width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.pedido-acciones .guardando{ font-size: 12px; color: var(--ink-faint); }
/* Al marcarlo pagado sin forma de pago: «¿Cómo ha pagado?» con un botón por forma */
.pregunta-forma{ display:flex; flex-wrap:wrap; align-items:center; gap: 6px; }
.pregunta-forma[hidden]{ display: none; }
.pregunta-forma .que{ font-size: 13px; font-weight: 600; }
.pregunta-forma button{ padding: 5px 12px; border-radius: 999px; border: 1px solid var(--accent); background: transparent;
  color: var(--accent); font-size: 13px; font-weight: 600; }
.pregunta-forma button.cancelar{ border-color: var(--line-fuerte); color: var(--ink-dim); }

/* «Por imprimir»: cuántas horas hay y lo que cabe (plan-dia), y una entrada por línea con piezas que faltan */
.plan-dia{ display:flex; flex-wrap:wrap; align-items:center; gap: 8px 16px; margin-bottom: 12px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .02); }
.plan-dia[hidden]{ display: none; }
.plan-horas{ display:flex; align-items:center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.plan-horas input{ width: 76px; }
.plan-horas .num-paso{ width: 148px; }
.plan-texto{ flex: 1; min-width: 220px; margin: 0; font-size: 13px; color: var(--ink-dim); }
.cola-item{ padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid var(--line-fuerte); border-radius: 12px;
  background: rgba(255, 255, 255, .02); font-size: 13.5px; }
.cola-item.hecho{ border-left-color: var(--accent); opacity: .65; }
.cola-item.no-cabe{ opacity: .6; }
.cola-cab{ display:flex; flex-wrap:wrap; align-items:center; gap: 4px 10px; }
.ir-pedido{ padding: 0; border: 0; background: none; color: var(--ink-dim); font-size: 12.5px; font-weight: 600; text-align: left; }
.ir-pedido:hover{ color: var(--accent); }
.sin-confirmar{ font-size: 12px; color: #f5b14a; }
.marca{ margin-left: auto; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-fuerte); font-size: 12px;
  color: var(--ink-dim); white-space: nowrap; }
.marca.cabe, .marca.hecha{ color: var(--accent); border-color: rgba(61, 220, 151, .45); }
.marca.no{ color: var(--ink-faint); }
.marca.sin{ color: #f5b14a; border-color: rgba(245, 177, 74, .45); }
.cola-que{ margin-top: 4px; font-size: 14.5px; font-weight: 650; }
.cola-que .faltan{ color: #f5b14a; font-weight: 600; }
.cola-item .guardando{ font-size: 12px; color: var(--ink-faint); }

/* «📱 En el móvil» (static/js/pedidos-app.js): el QR con el enlace y la clave */
.qr-movil{ width: 210px; margin: 0 auto 12px; border-radius: 12px; overflow: hidden; background: #fff; }
.qr-movil svg{ display:block; width: 100%; height: auto; }
.qr-estado{ color: var(--accent); }
.qr-estado:empty{ display: none; }

/* ---- Pantallas estrechas: el móvil (393 px de ancho en un POCO X5 Pro) y la app en una ventana estrecha ----
   Cada pedido, plegado en una línea de 52 px; desplegado, la fecha, el total y el WhatsApp arriba y, para marcarlo,
   controles grandes (46 px de alto, letra de 16 px) con «Pagado» ocupando toda la fila para acertar con el dedo */
@media (max-width: 600px){
  .resumen-pedidos{ grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .cifra{ padding: 10px 12px; border-radius: 12px; }
  .cifra .num{ font-size: 19px; }
  .cifra .que{ font-size: 12px; }
  .cifra.lista{ grid-column: 1 / -1; }
  .columna-imprimir{ margin-bottom: 8px; }
  .cifra.lista .imprimir-lista > li{ grid-template-columns: 64px minmax(0, 1fr); }
  .imprimir-lista .foto{ width: 64px; height: 64px; }
  .panel-imprimir span.ref{ margin: 4px 0 2px; padding: 2px 9px; }  /* sin enlace no hay que tocarlo: no tan alto */
  .imprimir-lista .nombre{ font-size: 15.5px; }
  .cifra.lista .imprimir-lista .prod .n{ font-size: 18px; }
  .imprimir-lista .t{ font-size: 13px; }
  .imprimir-lista .variantes{ font-size: 14px; }
  .cifra.lista summary{ min-height: 26px; font-size: 13px; }
  .cifra.lista ol{ font-size: 14px; }

  .barra-pedidos{ flex-direction: column; align-items: stretch; gap: 10px; }
  .barra-pedidos input[type=search]{ max-width: none; padding: 11px 12px; font-size: 16px; }
  .filtros{ gap: 6px; }
  .filtros button{ padding: 8px 12px; font-size: 13.5px; }

  /* La línea plegada, alta para acertar con el dedo; desplegado: la fecha y el total, y el WhatsApp a la derecha */
  .pedido-linea{ min-height: 52px; padding: 8px 12px; gap: 8px; font-size: 15.5px; }
  .pedido-linea .etiqueta{ font-size: 12.5px; }
  .pedido-cuerpo{ padding: 0 12px 12px; }
  .pedido-cab{ gap: 4px 10px; }
  .pedido-cab .tel{ padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    text-decoration: none; color: #74e3a4; background: rgba(37, 211, 102, .12); border: 1px solid rgba(37, 211, 102, .35); }
  .pedido-cab .tel::before{ content: "💬 "; }
  .pedido ul{ font-size: 14.5px; }

  .pedido .comentario{ font-size: 14px; }

  /* Las piezas, de 44 px: los tres estados ocupan la fila; los contadores, uno debajo de otro */
  .piezas.una{ width: 100%; }
  .piezas.una button{ flex: 1; min-height: 44px; padding: 0 4px; font-size: 14.5px; }
  .piezas.varias{ flex-direction: column; gap: 8px; }
  .contador{ gap: 10px; font-size: 14.5px; }

  .contador button{ width: 44px; height: 44px; font-size: 21px; }

  .plan-dia{ flex-direction: column; align-items: stretch; }
  .plan-horas{ font-size: 15px; }
  .plan-horas input{ width: 96px; min-height: 44px; font-size: 16px; }
  .plan-texto{ min-width: 0; font-size: 14px; }
  .cola-item{ padding: 10px 12px; }
  .ir-pedido{ min-height: 32px; font-size: 14px; }
  .marca, .sin-confirmar{ font-size: 13px; }
  .cola-que{ font-size: 15.5px; }

  .pedido-acciones{ display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px;
    grid-template-areas: "estado forma" "pagado pagado" "pregunta pregunta" "nota nota"; }
  .pregunta-forma{ grid-area: pregunta; display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .pregunta-forma .que{ grid-column: 1 / -1; font-size: 15px; }
  .pregunta-forma button{ min-height: 44px; padding: 0 6px; border-radius: 10px; font-size: 15px; }
  .pedido-acciones label{ flex-direction: column; align-items: stretch; gap: 4px; font-size: 12px; color: var(--ink-dim); }
  .pedido-acciones .campo-estado{ grid-area: estado; }
  .pedido-acciones .campo-forma{ grid-area: forma; }
  .pedido-acciones .campo-pagado{ grid-area: pagado; flex-direction: row; align-items: center; gap: 10px; min-height: 46px;
    padding: 0 12px; border: 1px solid var(--line-fuerte); border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .pedido.pagado .campo-pagado{ color: var(--accent); border-color: rgba(61, 220, 151, .55); background: rgba(61, 220, 151, .1); }
  .pedido-acciones select{ width: 100%; min-height: 46px; font-size: 16px; }

}

<body>
<header class="cabecera">
  <div>
    <h1>Pedidos</h1>
    <span class="estado" id="estado" role="status">Cargando…</span>
  </div>
  <div class="cab-acciones">
    <a class="boton-enlace" id="abrirHoja" href="#" target="_blank" rel="noopener" hidden>Hoja ↗</a>
    <button type="button" class="btn-primary" id="actualizar">↻ Actualizar</button>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="preparar" hidden>
    <h2 id="prepararTitulo"></h2>
    <p id="prepararTexto"></p>
  </section>

  <section class="panel aviso-pedidos" id="sinConexion" hidden>
    <h2>No se pueden leer los pedidos</h2>
    <p id="sinConexionMotivo"></p>
    <p class="hint">Cuando esté arreglado, pulsa «Actualizar».</p>
  </section>

  <div id="contenido" hidden>
   <div class="pedidos-rejilla">
    <aside class="columna-imprimir" id="imprimir"></aside>
    <section class="resumen-pedidos" id="resumen"></section>

    <section class="panel columna-pedidos">
      <div class="barra-pedidos">
        <input type="search" id="buscar" placeholder="Buscar cliente, producto o color" enterkeyhint="search">
        <div class="filtros" role="group" aria-label="Filtrar">
          <button type="button" class="activo" data-filtro="pendientes">Pendientes</button>
          <button type="button" data-filtro="imprimir">Por imprimir</button>
          <button type="button" data-filtro="entregados">Entregados</button>
          <button type="button" data-filtro="cobrar">Por cobrar</button>
          <button type="button" data-filtro="cancelados">Cancelados</button>
          <button type="button" data-filtro="todos">Todos</button>
        </div>
      </div>
      <div class="lista-pedidos" id="lista"></div>
    </section>
   </div>
  </div>

  <footer class="pie">
    <button type="button" class="btn-ghost" id="instalar" hidden>Instalar como app</button>
    <p class="hint" id="consejoInstalar" hidden>Para tenerla como una app: menú del navegador (⋮) → «Añadir a pantalla de
      inicio».</p>
    <p class="hint"><a href="../">Ver el catálogo</a><span id="olvidarCaja" hidden> · <button type="button" class="btn-link"
      id="olvidar">Olvidar la clave en este móvil</button></span></p>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// Pedidos de la web. La página «Pedidos» de la app y la del móvil (web/pedidos.html, que se publica con el catálogo)
// son esta misma: solo cambia de dónde salen los pedidos (`fuente`). La app los pide a su servidor (pedidos-app.js) y
// el móvil, directamente al script de la hoja de Google. Aquí se leen las líneas de cada pedido, se hace el resumen y
// se pinta todo; cada cambio de estado, cobro, forma de pago o de las piezas se ve al momento y va a la hoja. Los
// pedidos van por pestañas (`seccion`: «Pendientes», «Entregados» —entregados y pagados— y «Cancelados»), cada uno
// plegado en una línea; «Por imprimir» es otra cosa: las piezas que faltan de todos los pedidos (`cola`).
//   Pedidos.iniciar({ leer: async () => ({ pedidos, hoja, estados, formas, tiempos }), actualizar: async (numero, cambios) => {} })
const Pedidos = (() => {
  // «2 × P-037 Chapa para mascota (2,50 €) — Chapa: Negro · Borde y letras: Amarillo · Nombre: «Milo»». El código
  // (P-037) lo apunta el script desde su versión 5: los pedidos de antes no lo llevan
  const LINEA = /^\s*(\d+)\s*×\s*(?:(P-\d{3,6})\s+)?(.+?)\s*\(([\d.,]+)\s*€\)\s*(?:—\s*(.*))?$/;

  // Las líneas de la celda «Productos»: [{cantidad, ref, nombre, precio, detalle}] (las que no se entiendan, tal cual)
  function lineas(productos) {
    const resultado = [];
    for (const texto of String(productos || '').split(/\r?\n/)) {
      const m = texto.match(LINEA);
      if (m) {
        resultado.push({ cantidad: Number(m[1]), ref: m[2] || '', nombre: m[3],
          precio: Number(m[4].replace(/\./g, '').replace(',', '.')), detalle: (m[5] || '').trim() });
      } else if (texto.trim()) {
        resultado.push({ cantidad: 0, ref: '', nombre: texto.trim(), precio: 0, detalle: '' });
      }
    }
    return resultado;
  }

  // ---- Las piezas de cada línea (3 × Chapa son tres, cada una por su lado): [pendientes, impresas, entregadas] ----
  const ESTADOS_PIEZA = ['Pendiente', 'Impreso', 'Entregado'];
  const PARTE = /^(Pendiente|Impreso|Entregado)(?: ×(\d+))?$/;
  const piezasDeLinea = (c) => c[0] + c[1] + c[2];

  // Las de cada línea, de la columna «Estado de los productos» (una línea de texto por línea del pedido: «Impreso» o
  // «Pendiente ×1 · Impreso ×2»). Lo que falte o no se entienda sale del estado del pedido: así salen los de antes
  function piezas(texto, lineasPedido, estado) {
    const textos = String(texto || '').split(/\r?\n/);
    return lineasPedido.map((l, i) => {
      const n = Math.max(1, l.cantidad || 0);
      const segun = estado === 'Entregado' ? [0, 0, n] : estado === 'Hecho' ? [0, n, 0] : [n, 0, 0];
      const partes = (textos[i] || '').trim().split(' · ').map((t) => t.trim().match(PARTE));
      if (partes.some((m) => !m)) return segun;
      const c = [0, 0, 0];
      if (partes.length === 1 && !partes[0][2]) c[ESTADOS_PIEZA.indexOf(partes[0][1])] = n;
      else partes.forEach((m) => { c[ESTADOS_PIEZA.indexOf(m[1])] += Number(m[2] || 1); });
      // Si no suman lo que pide la línea (alguien ha tocado la hoja a mano): sobran pendientes, o faltan
      let sobra = piezasDeLinea(c) - n;
      for (let j = 0; sobra > 0 && j < 3; j++) {
        const quita = Math.min(c[j], sobra);
        c[j] -= quita;
        sobra -= quita;
      }
      if (sobra < 0) c[0] -= sobra;
      return c;
    });
  }

  // Lo que se escribe en la hoja de una línea: «Impreso» si todas están igual; si no, «Pendiente ×1 · Impreso ×2»
  function textoPiezas(c) {
    const hay = ESTADOS_PIEZA.map((e, i) => [e, c[i]]).filter(([, k]) => k > 0);
    return hay.length === 1 ? hay[0][0] : hay.map(([e, k]) => `${e} ×${k}`).join(' · ');
  }

  // El estado del pedido según sus piezas: todas entregadas, «Entregado»; todas impresas, «Hecho»; y si vuelve a faltar
  // alguna, el que tenía antes de cambiar solo (`antes`; si no se sabe, «Confirmado»). Un cancelado no cambia
  const AUTOMATICOS = ['Hecho', 'Entregado'];
  function estadoSegunPiezas(estado, lista, antes) {
    if (estado === 'Cancelado' || !lista.length) return estado;
    const [pendientes, impresas] = lista.reduce((t, c) => t.map((v, i) => v + c[i]), [0, 0, 0]);
    if (!pendientes && !impresas) return 'Entregado';
    if (!pendientes) return 'Hecho';
    if (AUTOMATICOS.includes(estado)) return antes && !AUTOMATICOS.includes(antes) ? antes : 'Confirmado';
    return estado;
  }

  // Al poner a mano el estado del pedido: «Hecho» da por impresas las que faltaban y «Entregado», todas entregadas
  function piezasSegunEstado(estado, lista) {
    return lista.map(([a, b, c]) => (estado === 'Entregado' ? [0, 0, a + b + c] : estado === 'Hecho' ? [0, a + b, c] : [a, b, c]));
  }

  function duracion(minutos) {
    const m = Math.round(minutos), h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`;
  }

  // Lo que queda por imprimir, del pedido más antiguo al más nuevo: una entrada por línea con piezas pendientes
  // (`tambien`: «número:línea» de las que se acaban de imprimir, para que no desaparezcan de golpe). Con `disponible`
  // (minutos), cuántas caben de cada una cogiéndolas en ese orden y saltando las que ya no caben, y `fin`, los minutos
  // hasta que acabarían contando las de antes; sin él, `fin` es lo que tardan las suyas
  function cola(pedidos, disponible = null, tambien = new Set()) {
    const entradas = [];
    for (const p of [...pedidos].sort((x, y) => (x.numero || 0) - (y.numero || 0))) {
      if (p.estado === 'Cancelado') continue;
      p.lineas.forEach((l, i) => {
        if (l.piezas && (l.piezas[0] > 0 || tambien.has(`${p.numero}:${i}`))) {
          entradas.push({ pedido: p, linea: l, indice: i, faltan: l.piezas[0], minutos: l.minutos || 0 });
        }
      });
    }
    let queda = disponible, usado = 0;
    for (const e of entradas) {
      if (disponible === null || !e.minutos) {
        e.caben = null;
        e.fin = e.minutos * e.faltan;
        continue;
      }
      e.caben = Math.min(e.faltan, Math.floor(queda / e.minutos));
      queda -= e.caben * e.minutos;
      usado += e.caben * e.minutos;
      e.fin = e.caben ? usado : null;
    }
    const suma = (f) => entradas.reduce((t, e) => t + f(e), 0);
    return { entradas, piezas: suma((e) => e.faltan), minutos: suma((e) => e.faltan * e.minutos),
      sin_tiempo: suma((e) => (e.minutos ? 0 : e.faltan)), caben: suma((e) => e.caben || 0), usado };
  }

  // Lo que queda por imprimir de todos los pedidos, junto por producto (su código o, sin él, su nombre) y, dentro, por
  // lo que eligió el cliente (colores y texto), sin importar de quién es: en el orden de la cola, lo más antiguo antes
  function porProducto(pedidos) {
    const productos = new Map();
    for (const { pedido, linea: l, faltan, minutos } of cola(pedidos).entradas) {
      const clave = l.ref || l.nombre.toLowerCase();
      let p = productos.get(clave);
      if (!p) {
        productos.set(clave, p = { ref: l.ref, nombre: l.nombre, foto: l.foto || '', enlace: '', piezas: 0, minutos: 0,
          variantes: new Map() });
      }
      // A dónde lleva su código (Printables o su ficha): el enlace de la hoja de cualquiera de sus pedidos
      p.enlace = p.enlace || (l.ref && (pedido.enlaces || {})[l.ref]) || '';
      p.piezas += faltan;
      p.minutos += faltan * minutos;
      p.variantes.set(l.detalle, (p.variantes.get(l.detalle) || 0) + faltan);
    }
    return [...productos.values()].map((p) => ({ ...p, variantes: [...p.variantes] }));
  }

  // En qué pestaña va un pedido: cancelado; entregado y pagado, que ya no tiene nada que hacer («Entregados»); o
  // pendiente (lo demás: por hacer, hecho sin entregar, pagado por adelantado, entregado sin cobrar…)
  function seccion(p) {
    if (p.estado === 'Cancelado') return 'cancelados';
    return p.pagado && p.estado === 'Entregado' ? 'entregados' : 'pendientes';
  }

  // Cobrado, pendiente de cobro (sin cancelados), lo que queda por imprimir, lo más pedido y los colores que más se
  // piden (para comprar rollos)
  function resumen(pedidos) {
    const vivos = pedidos.filter((p) => p.estado !== 'Cancelado');
    const productos = new Map(), colores = new Map();
    const contar = (mapa, clave, n) => mapa.set(clave, (mapa.get(clave) || 0) + n);
    for (const p of vivos) {
      for (const l of p.lineas) {
        contar(productos, l.nombre, l.cantidad);
        // «Blanco» o «Chapa: Negro · Letras: Oro»; el texto del cliente va el último y entre «», sin colores
        for (const parte of (l.detalle || '').split('«')[0].split(' · ')) {
          const color = (parte.includes(': ') ? parte.slice(parte.lastIndexOf(': ') + 2) : parte).trim();
          if (color) contar(colores, color, l.cantidad);
        }
      }
    }
    const suma = (lista) => Math.round(lista.reduce((t, p) => t + p.total, 0) * 100) / 100;
    const deMasAMenos = (mapa) => [...mapa].sort((a, b) => b[1] - a[1]).slice(0, 10);  // empates: por orden de llegada
    const c = cola(pedidos);
    return {
      pedidos: pedidos.length, cancelados: pedidos.length - vivos.length, importe: suma(vivos),
      cobrado: suma(pedidos.filter((p) => p.pagado)), pendiente: suma(vivos.filter((p) => !p.pagado)),
      entregado_sin_cobrar: suma(vivos.filter((p) => p.estado === 'Entregado' && !p.pagado)),
      por_imprimir: { piezas: c.piezas, minutos: c.minutos, sin_tiempo: c.sin_tiempo }, por_producto: porProducto(pedidos),
      mas_pedidos: deMasAMenos(productos), colores: deMasAMenos(colores),
    };
  }

  function el(etiqueta, clase, ...hijos) {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    e.append(...hijos.filter((h) => h !== null && h !== undefined && h !== false));
    return e;
  }

  function boton(texto, alPulsar, clase = '', desactivado = false) {
    const b = el('button', clase, texto);
    b.type = 'button';
    b.disabled = desactivado;
    b.addEventListener('click', alPulsar);
    return b;
  }

  function aviso(texto) {
    const t = document.getElementById('toast');
    t.textContent = texto;
    t.classList.add('show');
    clearTimeout(aviso.h);
    aviso.h = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function iniciar(fuente) {
    const $ = (id) => document.getElementById(id);
    const euros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
    const fecha = new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
    const hora = new Intl.DateTimeFormat('es-ES', { timeStyle: 'short' });
    const diaSemana = new Intl.DateTimeFormat('es-ES', { weekday: 'long' });
    const normalizar = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    // En el móvil las listas del resumen empiezan plegadas: lo primero que se quiere ver son los pedidos
    const estrecha = matchMedia('(max-width: 600px)').matches;
    const plegadas = {};
    const ESPERA_PIEZAS = 900;  // ms: las piezas se guardan al rato, por si se tocan varias seguidas

    let datos = null;  // {pedidos, resumen, hoja, estados, formas, tiempos}
    let filtro = 'pendientes';
    const abiertos = new Set();  // los pedidos desplegados (por su número): siguen así al volver a pintar la lista
    const tarjetas = new Map();  // número → su tarjeta en la lista (se cambia entera al cambiar el pedido)
    const recien = new Set();  // «número:línea» impresas desde «Por imprimir»: siguen a la vista hasta cambiar de pestaña
    const notas = new Map();  // número → «Guardando en la hoja…» / «✓ Guardado»
    let leido = 0;  // cuándo se leyó la hoja por última vez
    let ocupada = 0;  // lecturas y cambios en marcha

    // «a las 18:40», «mañana a las 01:10» o «el jueves a las 10:00»: cuándo acabaría lo que se empieza ahora. Se pone
    // al día cada minuto (la página puede quedarse abierta)
    function textoFin(minutos) {
      const fin = new Date(Date.now() + minutos * 60000);
      const dias = Math.round((new Date(fin).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 86400000);
      const a = `a las ${hora.format(fin)}`;
      return dias === 0 ? a : dias === 1 ? `mañana ${a}` : `el ${diaSemana.format(fin)} ${a}`;
    }
    function fin(minutos) {
      const s = el('span', 'fin', textoFin(minutos));
      s.dataset.min = String(minutos);
      return s;
    }
    setInterval(() => document.querySelectorAll('.fin').forEach((s) => { s.textContent = textoFin(Number(s.dataset.min)); }),
      60000);

    // ---- Resumen: lo que falta por imprimir y por cobrar y lo que más se pide (también los colores, para los rollos) ----
    function pintarResumen() {
      const r = datos.resumen;
      const cifra = (num, que, clase = '') => el('div', `cifra ${clase}`, el('div', 'num', num), el('div', 'que', que));
      const lista = (titulo, filas) => {
        const d = el('details', 'cifra lista', el('summary', 'que', titulo),
          filas.length ? el('ol', '', ...filas.map(([nombre, n]) => el('li', '', `${nombre} `, el('span', 'n', `× ${n}`))))
            : el('p', 'hint', 'Aún nada.'));
        d.open = !(titulo in plegadas ? plegadas[titulo] : estrecha);
        d.addEventListener('toggle', () => { plegadas[titulo] = !d.open; });
        return d;
      };
      $('imprimir').replaceChildren(panelImprimir());
      $('resumen').replaceChildren(
        cifra(euros.format(r.pendiente), 'Pendiente de cobro', r.pendiente > 0 ? 'aviso' : ''),
        cifra(euros.format(r.entregado_sin_cobrar), 'Entregado y sin cobrar', r.entregado_sin_cobrar > 0 ? 'aviso' : ''),
        cifra(euros.format(r.cobrado), 'Cobrado', 'bien'),
        cifra(String(r.pedidos - r.cancelados), `Pedidos${r.cancelados ? ` (y ${r.cancelados} cancelados)` : ''}`),
        lista('Lo más pedido', r.mas_pedidos),
        lista('Colores más pedidos', r.colores),
      );
    }
    const piezasTexto = (n) => `${n} ${n === 1 ? 'pieza' : 'piezas'}`;

    // El panel de arriba: lo que queda por imprimir de todos los pedidos, por producto (porProducto). Se rehace con
    // cada cambio, así que al marcar una pieza en cualquier pedido se resta aquí. Abierto o plegado, como se dejó
    const PANEL = 'negoqr-pedidos-panel';
    let panelAbierto = true;
    try { panelAbierto = localStorage.getItem(PANEL) !== 'plegado'; } catch { /* sin almacén */ }
    function panelImprimir() {
      const { piezas, minutos, sin_tiempo: sinTiempo } = datos.resumen.por_imprimir;
      const productos = datos.resumen.por_producto;
      const panel = el('details', 'cifra lista panel-imprimir',
        el('summary', '', el('div', '', el('div', 'num', piezas ? duracion(minutos) : '—'),
          el('div', 'que', `Por imprimir: ${piezasTexto(piezas)}${sinTiempo ? `, ${sinTiempo} sin tiempo` : ''}`))),
        productos.length ? el('ul', 'imprimir-lista', ...productos.map((p) => {
          const [[detalle]] = p.variantes;
          return el('li', '',
            fotoProducto(p),
            el('div', 'datos',
              el('div', 'prod',
                el('div', 'izq', el('span', 'nombre', p.nombre), p.ref ? referencia(p.ref, p.enlace) : null),
                el('div', 'der', el('span', 'n', `× ${p.piezas}`), el('span', 't', p.minutos ? duracion(p.minutos) : 'sin tiempo'))),
              // Con una sola variante, su cuenta es la del producto: no se repite
              p.variantes.length > 1 || detalle ? el('ul', 'variantes', ...p.variantes.map(([d, n]) => el('li', '',
                el('span', '', d || 'Sin color indicado'), p.variantes.length > 1 ? el('span', 'n', `× ${n}`) : null))) : null));
        })) : el('p', 'hint', 'No queda nada por imprimir.'));
      panel.open = panelAbierto;
      panel.addEventListener('toggle', () => {
        panelAbierto = panel.open;
        try { localStorage.setItem(PANEL, panel.open ? 'abierto' : 'plegado'); } catch { /* sin almacén */ }
      });
      return panel;
    }

    // La foto del producto (la del catálogo); sin foto, o si no carga, un hueco del mismo tamaño
    function fotoProducto(p) {
      const hueco = () => el('div', 'foto sin-foto', '📦');
      if (!p.foto) return hueco();
      const img = el('img', 'foto');
      Object.assign(img, { src: p.foto, alt: '', loading: 'lazy', decoding: 'async' });
      img.addEventListener('error', () => img.replaceWith(hueco()));
      return img;
    }

    // En el ordenador, el panel va en su columna, fijo al bajar por los pedidos: por debajo de la barra fija de arriba
    // (la de la app o la cabecera del móvil), que puede cambiar de alto
    const barraFija = [...document.querySelectorAll('.barra, .cabecera')].find((e) => getComputedStyle(e).position === 'sticky');
    const ponerArriba = () => document.documentElement.style.setProperty('--arriba', `${(barraFija ? barraFija.offsetHeight : 0) + 16}px`);
    addEventListener('resize', ponerArriba);
    ponerArriba();

    // ---- Lista: una pestaña por sección (seccion), «Por imprimir» (cola), «Por cobrar» y «Todos» ----
    const FILTROS = {
      pendientes: (p) => seccion(p) === 'pendientes',
      entregados: (p) => seccion(p) === 'entregados',
      cobrar: (p) => !p.pagado && p.estado !== 'Cancelado',
      cancelados: (p) => seccion(p) === 'cancelados',
      todos: () => true,
    };
    const NOMBRE_SECCION = { pendientes: 'Pendientes', entregados: 'Entregados', cancelados: 'Cancelados' };
    function ponerFiltro(f) {
      filtro = f;
      recien.clear();
      document.querySelectorAll('[data-filtro]').forEach((x) => x.classList.toggle('activo', x.dataset.filtro === f));
      plan.hidden = f !== 'imprimir';
      pintarLista();
    }
    document.querySelectorAll('[data-filtro]').forEach((b) => b.addEventListener('click', () => ponerFiltro(b.dataset.filtro)));
    $('buscar').addEventListener('input', () => pintarLista());

    // «Tengo 6 h para imprimir»: en «Por imprimir» marca lo que cabe (se recuerda en este navegador)
    const HORAS = 'negoqr-pedidos-horas';
    const horas = el('input');
    Object.assign(horas, { type: 'number', min: '0', max: '200', step: '0.5', inputMode: 'decimal', placeholder: '—' });
    horas.setAttribute('aria-label', 'Horas que tienes para imprimir');
    try { horas.value = localStorage.getItem(HORAS) || ''; } catch { /* sin almacén */ }
    horas.addEventListener('input', () => {
      try { localStorage.setItem(HORAS, horas.value); } catch { /* sin almacén */ }
      if (datos) pintarLista();
    });
    const planTexto = el('p', 'plan-texto');
    const plan = el('div', 'plan-dia', el('label', 'plan-horas', 'Tengo', horas, 'h para imprimir'), planTexto);
    plan.hidden = true;
    $('lista').before(plan);

    // Cuántos hay en cada filtro, en su botón (en «Por imprimir», las piezas)
    function pintarCuentas() {
      document.querySelectorAll('[data-filtro]').forEach((b) => {
        let cuenta = b.querySelector('.cuenta');
        if (!cuenta) b.append(cuenta = el('span', 'cuenta'));
        cuenta.textContent = String(b.dataset.filtro === 'imprimir' ? datos.resumen.por_imprimir.piezas
          : datos.pedidos.filter(FILTROS[b.dataset.filtro]).length);
      });
    }

    // El código del producto y, si la hoja tiene su enlace, a dónde lleva: su modelo en Printables (el nombre del pedido
    // está traducido y no se parece al de allí) o su ficha en el catálogo
    function referencia(ref, url) {
      if (!/^https:\/\//.test(url || '')) return el('span', 'ref', ref);
      const a = el('a', 'ref', `${ref} · ${/printables\.com/.test(url) ? 'Printables' : 'Ficha'} ↗`);
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = 'Abrir el producto';
      return a;
    }

    function waDe(telefono) {
      const d = String(telefono || '').replace(/\D/g, '');
      return d.length === 9 ? `34${d}` : d;
    }

    const VACIO = {
      pendientes: 'No hay pedidos pendientes.', entregados: 'Aún no hay pedidos entregados y pagados.',
      cobrar: 'No hay nada por cobrar.', cancelados: 'No hay pedidos cancelados.', todos: 'No hay pedidos.',
      imprimir: 'No queda nada por imprimir.',
    };

    function pintarLista() {
      tarjetas.clear();
      if (filtro === 'imprimir') { pintarCola(); return; }
      const busca = normalizar($('buscar').value.trim());
      const pedidos = datos.pedidos.filter(FILTROS[filtro]).filter((p) => !busca || normalizar(
        `${p.numero} ${p.nombre} ${p.apellidos} ${p.telefono} ${p.productos} ${p.comentario}`).includes(busca));
      $('lista').replaceChildren(...(pedidos.length ? pedidos.map(tarjeta)
        : [el('p', 'vacio', !datos.pedidos.length ? 'Aún no ha llegado ningún pedido desde la web.'
          : busca ? 'Ningún pedido coincide.' : VACIO[filtro])]));
    }

    // Lo que tarda una línea: cada pieza y, si faltan, cuándo acabarían si se empiezan ya. Con `plan` (en «Por
    // imprimir» con horas), cuántas caben y cuándo acabarían después de las de antes
    function tiempoLinea(l, plan = null) {
      if (!l.minutos) {
        const s = el('span', 'tiempo sin', '⏱ Sin tiempo de impresión');
        s.title = 'Este producto no tiene tiempo: se saca al laminarlo en Productos';
        return s;
      }
      const n = piezasDeLinea(l.piezas), faltan = l.piezas[0];
      const s = el('span', 'tiempo', `⏱ ${duracion(l.minutos)}${n > 1 ? ' cada pieza' : ''}`);
      if (!faltan) return s;
      if (plan) {
        if (plan.caben) {
          s.append(` · ${plan.caben > 1 ? `las ${plan.caben}: ${duracion(plan.caben * l.minutos)}; ` : ''}con lo de arriba, acabas `,
            fin(plan.fin));
        } else if (faltan > 1) {
          s.append(` · las ${faltan}: ${duracion(faltan * l.minutos)}`);
        }
      } else if (n === 1) {
        s.append(' · si empiezas ya, acaba ', fin(l.minutos));
      } else {
        s.append(` · ${faltan === n ? `las ${n}` : `las ${faltan} que faltan`}: ${duracion(faltan * l.minutos)}, acaban `,
          fin(faltan * l.minutos));
      }
      return s;
    }

    // Lo que se ha hecho de una línea: con una pieza, Pendiente / Impreso / Entregado; con varias, cuántas están
    // impresas y cuántas entregadas («2 de 3»), cada una por su lado
    function controlPiezas(p, l) {
      const n = piezasDeLinea(l.piezas);
      const cambiar = (nuevas) => cambiarPiezas(p, l, nuevas);
      if (n === 1) {
        const actual = l.piezas.findIndex((k) => k > 0);
        const grupo = el('div', 'piezas una', ...ESTADOS_PIEZA.map((e, i) => {
          const b = boton(e, () => { if (i !== actual) cambiar([0, 1, 2].map((j) => (j === i ? 1 : 0))); },
            i === actual ? `activo e${i}` : '');
          b.setAttribute('aria-pressed', String(i === actual));
          return b;
        }));
        grupo.setAttribute('role', 'group');
        grupo.setAttribute('aria-label', `Estado de ${l.nombre}`);
        return grupo;
      }
      const [a, b, c] = l.piezas;
      const contador = (que, cuantas, menos, mas) => {
        const caja = el('div', `contador${cuantas === n ? ' completo' : ''}`, el('span', 'que', que),
          boton('−', menos, 'menos', !cuantas), el('span', 'cuantas', `${cuantas} de ${n}`), boton('+', mas, 'mas', cuantas === n));
        caja.querySelector('.menos').setAttribute('aria-label', `${que}: una menos`);
        caja.querySelector('.mas').setAttribute('aria-label', `${que}: una más`);
        return caja;
      };
      return el('div', 'piezas varias',
        contador('Impresas', b + c, () => cambiar(b ? [a + 1, b - 1, c] : [a + 1, b, c - 1]), () => cambiar([a - 1, b + 1, c])),
        contador('Entregadas', c, () => cambiar([a, b + 1, c - 1]), () => cambiar(b ? [a, b - 1, c + 1] : [a - 1, b, c + 1])));
    }

    function nota(numero) {
      const s = el('span', 'guardando', notas.get(numero) || '');
      s.dataset.nota = String(numero);
      return s;
    }
    function ponerNota(numero, texto) {
      if (texto) notas.set(numero, texto); else notas.delete(numero);
      document.querySelectorAll(`[data-nota="${numero}"]`).forEach((s) => { s.textContent = texto; });
    }

    // Cada pedido, plegado en una línea (número, cliente y estado): al tocarla se despliega con todo lo demás
    function tarjeta(p) {
      const tel = el('a', 'tel', p.telefono);
      tel.href = `https://wa.me/${waDe(p.telefono)}`;
      tel.target = '_blank';
      tel.rel = 'noopener';
      tel.title = 'Escribirle por WhatsApp';
      const cuando = p.fecha && !Number.isNaN(Date.parse(p.fecha)) ? fecha.format(new Date(p.fecha)) : p.fecha;
      const vivo = p.estado !== 'Cancelado';
      const lineasPedido = el('ul', '', ...p.lineas.map((l) => el('li', '',
        l.cantidad ? `${l.cantidad} × ${l.nombre} (${euros.format(l.precio)})` : l.nombre,
        l.detalle ? el('span', 'detalle', l.detalle) : null,
        l.ref ? referencia(l.ref, (p.enlaces || {})[l.ref]) : null,
        vivo ? tiempoLinea(l) : null,
        vivo ? controlPiezas(p, l) : null)));
      const falta = vivo ? p.lineas.reduce((t, l) => t + l.piezas[0] * (l.minutos || 0), 0) : 0;

      const estado = el('select');
      datos.estados.forEach((e) => estado.append(new Option(e, e, false, e === p.estado)));
      if (!datos.estados.includes(p.estado)) estado.append(new Option(p.estado || '—', p.estado, true, true));
      const pagado = el('input');
      pagado.type = 'checkbox';
      pagado.checked = p.pagado;
      const forma = el('select');
      forma.append(new Option('—', ''));
      datos.formas.forEach((f) => forma.append(new Option(f, f, false, f === p.forma)));
      // Al marcarlo pagado sin forma de pago, se pregunta antes cómo ha pagado: si así queda entregado y pagado, se va
      // a «Entregados» y luego habría que ir a buscarlo para ponérsela
      const pagarCon = (f) => () => {
        preguntaForma.hidden = true;
        aplicar(p, () => { p.pagado = true; p.forma = f; });
      };
      const preguntaForma = el('div', 'pregunta-forma', el('span', 'que', '¿Cómo ha pagado?'),
        ...datos.formas.map((f) => boton(f, pagarCon(f))), boton('Sin indicar', pagarCon('')),
        boton('Cancelar', () => { preguntaForma.hidden = true; pagado.checked = false; }, 'cancelar'));
      preguntaForma.hidden = true;

      // Corta, para que quepa el nombre: «Sin cobrar» es entregado sin cobrar (va en ámbar, como su borde)
      const etiqueta = el('span', 'etiqueta', p.estado === 'Entregado' && !p.pagado ? 'Sin cobrar'
        : `${p.estado || '—'}${p.pagado && p.estado !== 'Entregado' ? ' · pagado' : ''}`);
      const caja = el('details', 'pedido',
        el('summary', 'pedido-linea', el('span', 'num', `Nº ${p.numero}`), el('span', 'quien', `${p.nombre} ${p.apellidos}`),
          etiqueta),
        el('div', 'pedido-cuerpo',
          el('div', 'pedido-cab', el('span', 'fecha', cuando), el('span', 'total', euros.format(p.total)),
            falta ? el('span', 'falta', `⏱ Falta imprimir ${duracion(falta)}`) : null, tel),
          lineasPedido,
          p.comentario ? el('p', 'comentario', `«${p.comentario}»`) : null,
          el('div', 'pedido-acciones',
            el('label', 'campo-estado', 'Estado', estado),
            el('label', 'campo-pagado', pagado, 'Pagado'),
            el('label', 'campo-forma', 'Forma de pago', forma),
            preguntaForma,
            nota(p.numero))));
      caja.classList.toggle('pagado', p.pagado);
      caja.classList.toggle('por-cobrar', !p.pagado && p.estado === 'Entregado');
      caja.classList.toggle('cancelado', !vivo);
      caja.open = abiertos.has(p.numero);
      caja.addEventListener('toggle', () => { if (caja.open) abiertos.add(p.numero); else abiertos.delete(p.numero); });

      // El estado a mano: «Hecho» da por impresas las piezas que faltaban y «Entregado», todas entregadas
      estado.addEventListener('change', () => {
        const nuevo = estado.value;
        aplicar(p, () => {
          const lista = piezasSegunEstado(nuevo, p.lineas.map((l) => l.piezas));
          p.lineas.forEach((l, i) => { l.piezas = lista[i]; });
          p.estado = nuevo;
          p.estadoAntes = undefined;
        });
      });
      pagado.addEventListener('change', () => {
        if (pagado.checked && !forma.value) {
          preguntaForma.hidden = false;
          return;
        }
        preguntaForma.hidden = true;
        aplicar(p, () => { p.pagado = pagado.checked; });
      });
      forma.addEventListener('change', () => {
        if (!preguntaForma.hidden) { pagarCon(forma.value)(); return; }  // contesta a «¿Cómo ha pagado?» con la lista
        aplicar(p, () => { p.forma = forma.value; });
      });
      tarjetas.set(p.numero, caja);
      return caja;
    }

    // ---- «Por imprimir»: las piezas que faltan de todos los pedidos, del más antiguo al más nuevo ----
    function pintarCola() {
      const h = Number(horas.value.replace(',', '.'));
      const disponible = horas.value.trim() && h > 0 ? h * 60 : null;
      const c = cola(datos.pedidos, disponible, recien);
      if (!c.piezas) {
        planTexto.textContent = 'No queda nada por imprimir.';
      } else if (disponible === null) {
        planTexto.replaceChildren(`${piezasTexto(c.piezas)} por imprimir: ${duracion(c.minutos)}`
          + `${c.sin_tiempo ? ` y ${c.sin_tiempo} sin tiempo` : ''}. Pon las horas que tienes y te marco lo que cabe.`);
      } else if (c.caben) {
        planTexto.replaceChildren(`Caben ${c.caben} de ${piezasTexto(c.piezas)} (${duracion(c.usado)}): si empiezas ya, `
          + 'acabas ', fin(c.usado), `.${c.sin_tiempo ? ` Las que no tienen tiempo (${c.sin_tiempo}) no cuentan.` : ''}`);
      } else {
        const corta = Math.min(...c.entradas.filter((e) => e.minutos && e.faltan).map((e) => e.minutos));
        planTexto.textContent = Number.isFinite(corta) ? `En ${duracion(disponible)} no cabe ninguna: la más corta tarda `
          + `${duracion(corta)}.` : 'Ninguna tiene tiempo de impresión: no sé qué cabe.';
      }
      const busca = normalizar($('buscar').value.trim());
      const entradas = c.entradas.filter(({ pedido: p, linea: l }) => !busca || normalizar(
        `${p.numero} ${p.nombre} ${p.apellidos} ${l.ref} ${l.nombre} ${l.detalle}`).includes(busca));
      $('lista').replaceChildren(...(entradas.length ? entradas.map((e) => entradaCola(e, disponible !== null))
        : [el('p', 'vacio', c.entradas.length ? 'Nada coincide.' : VACIO.imprimir)]));
    }

    function entradaCola(e, conPlan) {
      const { pedido: p, linea: l } = e;
      const n = piezasDeLinea(l.piezas);
      let marca = null;
      if (!e.faltan) marca = el('span', 'marca hecha', '✓ Impreso');
      else if (!e.minutos) marca = el('span', 'marca sin', 'Sin tiempo');
      else if (conPlan && !e.caben) marca = el('span', 'marca no', 'No cabe');
      else if (conPlan) marca = el('span', 'marca cabe', e.caben === e.faltan ? (e.faltan > 1 ? `✓ Caben las ${e.faltan}` : '✓ Cabe')
        : `✓ Caben ${e.caben} de ${e.faltan}`);
      const irPedido = boton(`Nº ${p.numero} · ${p.nombre} ${p.apellidos}`, () => verPedido(p), 'ir-pedido');
      irPedido.title = 'Ver el pedido';
      return el('div', `cola-item${!e.faltan ? ' hecho' : conPlan && e.minutos && !e.caben ? ' no-cabe' : ''}`,
        el('div', 'cola-cab', irPedido, p.estado === 'Pendiente' ? el('span', 'sin-confirmar', 'sin confirmar') : null, marca),
        el('div', 'cola-que', `${n} × ${l.nombre}`,
          e.faltan && e.faltan < n ? el('span', 'faltan', ` · ${e.faltan === 1 ? 'falta 1' : `faltan ${e.faltan}`}`) : null),
        l.detalle ? el('span', 'detalle', l.detalle) : null,
        l.ref ? referencia(l.ref, (p.enlaces || {})[l.ref]) : null,
        tiempoLinea(l, conPlan && e.minutos ? e : null),
        controlPiezas(p, l),
        nota(p.numero));
    }

    // Desde «Por imprimir», el pedido entero: en su pestaña, desplegado
    function verPedido(p) {
      $('buscar').value = '';
      abiertos.add(p.numero);
      ponerFiltro(seccion(p));
      const caja = tarjetas.get(p.numero);
      if (caja) caja.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    // ---- Cambios: se ven al momento y se guardan en la hoja (guardar) ----
    function cambiarPiezas(p, l, nuevas) {
      const indice = p.lineas.indexOf(l);
      if (filtro === 'imprimir') recien.add(`${p.numero}:${indice}`);
      aplicar(p, () => {
        l.piezas = nuevas;
        const nuevo = estadoSegunPiezas(p.estado, p.lineas.map((x) => x.piezas), p.estadoAntes);
        if (nuevo === p.estado) return '';
        if (!AUTOMATICOS.includes(p.estado)) p.estadoAntes = p.estado;
        p.estado = nuevo;
        return nuevo === 'Entregado' ? `Nº ${p.numero}: todo entregado → «Entregado»`
          : nuevo === 'Hecho' ? `Nº ${p.numero}: todo impreso → «Hecho»` : `Nº ${p.numero} vuelve a «${nuevo}»`;
      }, ESPERA_PIEZAS);
    }

    // `cambio` cambia el pedido (y puede devolver un aviso). Si pasa a otra pestaña (p. ej. entregado y pagado, a
    // «Entregados»), se dice
    function aplicar(p, cambio, demora = 0) {
      const antes = seccion(p);
      const avisos = [cambio()].filter(Boolean);
      if (seccion(p) !== antes) avisos.push(`Nº ${p.numero} pasa a ${NOMBRE_SECCION[seccion(p)]}`);
      if (avisos.length) aviso(avisos.join(' · '));
      repintar(p);
      guardar(p, demora);
    }

    function repintar(p) {
      datos.resumen = resumen(datos.pedidos);
      pintarResumen();
      pintarCuentas();
      if (filtro === 'imprimir') { pintarCola(); return; }
      if (!FILTROS[filtro](p)) {
        abiertos.delete(p.numero);
        pintarLista();
        return;
      }
      const vieja = tarjetas.get(p.numero);
      if (vieja && vieja.isConnected) vieja.replaceWith(tarjeta(p));
    }

    // Lo que tiene la hoja de un pedido (`p.enHoja`: lo último que se leyó o se guardó). Se manda solo lo que cambia;
    // los cambios de cada pedido van de uno en uno (si llega otro mientras se guarda, después) y, si falla, el pedido
    // vuelve a lo que tiene la hoja
    const enHoja = (p) => ({ estado: p.estado, pagado: p.pagado, forma: p.forma,
      piezas: p.lineas.map((l) => textoPiezas(l.piezas)) });
    const guardando = new Map();  // número → {temporizador, enVuelo, otraVez}

    function guardar(p, demora) {
      let g = guardando.get(p.numero);
      if (!g) {
        g = { temporizador: 0, enVuelo: false, otraVez: false };
        guardando.set(p.numero, g);
        ocupada++;
      }
      ponerNota(p.numero, 'Guardando en la hoja…');
      if (g.enVuelo) { g.otraVez = true; return; }
      clearTimeout(g.temporizador);
      g.temporizador = setTimeout(() => enviar(p, g), demora);
    }

    async function enviar(p, g) {
      g.enVuelo = true;
      const ahora = enHoja(p), antes = p.enHoja, cambios = {};
      for (const k of ['estado', 'pagado', 'forma']) if (ahora[k] !== antes[k]) cambios[k] = ahora[k];
      if (ahora.piezas.join('\n') !== antes.piezas.join('\n')) cambios.piezas = ahora.piezas;
      let fallo = null;
      try {
        if (Object.keys(cambios).length) await fuente.actualizar(p.numero, cambios);
        p.enHoja = ahora;
      } catch (e) {
        fallo = e;
      }
      g.enVuelo = false;
      if (!fallo && g.otraVez) {
        g.otraVez = false;
        enviar(p, g);
        return;
      }
      guardando.delete(p.numero);
      ocupada--;
      if (!fallo) {
        ponerNota(p.numero, '✓ Guardado');
        setTimeout(() => { if (notas.get(p.numero) === '✓ Guardado') ponerNota(p.numero, ''); }, 2000);
        return;
      }
      const h = p.enHoja;
      Object.assign(p, { estado: h.estado, pagado: h.pagado, forma: h.forma });
      piezas(h.piezas.join('\n'), p.lineas, h.estado).forEach((c, i) => { p.lineas[i].piezas = c; });
      ponerNota(p.numero, '');
      aviso(`No se pudo guardar: ${fallo.message}`);
      datos.resumen = resumen(datos.pedidos);
      pintarResumen();
      pintarCuentas();
      pintarLista();
    }

    async function cargar() {
      if (ocupada) return;
      ocupada++;
      $('estado').textContent = 'Leyendo la hoja…';
      $('actualizar').disabled = true;
      try {
        const j = await fuente.leer();
        // Lo que se sabe de cada producto por su código (pedidos.productos: la app lo saca del catálogo y el móvil lo
        // lleva en la página): lo que tarda una pieza (0 = no se sabe) y su foto. Los pedidos de antes de los códigos
        // lo buscan por el nombre
        const fichas = { minutos: {}, fotos: {}, nombres: {}, ...j.productos };

          const lista = lineas(p.productos);
          piezas(p.piezas, lista, p.estado).forEach((c, i) => {

        $('contenido').hidden = !datos;
        $('estado').textContent = 'Sin conexión con la hoja';

      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && datos && Date.now() - leido > 2 * 60 * 1000) cargar();
    });
    cargar();
  }

  return { iniciar, lineas, resumen, seccion, aviso, piezas, textoPiezas, estadoSegunPiezas, piezasSegunEstado, duracion,
    cola, porProducto };
})();

  const ALMACEN = 'negoqr-pedidos-clave';
  const $ = (id) => document.getElementById(id);

  const leerClave = () => { try { return localStorage.getItem(ALMACEN) || ''; } catch { return ''; } };
  const guardarClave = (c) => { try { if (c) localStorage.setItem(ALMACEN, c); else localStorage.removeItem(ALMACEN); } catch { /* sin almacén */ } };

  // La clave llega tras «#» al escanear el QR de la app (lo que va tras «#» no sale del móvil): se guarda en el móvil y
  // se quita de la dirección, para que no quede a la vista ni se comparta sin querer
  const enlace = location.hash.match(/[#&]k=([A-Za-z0-9_-]{16,64})/);
  if (enlace) {
    guardarClave(enlace[1]);
    history.replaceState(null, '', location.pathname + location.search);
  }
  const clave = enlace ? enlace[1] : leerClave();
  // Si el enlace se abre con la página ya abierta, el navegador solo cambia lo de tras «#» (no la vuelve a cargar)
  addEventListener('hashchange', () => { if (/[#&]k=/.test(location.hash)) location.reload(); });

  async function alScript(cuerpo) {
    const parar = new AbortController();
    const plazo = setTimeout(() => parar.abort(), 30000);
    try {
      let r;
      try {
        // Texto plano, como los pedidos del catálogo: así el navegador no pide permiso antes (CORS) y Google contesta
        r = await fetch(DIRECCION, { method: 'POST', body: JSON.stringify({ ...cuerpo, clave }), signal: parar.signal });
      } catch (e) {
        throw new Error(e.name === 'AbortError' ? 'La hoja tarda demasiado en responder: prueba otra vez.'
          : 'No se pudo hablar con la hoja de pedidos. ¿Hay conexión?');
      }
      let j;
      try {
        j = await r.json();
      } catch {
        throw new Error('La hoja no ha respondido como se esperaba: en el ordenador, comprueba que el script está '
          + 'publicado con acceso «Cualquier usuario».');
      }
      if ((j.version || 1) < VERSION) {
        throw new Error('El script de la hoja es el de antes. En el ordenador: Productos → ⚙ Ajustes → Web del catálogo '
          + '→ «Copiar el script»; pégalo en Apps Script y publícalo como «Nueva versión».');
      }
      if (!j.ok) {
        throw new Error(j.codigo === 'clave' ? 'La clave de este móvil no es la del script. Vuelve a escanear el código '
          + 'de la app (Pedidos → «📱 En el móvil»); si acabas de cambiar la clave, publica antes el script nuevo.'
          : j.error || 'La hoja ha dado un error.');
      }
      return j;
    } finally {
      clearTimeout(plazo);
    }
  }

  function preparar(titulo, texto) {
    $('prepararTitulo').textContent = titulo;
    $('prepararTexto').textContent = texto;
    $('preparar').hidden = false;
    $('estado').textContent = 'Sin leer';
    $('actualizar').hidden = true;
  }

  if (!DIRECCION) {
    preparar('Falta la dirección de la hoja', 'En el ordenador: Productos → ⚙ Ajustes → Web del catálogo, pega la '
      + 'dirección del script de pedidos y vuelve a publicar la web.');
  } else if (!clave) {
    preparar('Falta la clave en este móvil', 'Para ver y marcar los pedidos desde aquí: en el ordenador, abre la app → '
      + 'Pedidos → «📱 En el móvil» y escanea el código con la cámara. Solo hace falta una vez.');
  } else {
    Pedidos.iniciar({
      leer: async () => ({ ...(await alScript({ accion: 'pedidos' })), productos: PRODUCTOS }),
      actualizar: (numero, cambios) => alScript({ accion: 'actualizar', numero, ...cambios }),
    });
    $('olvidarCaja').hidden = false;
  }

  // Olvidar la clave (p. ej. antes de prestar el móvil): dos toques, para no hacerlo sin querer
  $('olvidar').addEventListener('click', () => {
    const b = $('olvidar');
    if (!b.dataset.seguro) {
      b.dataset.seguro = '1';
      b.textContent = '¿Seguro? Toca otra vez para olvidarla';
      setTimeout(() => { delete b.dataset.seguro; b.textContent = 'Olvidar la clave en este móvil'; }, 4000);
      return;
    }
    guardarClave('');
    location.reload();
  });

  // Instalarla como una app (icono en la pantalla de inicio y sin la barra del navegador)
  const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let peticion = null;
  $('consejoInstalar').hidden = instalada;
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    peticion = e;
    $('instalar').hidden = false;
    $('consejoInstalar').hidden = true;
  });
  $('instalar').addEventListener('click', async () => {
    if (!peticion) return;
    peticion.prompt();

  });
