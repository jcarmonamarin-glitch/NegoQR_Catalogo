  const ALMACEN = 'negoqr-pedidos-clave';
  const $ = (id) => document.getElementById(id);

  const leerClave = () => { try { return localStorage.getItem(ALMACEN) || ''; } catch { return ''; } };
  const guardarClave = (c) => { try { if (c) localStorage.setItem(ALMACEN, c); else localStorage.removeItem(ALMACEN); } catch { /* sin almacén */ } };

  // La clave llega tras «#» al escanear el QR de la app (lo que va tras «#» no sale del móvil): se guarda en el móvil y
  // se quita de la dirección, para que no quede a la vista ni se comparta sin querer
  const enlace = location.hash.match(/[#&]k=([A-Za-z0-9_-]{16,64})/);
  if (enlace) {
    guardarClave(enlace[1]);
    history.replaceState(null, '', location.pathname + location.search);
  }
  const clave = enlace ? enlace[1] : leerClave();
  // Si el enlace se abre con la página ya abierta, el navegador solo cambia lo de tras «#» (no la vuelve a cargar)
  addEventListener('hashchange', () => { if (/[#&]k=/.test(location.hash)) location.reload(); });

  async function alScript(cuerpo) {
    const parar = new AbortController();
    const plazo = setTimeout(() => parar.abort(), 30000);
    try {
      let r;
      try {
        // Texto plano, como los pedidos del catálogo: así el navegador no pide permiso antes (CORS) y Google contesta
        r = await fetch(DIRECCION, { method: 'POST', body: JSON.stringify({ ...cuerpo, clave }), signal: parar.signal });
      } catch (e) {
        throw new Error(e.name === 'AbortError' ? 'La hoja tarda demasiado en responder: prueba otra vez.'
          : 'No se pudo hablar con la hoja de pedidos. ¿Hay conexión?');
      }
      let j;
      try {
        j = await r.json();
      } catch {
        throw new Error('La hoja no ha respondido como se esperaba: en el ordenador, comprueba que el script está '
          + 'publicado con acceso «Cualquier usuario».');
      }
      if ((j.version || 1) < VERSION) {
        throw new Error('El script de la hoja es el de antes. En el ordenador: Productos → ⚙ Ajustes → Web del catálogo '
          + '→ «Copiar el script»; pégalo en Apps Script y publícalo como «Nueva versión».');
      }
      if (!j.ok) {
        throw new Error(j.codigo === 'clave' ? 'La clave de este móvil no es la del script. Vuelve a escanear el código '
          + 'de la app (Pedidos → «📱 En el móvil»); si acabas de cambiar la clave, publica antes el script nuevo.'
          : j.error || 'La hoja ha dado un error.');
      }
      return j;
    } finally {
      clearTimeout(plazo);
    }
  }

  function preparar(titulo, texto) {
    $('prepararTitulo').textContent = titulo;
    $('prepararTexto').textContent = texto;
    $('preparar').hidden = false;
    $('estado').textContent = 'Sin leer';
    $('actualizar').hidden = true;
  }

  if (!DIRECCION) {
    preparar('Falta la dirección de la hoja', 'En el ordenador: Productos → ⚙ Ajustes → Web del catálogo, pega la '
      + 'dirección del script de pedidos y vuelve a publicar la web.');
  } else if (!clave) {
    preparar('Falta la clave en este móvil', 'Para ver y marcar los pedidos desde aquí: en el ordenador, abre la app → '
      + 'Pedidos → «📱 En el móvil» y escanea el código con la cámara. Solo hace falta una vez.');
  } else {
    Pedidos.iniciar({
      leer: async () => ({ ...(await alScript({ accion: 'pedidos' })), productos: PRODUCTOS }),
      actualizar: (numero, cambios) => alScript({ accion: 'actualizar', numero, ...cambios }),
    });
    $('olvidarCaja').hidden = false;
  }

  // Olvidar la clave (p. ej. antes de prestar el móvil): dos toques, para no hacerlo sin querer
  $('olvidar').addEventListener('click', () => {
    const b = $('olvidar');
    if (!b.dataset.seguro) {
      b.dataset.seguro = '1';
      b.textContent = '¿Seguro? Toca otra vez para olvidarla';
      setTimeout(() => { delete b.dataset.seguro; b.textContent = 'Olvidar la clave en este móvil'; }, 4000);
      return;
    }
    guardarClave('');
    // Y la copia de los pedidos (nombres y teléfonos) que guarda la página para enseñarlos al momento
    try { localStorage.removeItem('negoqr-pedidos-copia'); } catch { /* sin almacén */ }
    location.reload();
  });

  // Instalarla como una app (icono en la pantalla de inicio y sin la barra del navegador)
  const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let peticion = null;
  $('consejoInstalar').hidden = instalada;
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    peticion = e;
    $('instalar').hidden = false;
    $('consejoInstalar').hidden = true;
  });
  $('instalar').addEventListener('click', async () => {
    if (!peticion) return;
    peticion.prompt();
    await peticion.userChoice;
    peticion = null;
    $('instalar').hidden = true;
  });
  addEventListener('appinstalled', () => { $('instalar').hidden = true; $('consejoInstalar').hidden = true; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
