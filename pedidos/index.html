<script>
// Pedidos de la web. La página «Pedidos» de la app y la del móvil (web/pedidos.html, que se publica con el catálogo)
// son esta misma: solo cambia de dónde salen los pedidos (`fuente`). La app los pide a su servidor (pedidos-app.js) y
// el móvil, directamente al script de la hoja de Google. Aquí se leen las líneas de cada pedido, se hace el resumen y
// se pinta todo; cada cambio de estado, cobro, forma de pago o de las piezas (cómo van y si están cobradas) se ve al
// momento y va a la hoja. Los pedidos van por pestañas (`seccion`: «Pendientes», «Entregados» —entregados y pagados— y
// «Cancelados»), cada uno plegado en una línea; «Por imprimir» es otra cosa: las piezas que faltan de todos los pedidos
// (`cola`); y «Clientes», los pedidos de cada persona juntos (`clientes`) y sus productos uno a uno (`productosDe`).
//   Pedidos.iniciar({ leer: async () => ({ pedidos, hoja, estados, formas, tiempos }), actualizar: async (numero, cambios) => {} })
const Pedidos = (() => {
  // «2 × P-037 Chapa para mascota (2,50 €) — Chapa: Negro · Borde y letras: Amarillo · Nombre: «Milo»». El código
  // (P-037) lo apunta el script desde su versión 5: los pedidos de antes no lo llevan
  const LINEA = /^\s*(\d+)\s*×\s*(?:(P-\d{3,6})\s+)?(.+?)\s*\(([\d.,]+)\s*€\)\s*(?:—\s*(.*))?$/;

  // Las líneas de la celda «Productos»: [{cantidad, ref, nombre, precio, detalle}] (las que no se entiendan, tal cual)
  function lineas(productos) {
    const resultado = [];
    for (const texto of String(productos || '').split(/\r?\n/)) {
      const m = texto.match(LINEA);
      if (m) {
        resultado.push({ cantidad: Number(m[1]), ref: m[2] || '', nombre: m[3],
          precio: Number(m[4].replace(/\./g, '').replace(',', '.')), detalle: (m[5] || '').trim() });
      } else if (texto.trim()) {
        resultado.push({ cantidad: 0, ref: '', nombre: texto.trim(), precio: 0, detalle: '' });
      }
    }
    return resultado;
  }

  // ---- Las piezas de cada línea (3 × Chapa son tres, cada una por su lado): [pendientes, impresas, entregadas] ----
  const ESTADOS_PIEZA = ['Pendiente', 'Impreso', 'Entregado'];
  const PARTE = /^(Pendiente|Impreso|Entregado)(?: ×(\d+))?$/;
  const piezasDeLinea = (c) => c[0] + c[1] + c[2];

  // Las de cada línea, de la columna «Estado de los productos» (una línea de texto por línea del pedido: «Impreso» o
  // «Pendiente ×1 · Impreso ×2»). Lo que falte o no se entienda sale del estado del pedido: así salen los de antes
  function piezas(texto, lineasPedido, estado) {
    const textos = String(texto || '').split(/\r?\n/);
    return lineasPedido.map((l, i) => {
      const n = Math.max(1, l.cantidad || 0);
      const segun = estado === 'Entregado' ? [0, 0, n] : estado === 'Hecho' ? [0, n, 0] : [n, 0, 0];
      const partes = (textos[i] || '').trim().split(' · ').map((t) => t.trim().match(PARTE));
      if (partes.some((m) => !m)) return segun;
      const c = [0, 0, 0];
      if (partes.length === 1 && !partes[0][2]) c[ESTADOS_PIEZA.indexOf(partes[0][1])] = n;
      else partes.forEach((m) => { c[ESTADOS_PIEZA.indexOf(m[1])] += Number(m[2] || 1); });
      // Si no suman lo que pide la línea (alguien ha tocado la hoja a mano): sobran pendientes, o faltan
      let sobra = piezasDeLinea(c) - n;
      for (let j = 0; sobra > 0 && j < 3; j++) {
        const quita = Math.min(c[j], sobra);
        c[j] -= quita;
        sobra -= quita;
      }
      if (sobra < 0) c[0] -= sobra;
      return c;
    });
  }

  // Lo que se escribe en la hoja de una línea: «Impreso» si todas están igual; si no, «Pendiente ×1 · Impreso ×2»
  function textoPiezas(c) {
    const hay = ESTADOS_PIEZA.map((e, i) => [e, c[i]]).filter(([, k]) => k > 0);
    return hay.length === 1 ? hay[0][0] : hay.map(([e, k]) => `${e} ×${k}`).join(' · ');
  }

  // El estado del pedido según sus piezas: todas entregadas, «Entregado»; todas impresas, «Hecho»; y si vuelve a faltar
  // alguna, el que tenía antes de cambiar solo (`antes`; si no se sabe, «Confirmado»). Un cancelado no cambia
  const AUTOMATICOS = ['Hecho', 'Entregado'];
  function estadoSegunPiezas(estado, lista, antes) {
    if (estado === 'Cancelado' || !lista.length) return estado;
    const [pendientes, impresas] = lista.reduce((t, c) => t.map((v, i) => v + c[i]), [0, 0, 0]);
    if (!pendientes && !impresas) return 'Entregado';
    if (!pendientes) return 'Hecho';
    if (AUTOMATICOS.includes(estado)) return antes && !AUTOMATICOS.includes(antes) ? antes : 'Confirmado';
    return estado;
  }

  // Al poner a mano el estado del pedido: «Hecho» da por impresas las que faltaban y «Entregado», todas entregadas
  function piezasSegunEstado(estado, lista) {
    return lista.map(([a, b, c]) => (estado === 'Entregado' ? [0, 0, a + b + c] : estado === 'Hecho' ? [0, a + b, c] : [a, b, c]));
  }

  // ---- Lo cobrado de cada línea (a petición del usuario, 06/11/2026: entregaba un producto, se lo pagaban y no podía
  // apuntarlo): cuántas de sus piezas están cobradas. «Pagado» del pedido es que está todo cobrado ----
  const ESTADOS_COBRO = ['Sin cobrar', 'Cobrado'];
  const PARTE_COBRO = /^(Sin cobrar|Cobrado)(?: ×(\d+))?$/;

  // Las de cada línea, de la columna «Cobro de los productos» (como la de las piezas: «Cobrado» o «Sin cobrar ×1 ·
  // Cobrado ×2»); lo que falte o no se entienda, sin cobrar. Manda «Pagado»: marcado, todo cobrado; y sin marcar, si la
  // columna dice que todo, es que se ha desmarcado en la hoja (o desde una página de antes, que no sabe de esto): nada
  function cobros(texto, lineasPedido, pagado) {
    const enteras = lineasPedido.map((l) => Math.max(1, l.cantidad || 0));
    if (pagado) return enteras;
    const textos = String(texto || '').split(/\r?\n/);
    const lista = enteras.map((n, i) => {
      const partes = (textos[i] || '').trim().split(' · ').map((t) => t.trim().match(PARTE_COBRO));
      if (partes.some((m) => !m)) return 0;
      if (partes.length === 1 && !partes[0][2]) return partes[0][1] === 'Cobrado' ? n : 0;
      return Math.min(n, partes.reduce((t, m) => t + (m[1] === 'Cobrado' ? Number(m[2] || 1) : 0), 0));
    });
    return lista.every((k, i) => k >= enteras[i]) ? lista.map(() => 0) : lista;
  }

  // Lo que se escribe en la hoja de una línea de `n` piezas con `k` cobradas
  function textoCobro(n, k) {
    return k <= 0 ? 'Sin cobrar' : k >= n ? 'Cobrado' : `Sin cobrar ×${n - k} · Cobrado ×${k}`;
  }

  const todoCobrado = (lista) => lista.length > 0 && lista.every((l) => l.cobradas >= piezasDeLinea(l.piezas));

  // Las piezas de una línea por cómo van y si están cobradas: [[sin cobrar, cobradas] de las por imprimir, de las por
  // entregar y de las entregadas]. Lo cobrado cuenta primero para lo entregado y luego para lo impreso: se suele cobrar
  // al entregar, y quien paga antes paga las primeras que se le dan
  function reparto(piezasLinea, cobradas) {
    let quedan = cobradas;
    const r = [];
    for (const i of [2, 1, 0]) {
      const c = Math.min(piezasLinea[i], quedan);
      quedan -= c;
      r[i] = [piezasLinea[i] - c, c];
    }
    return r;
  }

  // ---- Los pasos de cada pieza (decisión del usuario, 06/11/2026: «primero confirmado, luego impreso, luego entregado
  // y luego cobrado»): 0 por imprimir (confirmado el pedido), 1 impresa, 2 entregada sin cobrar y 3 entregada y cobrada.
  // Lo que se guarda sigue siendo lo de siempre, las piezas de cada estado y cuántas están cobradas; esto es cómo se
  // ve y cómo se mueve. Una pieza cobrada sin entregar (pagada por adelantado) está en su paso y además cobrada ----
  const NOMBRES_PASO = ['Confirmado', 'Impreso', 'Entregado', 'Cobrado'];

  // → {cuantas: piezas en cada paso, adelantadas: cobradas sin entregar, hasta: cuántas han llegado a cada paso (al
  // menos), paso: el de la más adelantada}
  function enPasos(piezasLinea, cobradas) {
    const [a, b, c] = piezasLinea;
    const listas = Math.min(cobradas, c);
    const cuantas = [a, b, c - listas, listas];
    return { cuantas, adelantadas: cobradas - listas, hasta: [a + b + c, b + c, c, cobradas],
      paso: cuantas[3] ? 3 : cuantas[2] ? 2 : cuantas[1] ? 1 : 0 };
  }

  // Una pieza más llega al paso `t` (1 a 3): la más adelantada de las que van por detrás, pasando por los de en medio
  // (cobrar una que está por imprimir es imprimirla, entregarla y cobrarla). Lo cobrado cuenta primero para lo
  // entregado, así que una pagada por adelantado que se entrega queda cobrada. → [piezas, cobradas], o null si no hay
  function avanzar(piezasLinea, cobradas, t) {
    const pz = [...piezasLinea];
    let k = cobradas;
    const entregadasSinCobrar = () => pz[2] - Math.min(k, pz[2]);
    if (t === 3 && entregadasSinCobrar()) return [pz, k + 1];
    const desde = t === 1 ? [0] : [1, 0];
    const s = desde.find((i) => pz[i] > 0);
    if (s === undefined || t < 1 || t > 3) return null;
    pz[s]--;
    pz[Math.min(t, 2)]++;
    if (t === 3 && entregadasSinCobrar()) k++;
    return [pz, k];
  }

  // Una pieza del paso `t` (1 a 3) vuelve al anterior: una cobrada, a sin cobrar; una entregada sin cobrar, a impresa;
  // una impresa, a por imprimir. → [piezas, cobradas], o null si no hay ninguna en ese paso
  function retroceder(piezasLinea, cobradas, t) {
    const pz = [...piezasLinea];
    if (t === 3) return cobradas > 0 ? [pz, cobradas - 1] : null;
    if (t === 2 && pz[2] > Math.min(cobradas, pz[2])) { pz[2]--; pz[1]++; return [pz, cobradas]; }
    if (t === 1 && pz[1] > 0) { pz[1]--; pz[0]++; return [pz, cobradas]; }
    return null;
  }

  // Una línea de una pieza, al paso `t` (0 a 3): adelante, de golpe; atrás, paso a paso (de cobrada a impresa deja de
  // estar cobrada). Si al llevarla adelante queda más allá (estaba pagada por adelantado), se queda allí
  function ponerPaso(piezasLinea, cobradas, t) {
    let e = [piezasLinea, cobradas];
    if (enPasos(...e).paso < t) return avanzar(...e, t) || e;
    for (let i = 0; i < 3 && enPasos(...e).paso > t; i++) e = retroceder(...e, enPasos(...e).paso) || e;
    return e;
  }

  // Todas las piezas de una línea, al menos al paso `t`
  function todasAlPaso(piezasLinea, cobradas, t) {
    let e = [piezasLinea, cobradas];
    for (let i = 0; i < 300 && enPasos(...e).hasta[t] < piezasDeLinea(e[0]); i++) {
      const otro = avanzar(...e, t);
      if (!otro) break;
      e = otro;
    }
    return e;
  }

  // «↩ Una atrás» con varias piezas: la más adelantada vuelve un paso (si hay cobradas, deja de estar cobrada una)
  function unaAtras(piezasLinea, cobradas) {
    for (const t of [3, 2, 1]) {
      const e = retroceder(piezasLinea, cobradas, t);
      if (e) return e;
    }
    return null;
  }

  // Las piezas y lo cobrado de una línea; si no se han leído de la hoja (las pruebas del resumen), según el pedido
  const piezasDe = (p, l) => l.piezas || piezas('', [l], p.estado)[0];
  const cobradasDe = (p, l) => (l.cobradas === undefined ? (p.pagado ? piezasDeLinea(piezasDe(p, l)) : 0) : l.cobradas);
  const centimos = (x) => Math.round(x * 100) / 100;

  // Lo cobrado de un pedido: pagado, todo; si no, lo de sus piezas cobradas (nunca más que el total). Y lo que falta
  function cobradoDe(p) {
    if (p.pagado) return p.total || 0;
    return centimos(Math.min(p.total || 0, p.lineas.reduce((t, l) => t + cobradasDe(p, l) * (l.precio || 0), 0)));
  }
  const debeDe = (p) => centimos((p.total || 0) - cobradoDe(p));

  // Lo entregado y sin cobrar de un pedido: con todo entregado, lo que debe; si no, cada pieza entregada sin cobrar
  function entregadoSinCobrarDe(p) {
    if (p.pagado) return 0;
    const lista = p.lineas.map((l) => reparto(piezasDe(p, l), cobradasDe(p, l)));
    if (lista.length && lista.every((r) => !r[0][0] && !r[0][1] && !r[1][0] && !r[1][1])) return debeDe(p);
    return centimos(lista.reduce((t, r, i) => t + r[2][0] * (p.lineas[i].precio || 0), 0));
  }

  // Los filtros de los productos de un cliente (decisión del usuario, 06/11/2026), en dos grupos: cómo van (`pasos`:
  // los tres de las piezas) y el cobro (`cobro`). Dentro de un grupo vale cualquiera de los marcados; de grupos
  // distintos, los dos («Entregado» + «Por cobrar»: entregado y sin cobrar); un grupo sin nada marcado, todo.
  // → cuántas piezas de una línea (su reparto) coinciden
  const PASOS = ['imprimir', 'entregar', 'entregado'];
  const COBRO = ['cobrar', 'cobrado'];
  function coinciden(r, filtro) {
    const pasos = filtro.pasos && filtro.pasos.length ? filtro.pasos : PASOS;
    const cobro = filtro.cobro && filtro.cobro.length ? filtro.cobro : COBRO;
    return pasos.reduce((t, s) => t + cobro.reduce((u, c) => u + r[PASOS.indexOf(s)][COBRO.indexOf(c)], 0), 0);
  }

  // Los productos de un cliente uno a uno (cada línea de cada pedido, sin cancelados), del pedido más antiguo al más
  // nuevo, con su reparto y cuántas de sus piezas coinciden con el filtro. Los que no tienen ninguna no salen, salvo los
  // de `tambien` («número:línea» recién cambiados, para que no desaparezcan de golpe)
  function productosDe(pedidos, filtro = {}, tambien = new Set()) {
    const resultado = [];
    for (const p of [...pedidos].sort((x, y) => (x.numero || 0) - (y.numero || 0))) {
      if (p.estado === 'Cancelado') continue;
      p.lineas.forEach((l, i) => {
        const r = reparto(piezasDe(p, l), cobradasDe(p, l));
        const n = coinciden(r, filtro);
        if (n || tambien.has(`${p.numero}:${i}`)) resultado.push({ pedido: p, linea: l, indice: i, reparto: r, coinciden: n });
      });
    }
    return resultado;
  }

  function duracion(minutos) {
    const m = Math.round(minutos), h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`;
  }

  // Lo que queda por imprimir, del pedido más antiguo al más nuevo: una entrada por línea con piezas pendientes
  // (`tambien`: «número:línea» de las que se acaban de imprimir, para que no desaparezcan de golpe). Con `disponible`
  // (minutos), cuántas caben de cada una cogiéndolas en ese orden y saltando las que ya no caben, y `fin`, los minutos
  // hasta que acabarían contando las de antes; sin él, `fin` es lo que tardan las suyas
  function cola(pedidos, disponible = null, tambien = new Set()) {
    const entradas = [];
    for (const p of [...pedidos].sort((x, y) => (x.numero || 0) - (y.numero || 0))) {
      if (p.estado === 'Cancelado') continue;
      p.lineas.forEach((l, i) => {
        if (l.piezas && (l.piezas[0] > 0 || tambien.has(`${p.numero}:${i}`))) {
          entradas.push({ pedido: p, linea: l, indice: i, faltan: l.piezas[0], minutos: l.minutos || 0 });
        }
      });
    }
    let queda = disponible, usado = 0;
    for (const e of entradas) {
      if (disponible === null || !e.minutos) {
        e.caben = null;
        e.fin = e.minutos * e.faltan;
        continue;
      }
      e.caben = Math.min(e.faltan, Math.floor(queda / e.minutos));
      queda -= e.caben * e.minutos;
      usado += e.caben * e.minutos;
      e.fin = e.caben ? usado : null;
    }
    const suma = (f) => entradas.reduce((t, e) => t + f(e), 0);
    return { entradas, piezas: suma((e) => e.faltan), minutos: suma((e) => e.faltan * e.minutos),
      sin_tiempo: suma((e) => (e.minutos ? 0 : e.faltan)), caben: suma((e) => e.caben || 0), usado };
  }

  // Lo que queda por imprimir de todos los pedidos, junto por producto (su código o, sin él, su nombre) y, dentro, por
  // lo que eligió el cliente (colores y texto), sin importar de quién es: en el orden de la cola, lo más antiguo antes
  function porProducto(pedidos) {
    const productos = new Map();
    for (const { pedido, linea: l, faltan, minutos } of cola(pedidos).entradas) {
      const clave = l.ref || l.nombre.toLowerCase();
      let p = productos.get(clave);
      if (!p) {
        productos.set(clave, p = { ref: l.ref, nombre: l.nombre, foto: l.foto || '', enlace: '', piezas: 0, minutos: 0,
          variantes: new Map() });
      }
      // A dónde lleva su código (Printables o su ficha): el enlace de la hoja de cualquiera de sus pedidos
      p.enlace = p.enlace || (l.ref && (pedido.enlaces || {})[l.ref]) || '';
      p.piezas += faltan;
      p.minutos += faltan * minutos;
      p.variantes.set(l.detalle, (p.variantes.get(l.detalle) || 0) + faltan);
    }
    return [...productos.values()].map((p) => ({ ...p, variantes: [...p.variantes] }));
  }

  // Las cifras de un teléfono sin prefijo español: «+34 611 22 33 44», «0034611223344» y «611223344» son el mismo
  // (el autocompletado del móvil pone el +34 y a mano casi nadie lo escribe). Uno de otro país, con el suyo
  function cifras(telefono) {
    let d = String(telefono || '').replace(/\D/g, '');
    if (d.startsWith('00')) d = d.slice(2);
    return d.length === 11 && d.startsWith('34') ? d.slice(2) : d;
  }

  // Como se enseña: uno español, «611 223 344»; otro, tal cual
  function telefonoBonito(telefono) {
    const d = cifras(telefono);
    return d.length === 9 ? d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') : String(telefono || '').trim();
  }

  // La misma persona es el mismo teléfono (decisión del usuario); sin teléfono, por su nombre y apellidos
  function clienteDe(p) {
    const t = cifras(p.telefono);
    return t ? `t${t}` : `n${`${p.nombre || ''} ${p.apellidos || ''}`.toLowerCase().normalize('NFD')
      .replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim()}`;
  }

  // Los pedidos de cada cliente juntos, primero quien ha pedido hace menos: su nombre (el del último pedido), sus pedidos
  // del más nuevo al más antiguo, lo que ha gastado y lo que debe (sin cancelados; lo cobrado de cada pieza ya no lo
  // debe) y las piezas que le faltan por imprimir y por entregar
  function clientes(pedidos) {
    const grupos = new Map();
    for (const p of [...pedidos].sort((a, b) => (b.numero || 0) - (a.numero || 0))) {
      const clave = clienteDe(p);
      if (!grupos.has(clave)) {
        grupos.set(clave, { clave, nombre: `${p.nombre || ''} ${p.apellidos || ''}`.trim(), telefono: p.telefono || '', pedidos: [] });
      }
      grupos.get(clave).pedidos.push(p);
    }
    return [...grupos.values()].map((c) => {
      const vivos = c.pedidos.filter((p) => p.estado !== 'Cancelado');
      const contar = (i) => vivos.reduce((t, p) => t + p.lineas.reduce((s, l) => s + (l.piezas ? l.piezas[i] : 0), 0), 0);
      return { ...c, total: centimos(vivos.reduce((t, p) => t + (p.total || 0), 0)),
        debe: centimos(vivos.reduce((t, p) => t + debeDe(p), 0)), piezas: contar(0), entregar: contar(1) };
    });
  }

  // En qué pestaña va un pedido: cancelado; entregado y pagado, que ya no tiene nada que hacer («Entregados»); o
  // pendiente (lo demás: por hacer, hecho sin entregar, pagado por adelantado, entregado sin cobrar…)
  function seccion(p) {
    if (p.estado === 'Cancelado') return 'cancelados';
    return p.pagado && p.estado === 'Entregado' ? 'entregados' : 'pendientes';
  }

  // Cobrado, pendiente de cobro (sin cancelados), lo que queda por imprimir, lo más pedido y los colores que más se
  // piden (para comprar rollos). Lo cobrado y lo que falta, pieza a pieza (cobradoDe)
  function resumen(pedidos) {
    const vivos = pedidos.filter((p) => p.estado !== 'Cancelado');
    const productos = new Map(), colores = new Map();
    const contar = (mapa, clave, n) => mapa.set(clave, (mapa.get(clave) || 0) + n);
    for (const p of vivos) {
      for (const l of p.lineas) {
        contar(productos, l.nombre, l.cantidad);
        // «Blanco» o «Chapa: Negro · Letras: Oro»; el texto del cliente va el último y entre «», sin colores
        for (const parte of (l.detalle || '').split('«')[0].split(' · ')) {
          const color = (parte.includes(': ') ? parte.slice(parte.lastIndexOf(': ') + 2) : parte).trim();
          if (color) contar(colores, color, l.cantidad);
        }
      }
    }
    const suma = (lista, f = (p) => p.total) => centimos(lista.reduce((t, p) => t + f(p), 0));
    const deMasAMenos = (mapa) => [...mapa].sort((a, b) => b[1] - a[1]).slice(0, 10);  // empates: por orden de llegada
    const c = cola(pedidos);
    return {
      pedidos: pedidos.length, cancelados: pedidos.length - vivos.length, importe: suma(vivos),
      cobrado: suma(pedidos, cobradoDe), pendiente: suma(vivos, debeDe), entregado_sin_cobrar: suma(vivos, entregadoSinCobrarDe),
      por_imprimir: { piezas: c.piezas, minutos: c.minutos, sin_tiempo: c.sin_tiempo }, por_producto: porProducto(pedidos),
      mas_pedidos: deMasAMenos(productos), colores: deMasAMenos(colores),
    };
  }

  function el(etiqueta, clase, ...hijos) {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    e.append(...hijos.filter((h) => h !== null && h !== undefined && h !== false));
    return e;
  }

  function boton(texto, alPulsar, clase = '', desactivado = false) {
    const b = el('button', clase, texto);
    b.type = 'button';
    b.disabled = desactivado;
    b.addEventListener('click', alPulsar);
    return b;
  }

  function aviso(texto) {
    const t = document.getElementById('toast');
    t.textContent = texto;
    t.classList.add('show');
    clearTimeout(aviso.h);
    aviso.h = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function iniciar(fuente) {
    const $ = (id) => document.getElementById(id);
    const euros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
    const fecha = new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
    const hora = new Intl.DateTimeFormat('es-ES', { timeStyle: 'short' });
    const diaCorto = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' });
    const diaSemana = new Intl.DateTimeFormat('es-ES', { weekday: 'long' });
    const normalizar = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const ESPERA_PIEZAS = 900;  // ms: las piezas se guardan al rato, por si se tocan varias seguidas

    let datos = null;  // {pedidos, resumen, hoja, estados, formas, tiempos}
    let rollos = {};  // el nombre de cada rollo (como lo deja normalizar) → su color
    let filtro = 'pendientes';
    const abiertos = new Set();  // los pedidos desplegados (por su número): siguen así al volver a pintar la lista
    let clienteVisto = null;  // en «Clientes», el cliente cuya ficha se está viendo (por clienteDe); null, la lista
    let scrollLista = 0;  // dónde estaba la lista de clientes al abrir una ficha, para volver ahí
    const tarjetas = new Map();  // número → su tarjeta en la lista (se cambia entera al cambiar el pedido)
    const recien = new Set();  // «número:línea» impresas desde «Por imprimir»: siguen a la vista hasta cambiar de pestaña
    const notas = new Map();  // número → «Guardando en la hoja…» / «✓ Guardado»
    let leido = 0;  // cuándo se leyó la hoja por última vez
    let ocupada = 0;  // lecturas y cambios en marcha

    // «a las 18:40», «mañana a las 01:10» o «el jueves a las 10:00»: cuándo acabaría lo que se empieza ahora. Se pone
    // al día cada minuto (la página puede quedarse abierta)
    function textoFin(minutos) {
      const fin = new Date(Date.now() + minutos * 60000);
      const dias = Math.round((new Date(fin).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 86400000);
      const a = `a las ${hora.format(fin)}`;
      return dias === 0 ? a : dias === 1 ? `mañana ${a}` : `el ${diaSemana.format(fin)} ${a}`;
    }
    function fin(minutos) {
      const s = el('span', 'fin', textoFin(minutos));
      s.dataset.min = String(minutos);
      return s;
    }
    setInterval(() => document.querySelectorAll('.fin').forEach((s) => { s.textContent = textoFin(Number(s.dataset.min)); }),
      60000);

    // ---- Resumen: lo que falta por imprimir y por cobrar y lo que más se pide (también los colores, para los rollos) ----
    function pintarResumen() {
      const r = datos.resumen;
      const cifra = (num, que, clase = '') => el('div', `cifra ${clase}`, el('div', 'num', num), el('div', 'que', que));
      $('imprimir').replaceChildren(panelImprimir());
      $('resumen').replaceChildren(
        cifra(euros.format(r.pendiente), 'Pendiente de cobro', r.pendiente > 0 ? 'aviso' : ''),
        cifra(euros.format(r.entregado_sin_cobrar), 'Entregado y sin cobrar', r.entregado_sin_cobrar > 0 ? 'aviso' : ''),
        cifra(euros.format(r.cobrado), 'Cobrado', 'bien'),
        cifra(String(r.pedidos - r.cancelados), `Pedidos${r.cancelados ? ` (y ${r.cancelados} cancelados)` : ''}`, 'de-pedidos'),
        masPedido(r),
      );
    }

    // «Lo más pedido» y «Colores más pedidos», en un botón que se despliega por encima de lo demás (a petición del
    // usuario, 23/10/2026: abiertas, las listas quitaban sitio a los pedidos y los clientes). Se cierra al tocar fuera
    let verMasPedido = false;  // sigue abierto al volver a pintar el resumen (con cada cambio)
    function masPedido(r) {
      // `nombre` pinta cada fila: los productos, con su color; los colores, con su muestra
      const lista = (titulo, filas, nombre) => el('div', 'mas-pedido-lista', el('h3', '', titulo),
        filas.length ? el('ol', '', ...filas.map(([que, n]) => el('li', '', nombre(que), ' ', el('span', 'n', `× ${n}`))))
          : el('p', 'hint', 'Aún nada.'));
      const d = el('details', 'mas-pedido',
        el('summary', 'cifra', el('div', 'num', '📊'), el('div', 'que', 'Lo más pedido')),
        el('div', 'mas-pedido-caja',
          lista('Lo más pedido', r.mas_pedidos, (n) => el('span', 'nombre-producto', n)),
          lista('Colores más pedidos', r.colores, (c) => el('span', 'color', muestra(c), c))));
      d.open = verMasPedido;
      d.addEventListener('toggle', () => { verMasPedido = d.open; });
      return d;
    }
    const cerrarMasPedido = () => document.querySelectorAll('.mas-pedido[open]').forEach((d) => { d.open = false; });
    document.addEventListener('click', (e) => { if (!e.target.closest('.mas-pedido')) cerrarMasPedido(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarMasPedido(); });
    const piezasTexto = (n) => `${n} ${n === 1 ? 'pieza' : 'piezas'}`;

    // El panel de arriba: lo que queda por imprimir de todos los pedidos, por producto (porProducto). Se rehace con
    // cada cambio, así que al marcar una pieza en cualquier pedido se resta aquí. Abierto o plegado, como se dejó
    const PANEL = 'negoqr-pedidos-panel';
    let panelAbierto = true;
    try { panelAbierto = localStorage.getItem(PANEL) !== 'plegado'; } catch { /* sin almacén */ }
    function panelImprimir() {
      const { piezas, minutos, sin_tiempo: sinTiempo } = datos.resumen.por_imprimir;
      const productos = datos.resumen.por_producto;
      const panel = el('details', 'cifra lista panel-imprimir',
        el('summary', '', el('div', '', el('div', 'num', piezas ? duracion(minutos) : '—'),
          el('div', 'que', `Por imprimir: ${piezasTexto(piezas)}${sinTiempo ? `, ${sinTiempo} sin tiempo` : ''}`))),
        productos.length ? el('ul', 'imprimir-lista', ...productos.map((p) => {
          const [[detalle]] = p.variantes;
          return el('li', '',
            fotoProducto(p),
            el('div', 'datos',
              el('div', 'prod',
                el('div', 'izq', el('span', 'nombre nombre-producto', p.nombre), p.ref ? referencia(p.ref, p.enlace) : null),
                el('div', 'der', el('span', 'n', `× ${p.piezas}`), el('span', 't', p.minutos ? duracion(p.minutos) : 'sin tiempo'))),
              // Con una sola variante, su cuenta es la del producto: no se repite
              p.variantes.length > 1 || detalle ? el('ul', 'variantes', ...p.variantes.map(([d, n]) => el('li', '',
                d ? eleccion(d) : el('span', 'detalle', 'Sin color indicado'), p.variantes.length > 1 ? el('span', 'n', `× ${n}`) : null)))
                : null));
        })) : el('p', 'hint', 'No queda nada por imprimir.'));
      panel.open = panelAbierto;
      panel.addEventListener('toggle', () => {
        panelAbierto = panel.open;
        try { localStorage.setItem(PANEL, panel.open ? 'abierto' : 'plegado'); } catch { /* sin almacén */ }
      });
      return panel;
    }

    // La foto del producto (la del catálogo); sin foto, o si no carga, un hueco del mismo tamaño
    function fotoProducto(p) {
      const hueco = () => el('div', 'foto sin-foto', '📦');
      if (!p.foto) return hueco();
      const img = el('img', 'foto');
      Object.assign(img, { src: p.foto, alt: '', loading: 'lazy', decoding: 'async' });
      img.addEventListener('error', () => img.replaceWith(hueco()));
      return img;
    }

    // Un círculo del color del rollo («Mis filamentos»: pedidos.productos lo manda con los pedidos); de un color que ya
    // no tiene rollo, nada
    function muestra(nombre) {
      const color = rollos[normalizar(nombre).replace(/\s+/g, ' ').trim()];
      if (!color) return null;
      const s = el('span', 'muestra');
      s.style.background = color;
      return s;
    }

    // Lo que eligió el cliente («Chapa: Negro · Borde y letras: Amarillo · Nombre: «Milo»»): cada color con su muestra y,
    // aparte, el texto de los personalizados (va el último, entre «», y puede llevar « · » dentro)
    function eleccion(texto) {
      const t = String(texto || ''), i = t.indexOf('«');
      const corte = i < 0 ? -1 : t.lastIndexOf(' · ', i);
      const colores = i < 0 ? t : corte < 0 ? '' : t.slice(0, corte);
      const escrito = i < 0 ? '' : t.slice(corte < 0 ? 0 : corte + 3);
      return el('span', 'detalle', ...colores.split(' · ').map((x) => x.trim()).filter(Boolean).map((parte) =>
        el('span', 'color', muestra(parte.includes(': ') ? parte.slice(parte.lastIndexOf(': ') + 2) : parte), parte)),
      escrito ? el('span', 'escrito', escrito) : null);
    }

    // Cada cosa con su color (pedidos.css): el número del pedido, en violeta; el nombre del cliente, en rosa; el del
    // producto, en azul
    const numPedido = (p) => el('span', 'num-pedido', `Nº ${p.numero}`);

    // En el ordenador, el panel va en su columna, fijo al bajar por los pedidos: por debajo de la barra fija de arriba
    // (la de la app o la cabecera del móvil), que puede cambiar de alto
    const barraFija = [...document.querySelectorAll('.barra, .cabecera')].find((e) => getComputedStyle(e).position === 'sticky');
    const ponerArriba = () => document.documentElement.style.setProperty('--arriba', `${(barraFija ? barraFija.offsetHeight : 0) + 16}px`);
    addEventListener('resize', ponerArriba);
    ponerArriba();

    // ---- Lista: una pestaña por sección (seccion), «Por imprimir» (cola), «Por cobrar» y «Todos» ----
    const FILTROS = {
      pendientes: (p) => seccion(p) === 'pendientes',
      entregados: (p) => seccion(p) === 'entregados',
      cobrar: (p) => !p.pagado && p.estado !== 'Cancelado',
      cancelados: (p) => seccion(p) === 'cancelados',
      todos: () => true,
    };
    const NOMBRE_SECCION = { pendientes: 'Pendientes', entregados: 'Entregados', cancelados: 'Cancelados' };
    function ponerFiltro(f) {
      filtro = f;
      clienteVisto = null;
      recien.clear();
      document.querySelectorAll('[data-filtro]').forEach((x) => x.classList.toggle('activo', x.dataset.filtro === f));
      plan.hidden = f !== 'imprimir';
      pintarLista();
    }
    document.querySelectorAll('[data-filtro]').forEach((b) => b.addEventListener('click', () => ponerFiltro(b.dataset.filtro)));
    // Buscar en «Clientes» busca en la lista: si la ficha la tapa (pantalla estrecha), se cierra
    $('buscar').addEventListener('input', () => {
      if (filtro === 'clientes' && !ladoALado()) clienteVisto = null;
      pintarLista();
    });

    // «Tengo 6 h para imprimir»: en «Por imprimir» marca lo que cabe (se recuerda en este navegador)
    const HORAS = 'negoqr-pedidos-horas';
    const horas = el('input');
    Object.assign(horas, { type: 'number', min: '0', max: '200', step: '0.5', inputMode: 'decimal', placeholder: '—' });
    horas.setAttribute('aria-label', 'Horas que tienes para imprimir');
    try { horas.value = localStorage.getItem(HORAS) || ''; } catch { /* sin almacén */ }
    horas.addEventListener('input', () => {
      try { localStorage.setItem(HORAS, horas.value); } catch { /* sin almacén */ }
      if (datos) pintarLista();
    });
    const planTexto = el('p', 'plan-texto');
    const plan = el('div', 'plan-dia', el('label', 'plan-horas', 'Tengo', horas, 'h para imprimir'), planTexto);
    plan.hidden = true;
    $('lista').before(plan);

    // Cuántos hay en cada filtro, en su botón (en «Por imprimir», las piezas; en «Clientes», los clientes)
    function pintarCuentas() {
      document.querySelectorAll('[data-filtro]').forEach((b) => {
        let cuenta = b.querySelector('.cuenta');
        if (!cuenta) b.append(cuenta = el('span', 'cuenta'));
        const f = b.dataset.filtro;
        cuenta.textContent = String(f === 'imprimir' ? datos.resumen.por_imprimir.piezas
          : f === 'clientes' ? clientes(datos.pedidos).length : datos.pedidos.filter(FILTROS[f]).length);
      });
    }

    // El código del producto y, si la hoja tiene su enlace, a dónde lleva: su modelo en Printables (el nombre del pedido
    // está traducido y no se parece al de allí) o su ficha en el catálogo
    function referencia(ref, url) {
      if (!/^https:\/\//.test(url || '')) return el('span', 'ref', ref);
      const a = el('a', 'ref', `${ref} · ${/printables\.com/.test(url) ? 'Printables' : 'Ficha'} ↗`);
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = 'Abrir el producto';
      return a;
    }

    // WhatsApp sí necesita el prefijo: a uno español sin él se le pone el 34
    function waDe(telefono) {
      const d = cifras(telefono);
      return d.length === 9 ? `34${d}` : d;
    }

    function whatsapp(telefono) {
      const a = el('a', 'tel', telefonoBonito(telefono));
      a.href = `https://wa.me/${waDe(telefono)}`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = 'Escribirle por WhatsApp';
      return a;
    }

    const VACIO = {
      pendientes: 'No hay pedidos pendientes.', entregados: 'Aún no hay pedidos entregados y pagados.',
      cobrar: 'No hay nada por cobrar.', cancelados: 'No hay pedidos cancelados.', todos: 'No hay pedidos.',
      imprimir: 'No queda nada por imprimir.',
    };

    function pintarLista() {
      tarjetas.clear();
      if (filtro === 'imprimir') { pintarCola(); return; }
      if (filtro === 'clientes') { pintarClientes(); return; }
      const busca = normalizar($('buscar').value.trim());
      const pedidos = datos.pedidos.filter(FILTROS[filtro]).filter((p) => !busca || normalizar(
        `${p.numero} ${p.nombre} ${p.apellidos} ${p.telefono} ${telefonoBonito(p.telefono)} ${p.productos} ${p.comentario}`).includes(busca));
      $('lista').replaceChildren(...(pedidos.length ? pedidos.map((p) => tarjeta(p))
        : [el('p', 'vacio', !datos.pedidos.length ? 'Aún no ha llegado ningún pedido desde la web.'
          : busca ? 'Ningún pedido coincide.' : VACIO[filtro])]));
    }

    // Lo que tarda una línea: cada pieza y, si faltan, cuándo acabarían si se empiezan ya. Con `plan` (en «Por
    // imprimir» con horas), cuántas caben y cuándo acabarían después de las de antes
    function tiempoLinea(l, plan = null) {
      if (!l.minutos) {
        const s = el('span', 'tiempo sin', '⏱ Sin tiempo de impresión');
        s.title = 'Este producto no tiene tiempo: se saca al laminarlo en Productos';
        return s;
      }
      const n = piezasDeLinea(l.piezas), faltan = l.piezas[0];
      const s = el('span', 'tiempo', `⏱ ${duracion(l.minutos)}${n > 1 ? ' cada pieza' : ''}`);
      if (!faltan) return s;
      if (plan) {
        if (plan.caben) {
          s.append(` · ${plan.caben > 1 ? `las ${plan.caben}: ${duracion(plan.caben * l.minutos)}; ` : ''}con lo de arriba, acabas `,
            fin(plan.fin));
        } else if (faltan > 1) {
          s.append(` · las ${faltan}: ${duracion(faltan * l.minutos)}`);
        }
      } else if (n === 1) {
        s.append(' · si empiezas ya, acaba ', fin(l.minutos));
      } else {
        s.append(` · ${faltan === n ? `las ${n}` : faltan === 1 ? 'la que falta' : `las ${faltan} que faltan`}: `
          + `${duracion(faltan * l.minutos)}, ${faltan === 1 ? 'acaba' : 'acaban'} `, fin(faltan * l.minutos));
      }
      return s;
    }

    // Cómo va una línea, en pasos seguidos (NOMBRES_PASO, decisión del usuario, 06/11/2026: «Confirmado · Impreso ·
    // Entregado · Cobrado»), en una barra. Con una pieza, se toca el paso o se desliza hasta él (deslizable); con varias,
    // cada paso dice cuántas han llegado y al tocarlo llega una más, y debajo «✓ Las 3: Impreso» y «↩ Una atrás». En un
    // pedido sin confirmar, el primer paso lo confirma (y avanzar cualquier pieza, también). Entregada y sin cobrar,
    // «Cobrado» se ve en ámbar con lo que falta cobrar
    function pasosLinea(p, l) {
      const n = piezasDeLinea(l.piezas);
      const e = enPasos(l.piezas, l.cobradas);
      const confirmado = p.estado !== 'Pendiente';
      const caja = el('div', 'pasos-caja');
      const cambiar = (nuevo, opciones) => cambiarLinea(p, l, nuevo, caja, opciones);
      const ir = (t) => {
        if (t === 0) cambiar(n === 1 ? ponerPaso(l.piezas, l.cobradas, 0) : [l.piezas, l.cobradas], { confirmar: true });
        else if (n === 1) cambiar(ponerPaso(l.piezas, l.cobradas, t));
        else if (e.hasta[t] >= n) aviso(`Ya están las ${n} en «${NOMBRES_PASO[t]}»`);
        else cambiar(avanzar(l.piezas, l.cobradas, t));
      };
      let deslizado = 0;  // cuándo se soltó al deslizar: el clic que viene detrás no cuenta, ya está hecho
      const tocar = (t) => { if (Date.now() - deslizado > 500) ir(t); };
      const pasos = NOMBRES_PASO.map((nombre, i) => {
        const llegadas = i === 0 ? (confirmado ? n : 0) : e.hasta[i];
        const actual = n === 1 && i === (confirmado || e.paso ? e.paso : -1);
        const porCobrar = i === 3 && e.cuantas[2] > 0;
        const sub = n > 1 ? `${llegadas}/${n}` : porCobrar && l.precio ? euros.format(e.cuantas[2] * l.precio)
          : i === 3 && e.adelantadas ? 'por adelantado' : '';
        const b = el('button', ['paso', `p${i}`, llegadas >= n ? 'hecho' : llegadas ? 'parcial' : '', actual ? 'actual' : '',
          porCobrar ? 'por-cobrar' : '', i === 0 && !confirmado ? 'sin-confirmar' : ''].filter(Boolean).join(' '),
        el('span', 'nombre', nombre), sub ? el('span', 'sub', sub) : null);
        b.type = 'button';
        if (n > 1) b.style.setProperty('--lleno', `${Math.round((llegadas / n) * 100)}%`);
        b.title = i === 0 ? (confirmado ? 'Confirmado' : 'Confirmar el pedido')
          : n === 1 ? `Pasar a «${nombre}»` : `Una más a «${nombre}»`;
        b.setAttribute('aria-pressed', String(llegadas >= n));
        b.addEventListener('click', () => tocar(i));
        return b;
      });
      const pista = el('div', `pasos-pieza${n > 1 ? ' varias' : ''}`, ...pasos);
      pista.setAttribute('role', 'group');
      pista.setAttribute('aria-label', `Cómo va ${l.nombre}`);
      if (n === 1) deslizable(pista, (t) => { deslizado = Date.now(); ir(t); });
      caja.append(pista);
      if (n > 1) {
        const menor = e.cuantas.findIndex((x) => x > 0);
        const botones = [];
        if (menor >= 0 && menor < 3) {
          botones.push(boton(`✓ Las ${n}: ${NOMBRES_PASO[menor + 1]}`,
            () => cambiar(todasAlPaso(l.piezas, l.cobradas, menor + 1)), 'hacer'));
        }
        if (e.hasta[1] || l.cobradas) {
          const atras = boton('↩ Una atrás', () => cambiar(unaAtras(l.piezas, l.cobradas)), 'deshacer');
          atras.title = 'La más adelantada vuelve un paso';
          botones.push(atras);
        }
        if (botones.length) caja.append(el('div', 'pasar', ...botones));
      }
      return caja;
    }

    // Deslizar el dedo (o el ratón) por la barra de una pieza: al soltar, va al paso donde se suelta. Solo lo que va de
    // lado: arriba y abajo sigue moviendo la página (touch-action en pedidos.css). Tocar un paso también vale: son botones
    function deslizable(pista, alSoltar) {
      let gesto = null;
      const pasoEn = (x) => {
        const r = pista.getBoundingClientRect();
        return Math.max(0, Math.min(NOMBRES_PASO.length - 1, Math.floor(((x - r.left) / r.width) * NOMBRES_PASO.length)));
      };
      const apuntar = (t) => pista.querySelectorAll('.paso').forEach((b, i) => b.classList.toggle('apuntado', i === t));
      pista.addEventListener('pointerdown', (ev) => {
        if (ev.button === 0) gesto = { id: ev.pointerId, x: ev.clientX, moviendo: false };
      });
      pista.addEventListener('pointermove', (ev) => {
        if (!gesto || ev.pointerId !== gesto.id) return;
        if (!gesto.moviendo && Math.abs(ev.clientX - gesto.x) > 10) {
          gesto.moviendo = true;
          pista.setPointerCapture(ev.pointerId);
          pista.classList.add('deslizando');
        }
        if (gesto.moviendo) apuntar(pasoEn(ev.clientX));
      });
      const acabar = (ev, vale) => {
        if (!gesto || ev.pointerId !== gesto.id) return;
        const { moviendo } = gesto;
        gesto = null;
        pista.classList.remove('deslizando');
        apuntar(-1);
        if (moviendo && vale) alSoltar(pasoEn(ev.clientX));
      };
      pista.addEventListener('pointerup', (ev) => acabar(ev, true));
      pista.addEventListener('pointercancel', (ev) => acabar(ev, false));
    }

    // «¿Cómo ha pagado?», con un botón por forma de pago, «Sin indicar» y «Cancelar»
    function preguntaForma(alElegir, alCancelar) {
      return el('div', 'pregunta-forma', el('span', 'que', '¿Cómo ha pagado?'),
        ...datos.formas.map((f) => boton(f, () => alElegir(f))), boton('Sin indicar', () => alElegir('')),
        boton('Cancelar', alCancelar, 'cancelar'));
    }

    function nota(numero) {
      const s = el('span', 'guardando', notas.get(numero) || '');
      s.dataset.nota = String(numero);
      return s;
    }
    function ponerNota(numero, texto) {
      if (texto) notas.set(numero, texto); else notas.delete(numero);
      document.querySelectorAll(`[data-nota="${numero}"]`).forEach((s) => { s.textContent = texto; });
    }

    // Cada pedido, plegado en una línea (número, cliente y estado): al tocarla se despliega con todo lo demás. En la
    // ficha de un cliente (`cliente`), la línea lleva la fecha y el total en vez del nombre (ya está arriba), salvo que
    // el pedido vaya a otro nombre, y el WhatsApp no se repite
    function tarjeta(p, cliente = null) {
      const tel = cliente ? null : whatsapp(p.telefono);
      const valida = p.fecha && !Number.isNaN(Date.parse(p.fecha));
      const cuando = valida ? fecha.format(new Date(p.fecha)) : p.fecha;
      const nombre = `${p.nombre} ${p.apellidos}`.trim();
      const quien = !cliente ? el('span', 'quien nombre-cliente', nombre)
        : el('span', 'quien en-ficha', el('span', 'cuando', el('span', '', valida ? diaCorto.format(new Date(p.fecha)) : p.fecha || ''),
          ' ', el('span', '', `· ${euros.format(p.total)}`)), normalizar(nombre) !== normalizar(cliente.nombre)
          ? el('span', 'otro-nombre', 'a nombre de ', el('span', 'nombre-cliente', nombre || 'sin nombre')) : null);
      const vivo = p.estado !== 'Cancelado';
      // Cada línea con la foto del producto al lado
      const lineasPedido = el('ul', 'lineas', ...p.lineas.map((l) => el('li', 'linea', fotoProducto(l), el('div', 'linea-datos',
        l.cantidad ? el('div', 'linea-que', `${l.cantidad} × `, el('span', 'nombre-producto', l.nombre), ' ',
          el('span', 'precio', `(${euros.format(l.precio)})`)) : el('div', 'linea-que', l.nombre),
        l.detalle ? eleccion(l.detalle) : null,
        l.ref ? referencia(l.ref, (p.enlaces || {})[l.ref]) : null,
        vivo ? tiempoLinea(l) : null,
        vivo ? pasosLinea(p, l) : null))));
      const falta = vivo ? p.lineas.reduce((t, l) => t + l.piezas[0] * (l.minutos || 0), 0) : 0;

      const estado = el('select');
      datos.estados.forEach((e) => estado.append(new Option(e, e, false, e === p.estado)));
      if (!datos.estados.includes(p.estado)) estado.append(new Option(p.estado || '—', p.estado, true, true));
      // «Pagado» es todo cobrado; con parte de sus piezas cobradas, a medias (y dice cuánto)
      const cobrado = cobradoDe(p), aMedias = !p.pagado && cobrado > 0;
      const pagado = el('input');
      pagado.type = 'checkbox';
      pagado.checked = p.pagado;
      pagado.indeterminate = aMedias;
      const forma = el('select');
      forma.append(new Option('—', ''));
      datos.formas.forEach((f) => forma.append(new Option(f, f, false, f === p.forma)));
      // Al marcarlo pagado sin forma de pago, se pregunta antes cómo ha pagado: si así queda entregado y pagado, se va
      // a «Entregados» y luego habría que ir a buscarlo para ponérsela
      const pagarCon = (f) => () => {
        pregunta.hidden = true;
        aplicar(p, () => { pagarTodo(p, true); p.forma = f; });
      };
      const pregunta = preguntaForma((f) => pagarCon(f)(), () => {
        pregunta.hidden = true;
        pagado.checked = false;
        pagado.indeterminate = aMedias;
      });
      pregunta.hidden = true;

      // Corta, para que quepa el nombre: «Sin cobrar» es entregado sin cobrar (va en ámbar, como su borde)
      const etiqueta = el('span', 'etiqueta', p.estado === 'Entregado' && !p.pagado ? 'Sin cobrar'
        : `${p.estado || '—'}${p.pagado && p.estado !== 'Entregado' ? ' · pagado' : aMedias ? ' · pagado en parte' : ''}`);
      const caja = el('details', 'pedido',
        el('summary', 'pedido-linea', numPedido(p), quien, etiqueta),
        el('div', 'pedido-cuerpo',
          el('div', 'pedido-cab', el('span', 'fecha', cuando), el('span', 'total', euros.format(p.total)),
            falta ? el('span', 'falta', `⏱ Falta imprimir ${duracion(falta)}`) : null, tel),
          lineasPedido,
          p.comentario ? el('p', 'comentario', `«${p.comentario}»`) : null,
          el('div', 'pedido-acciones',
            el('label', 'campo-estado', 'Estado', estado),
            el('label', 'campo-pagado', pagado, 'Pagado',
              aMedias ? el('span', 'en-parte', `${euros.format(cobrado)} de ${euros.format(p.total)}`) : null),
            el('label', 'campo-forma', 'Forma de pago', forma),
            pregunta,
            nota(p.numero))));
      caja.classList.toggle('pagado', p.pagado);
      // Ámbar si hay algo entregado sin cobrar
      caja.classList.toggle('por-cobrar', vivo && entregadoSinCobrarDe(p) > 0);
      caja.classList.toggle('cancelado', !vivo);
      caja.open = abiertos.has(p.numero);
      caja.addEventListener('toggle', () => { if (caja.open) abiertos.add(p.numero); else abiertos.delete(p.numero); });

      // El estado a mano: «Hecho» da por impresas las piezas que faltaban y «Entregado», todas entregadas
      estado.addEventListener('change', () => {
        const nuevo = estado.value;
        aplicar(p, () => {
          const lista = piezasSegunEstado(nuevo, p.lineas.map((l) => l.piezas));
          p.lineas.forEach((l, i) => { l.piezas = lista[i]; });
          p.estado = nuevo;
          p.estadoAntes = undefined;
        });
      });
      // Marcarlo, todas sus piezas cobradas (también por adelantado); desmarcarlo, ninguna
      pagado.addEventListener('change', () => {
        if (pagado.checked && !forma.value) {
          pregunta.hidden = false;
          return;
        }
        pregunta.hidden = true;
        aplicar(p, () => pagarTodo(p, pagado.checked));
      });
      forma.addEventListener('change', () => {
        if (!pregunta.hidden) { pagarCon(forma.value)(); return; }  // contesta a «¿Cómo ha pagado?» con la lista
        aplicar(p, () => { p.forma = forma.value; });
      });
      tarjetas.set(p.numero, caja);
      return caja;
    }

    function pagarTodo(p, si) {
      p.pagado = si;
      p.lineas.forEach((l) => { l.cobradas = si ? piezasDeLinea(l.piezas) : 0; });
    }

    // ---- «Clientes»: una lista de contactos (clientes); al tocar uno, su ficha (decisión del usuario, 23/10/2026:
    // desplegados en la lista no se veía de quién era cada pedido). En pantallas anchas, la lista y la ficha van una al
    // lado de la otra (decisión del usuario, 06/11/2026); en las estrechas, al tocar un cliente se ve su ficha sola ----
    function pintarClientes() {
      const todos = clientes(datos.pedidos);
      const visto = clienteVisto && todos.find((c) => c.clave === clienteVisto);
      if (!visto) clienteVisto = null;
      const busca = normalizar($('buscar').value.trim());
      const lista = todos.filter((c) => !busca || normalizar(`${c.nombre} ${c.telefono} ${telefonoBonito(c.telefono)} ${c.pedidos.map(
        (p) => `${p.numero} ${p.nombre} ${p.apellidos} ${p.productos} ${p.comentario}`).join(' ')}`).includes(busca));
      // Se rehace con cada cambio: la lista sigue donde estaba (al lado de la ficha, se baja por ella sola)
      const antes = $('lista').querySelector('.clientes-lista');
      const bajada = antes ? antes.scrollTop : 0;
      const filas = el('div', 'clientes-lista', ...(lista.length ? lista.map((c) => filaCliente(c, c === visto))
        : [el('p', 'vacio', datos.pedidos.length ? 'Ningún cliente coincide.' : 'Aún no ha llegado ningún pedido desde la web.')]));
      $('lista').replaceChildren(el('div', `clientes-panel${visto ? ' con-ficha' : ''}`, filas,
        el('div', 'clientes-ficha', visto ? fichaCliente(visto)
          : el('p', 'ficha-vacia', 'Elige un cliente para ver sus productos y sus pedidos.'))));
      filas.scrollTop = bajada;
    }

    // ¿La lista de clientes y la ficha, una al lado de la otra? Lo decide pedidos.css según el ancho que hay
    function ladoALado() {
      const panel = $('lista').querySelector('.clientes-panel');
      return !!panel && getComputedStyle(panel).getPropertyValue('--lado-a-lado').trim() === '1';
    }

    // «MC» de «Maleni Carmona Marín», sobre un color que sale de su clave: el mismo cliente, siempre el mismo color
    function avatar(c) {
      const palabras = (c.nombre || '?').split(/\s+/).filter(Boolean);
      const s = el('span', 'avatar', palabras.slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?');
      let h = 0;
      for (const ch of c.clave) h = (h * 31 + ch.charCodeAt(0)) % 360;
      s.style.background = `hsl(${h}, 42%, 30%)`;
      return s;
    }

    // Una fila por cliente: quién es, su teléfono, lo que debe, lo que le falta por imprimir y cuántos pedidos lleva. La
    // del que se está viendo, resaltada
    function filaCliente(c, visto = false) {
      const n = c.pedidos.length;
      const fila = el('button', `cliente-fila${visto ? ' activo' : ''}`, avatar(c),
        el('span', 'quien-caja',
          el('span', 'quien nombre-cliente', c.nombre || 'Sin nombre'),
          el('span', 'tel-texto', [c.telefono ? telefonoBonito(c.telefono) : null, `${n} ${n === 1 ? 'pedido' : 'pedidos'}`]
            .filter(Boolean).join(' · ')),
          el('span', 'chips',
            c.debe > 0 ? el('span', 'chip debe', `debe ${euros.format(c.debe)}`)
              : c.total ? el('span', 'chip al-dia', 'todo cobrado') : null,
            c.piezas ? el('span', 'chip piezas', `⏱ ${c.piezas} por imprimir`) : null,
            c.entregar ? el('span', 'chip entregar', `${c.entregar} por entregar`) : null)),
        el('span', 'ir', '›'));
      fila.type = 'button';
      if (visto) fila.setAttribute('aria-current', 'true');
      fila.addEventListener('click', () => abrirCliente(c));
      return fila;
    }

    // La ficha: arriba quién es, su WhatsApp y sus cuentas; luego sus productos uno a uno, con sus pasos y filtros
    // (productosCliente), y debajo sus pedidos plegados, del más nuevo al más antiguo, para lo que es de todo el pedido
    function fichaCliente(c) {
      const n = c.pedidos.length;
      const wa = c.telefono ? whatsapp(c.telefono) : null;
      if (wa) { wa.className = 'boton-wa'; wa.textContent = '💬 WhatsApp'; }
      const dato = (num, que, clase = '') => el('div', `dato ${clase}`, el('div', 'num', num), el('div', 'que', que));
      return el('section', 'ficha-cliente',
        el('div', 'ficha-arriba', boton('← Clientes', cerrarCliente, 'volver'), wa),
        el('div', 'ficha-cab', avatar(c),
          el('div', 'quien-caja', el('h2', 'quien nombre-cliente', c.nombre || 'Sin nombre'),
            c.telefono ? el('span', 'tel-texto', telefonoBonito(c.telefono)) : null)),
        el('div', 'ficha-datos',
          dato(euros.format(c.debe), 'Debe', c.debe > 0 ? 'aviso' : 'bien'),
          dato(euros.format(c.total), 'Ha gastado'),
          dato(c.piezas ? piezasTexto(c.piezas) : '—', 'Por imprimir')),
        productosCliente(c),
        el('h3', 'ficha-titulo', `${n} ${n === 1 ? 'pedido' : 'pedidos'}`),
        el('div', 'ficha-pedidos', ...c.pedidos.map((p) => tarjeta(p, c))));
    }

    // Sus productos uno a uno (productosDe; a petición del usuario, 06/11/2026, que eligió los filtros combinables), con
    // los filtros en dos grupos, que se recuerdan en este navegador: cómo van y el cobro. Cada botón dice cuántas piezas
    // hay en lo suyo con lo marcado en el otro grupo; arriba, cuántas se ven, lo que debe de ellas y lo que falta imprimir
    const FILTRO_PRODUCTOS = 'negoqr-pedidos-filtro-productos';
    const BOTONES_PRODUCTOS = [
      { grupo: 'pasos', valor: 'imprimir', texto: 'Por imprimir' }, { grupo: 'pasos', valor: 'entregar', texto: 'Por entregar' },
      { grupo: 'pasos', valor: 'entregado', texto: 'Entregado' },
      { grupo: 'cobro', valor: 'cobrar', texto: 'Por cobrar' }, { grupo: 'cobro', valor: 'cobrado', texto: 'Cobrado' },
    ];
    let filtroProductos = { pasos: [], cobro: [] };
    try {
      const f = JSON.parse(localStorage.getItem(FILTRO_PRODUCTOS) || 'null');
      if (f) {
        filtroProductos = { pasos: PASOS.filter((x) => (f.pasos || []).includes(x)), cobro: COBRO.filter((x) => (f.cobro || []).includes(x)) };
      }
    } catch { /* sin almacén o roto: todo */ }
    function ponerFiltroProductos(f) {
      filtroProductos = f;
      try { localStorage.setItem(FILTRO_PRODUCTOS, JSON.stringify(f)); } catch { /* sin almacén */ }
      recien.clear();
      pintarLista();
    }

    function productosCliente(c) {
      const f = filtroProductos;
      const todos = productosDe(c.pedidos);
      const piezasCon = (filtro) => todos.reduce((t, e) => t + coinciden(e.reparto, filtro), 0);
      const sinFiltro = !f.pasos.length && !f.cobro.length;
      const botonFiltro = (texto, activo, clase, alPulsar, cuenta = null) => {
        const b = el('button', `filtro-producto ${clase}${activo ? ' activo' : ''}`, texto,
          cuenta === null ? null : el('span', 'cuenta', String(cuenta)));
        b.type = 'button';
        b.setAttribute('aria-pressed', String(activo));
        b.addEventListener('click', alPulsar);
        return b;
      };
      const botones = BOTONES_PRODUCTOS.map(({ grupo, valor, texto }) => {
        const activo = f[grupo].includes(valor);
        return botonFiltro(texto, activo, `f-${valor}`, () => ponerFiltroProductos({ ...f,
          [grupo]: activo ? f[grupo].filter((x) => x !== valor) : [...f[grupo], valor] }), piezasCon({ ...f, [grupo]: [valor] }));
      });
      const filtros = el('div', 'filtros-productos', el('div', 'grupo', ...botones.slice(0, 3)),
        el('div', 'grupo', ...botones.slice(3),
          botonFiltro('Todo', sinFiltro, 'f-todo', () => { if (!sinFiltro) ponerFiltroProductos({ pasos: [], cobro: [] }); })));
      filtros.setAttribute('role', 'group');
      filtros.setAttribute('aria-label', 'Filtrar sus productos');

      const vistos = productosDe(c.pedidos, f, recien);
      // De lo que se ve, lo que debe y lo que falta por imprimir (si el filtro deja ver algo de eso)
      const solo = (grupo, valor) => (f[grupo].length && !f[grupo].includes(valor) ? null : { ...f, [grupo]: [valor] });
      const conDebe = solo('cobro', 'cobrar'), conImprimir = solo('pasos', 'imprimir');
      const debe = conDebe ? centimos(vistos.reduce((t, e) => t + coinciden(e.reparto, conDebe) * (e.linea.precio || 0), 0)) : 0;
      const minutos = conImprimir ? vistos.reduce((t, e) => t + coinciden(e.reparto, conImprimir) * (e.linea.minutos || 0), 0) : 0;
      const cuenta = [piezasTexto(vistos.reduce((t, e) => t + e.coinciden, 0)), debe ? `debe ${euros.format(debe)}` : '',
        minutos ? `⏱ ${duracion(minutos)}` : ''].filter(Boolean).join(' · ');
      const comentados = new Set();
      return el('section', 'productos-cliente',
        el('div', 'productos-cab', el('h3', 'ficha-titulo', 'Productos'), el('span', 'productos-cuenta', cuenta)),
        filtros,
        vistos.length ? el('div', 'productos-lista', ...vistos.map((e) => filaProducto(e, comentados)))
          : el('p', 'vacio', todos.length ? 'Nada con estos filtros.' : 'Aún no tiene productos.'));
    }

    // Un producto del cliente: de qué pedido es (al tocarlo, se abre abajo), qué eligió, lo que debe de él y su barra de
    // pasos (pasosLinea). El comentario de cada pedido va con el primero suyo que se vea, por si dice cómo hacerlo
    function filaProducto({ pedido: p, linea: l }, comentados) {
      const n = piezasDeLinea(l.piezas), sinCobrar = n - l.cobradas;
      const valida = p.fecha && !Number.isNaN(Date.parse(p.fecha));
      const ir = el('button', 'ir-pedido', numPedido(p), valida ? el('span', 'cuando', diaCorto.format(new Date(p.fecha))) : null);
      ir.type = 'button';
      ir.title = 'Ver el pedido';
      ir.addEventListener('click', () => verEnFicha(p));
      const marca = !sinCobrar ? el('span', 'marca cobrada', '✓ Cobrado')
        : el('span', 'marca debe', sinCobrar * l.precio > 0 ? `Debe ${euros.format(sinCobrar * l.precio)}` : 'Sin cobrar');
      const comentario = p.comentario && !comentados.has(p.numero);
      if (comentario) comentados.add(p.numero);
      const hecho = !l.piezas[0] && !l.piezas[1] && !sinCobrar;
      return el('div', `producto-cliente${hecho ? ' hecho' : ''}`,
        el('div', 'cola-cab', ir, p.estado === 'Pendiente' ? el('span', 'sin-confirmar', 'sin confirmar') : null, marca),
        el('div', 'linea', fotoProducto(l), el('div', 'linea-datos',
          l.cantidad ? el('div', 'cola-que', `${n} × `, el('span', 'nombre-producto', l.nombre), ' ',
            el('span', 'precio', `(${euros.format(l.precio)})`)) : el('div', 'cola-que', l.nombre),
          l.detalle ? eleccion(l.detalle) : null,
          l.ref ? referencia(l.ref, (p.enlaces || {})[l.ref]) : null,
          l.piezas[0] ? tiempoLinea(l) : null,
          comentario ? el('p', 'comentario-pedido', `«${p.comentario}»`) : null,
          pasosLinea(p, l))),
        nota(p.numero));
    }

    // Desde un producto de la ficha, su pedido: abajo, desplegado
    function verEnFicha(p) {
      abiertos.add(p.numero);
      pintarLista();
      const caja = tarjetas.get(p.numero);
      if (caja) caja.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    // Abrir una ficha deja una entrada en el historial: el «atrás» del móvil vuelve a la lista, donde se estaba. Pasar de
    // un cliente a otro (con la lista al lado) cambia esa entrada en vez de añadir otra
    function abrirCliente(c) {
      const lado = ladoALado();
      if (!clienteVisto) scrollLista = scrollY;
      const habia = clienteVisto && history.state && history.state.negoqrCliente;
      clienteVisto = c.clave;
      recien.clear();
      if (habia) history.replaceState({ negoqrCliente: c.clave }, ''); else history.pushState({ negoqrCliente: c.clave }, '');
      pintarLista();
      ponerArriba();  // la barra fija puede haber cambiado de alto desde que se midió
      const arriba = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--arriba')) || 16;
      const tope = Math.max(0, $('lista').getBoundingClientRect().top + scrollY - arriba);
      // Con la lista al lado, solo si el principio de la ficha ha quedado por encima
      if (!lado || scrollY > tope) scrollTo(0, tope);
    }
    function cerrarCliente() {
      if (history.state && history.state.negoqrCliente) history.back();  // y popstate vuelve a la lista
      else volverALista();
    }
    function volverALista() {
      const lado = ladoALado();
      clienteVisto = null;
      if (filtro !== 'clientes') return;
      pintarLista();
      if (!lado) scrollTo(0, scrollLista);
    }
    addEventListener('popstate', () => { if (clienteVisto) volverALista(); });

    // ---- «Por imprimir»: las piezas que faltan de todos los pedidos, del más antiguo al más nuevo ----
    function pintarCola() {
      const h = Number(horas.value.replace(',', '.'));
      const disponible = horas.value.trim() && h > 0 ? h * 60 : null;
      const c = cola(datos.pedidos, disponible, recien);
      if (!c.piezas) {
        planTexto.textContent = 'No queda nada por imprimir.';
      } else if (disponible === null) {
        planTexto.replaceChildren(`${piezasTexto(c.piezas)} por imprimir: ${duracion(c.minutos)}`
          + `${c.sin_tiempo ? ` y ${c.sin_tiempo} sin tiempo` : ''}. Pon las horas que tienes y te marco lo que cabe.`);
      } else if (c.caben) {
        planTexto.replaceChildren(`Caben ${c.caben} de ${piezasTexto(c.piezas)} (${duracion(c.usado)}): si empiezas ya, `
          + 'acabas ', fin(c.usado), `.${c.sin_tiempo ? ` Las que no tienen tiempo (${c.sin_tiempo}) no cuentan.` : ''}`);
      } else {
        const corta = Math.min(...c.entradas.filter((e) => e.minutos && e.faltan).map((e) => e.minutos));
        planTexto.textContent = Number.isFinite(corta) ? `En ${duracion(disponible)} no cabe ninguna: la más corta tarda `
          + `${duracion(corta)}.` : 'Ninguna tiene tiempo de impresión: no sé qué cabe.';
      }
      const busca = normalizar($('buscar').value.trim());
      const entradas = c.entradas.filter(({ pedido: p, linea: l }) => !busca || normalizar(
        `${p.numero} ${p.nombre} ${p.apellidos} ${l.ref} ${l.nombre} ${l.detalle}`).includes(busca));
      $('lista').replaceChildren(...(entradas.length ? entradas.map((e) => entradaCola(e, disponible !== null))
        : [el('p', 'vacio', c.entradas.length ? 'Nada coincide.' : VACIO.imprimir)]));
    }

    function entradaCola(e, conPlan) {
      const { pedido: p, linea: l } = e;
      const n = piezasDeLinea(l.piezas);
      let marca = null;
      if (!e.faltan) marca = el('span', 'marca hecha', '✓ Impreso');
      else if (!e.minutos) marca = el('span', 'marca sin', 'Sin tiempo');
      else if (conPlan && !e.caben) marca = el('span', 'marca no', 'No cabe');
      else if (conPlan) marca = el('span', 'marca cabe', e.caben === e.faltan ? (e.faltan > 1 ? `✓ Caben las ${e.faltan}` : '✓ Cabe')
        : `✓ Caben ${e.caben} de ${e.faltan}`);
      const irPedido = el('button', 'ir-pedido', numPedido(p), ' ',
        el('span', 'nombre-cliente', `${p.nombre} ${p.apellidos}`.trim()));
      irPedido.type = 'button';
      irPedido.title = 'Ver el pedido';
      irPedido.addEventListener('click', () => verPedido(p));
      return el('div', `cola-item${!e.faltan ? ' hecho' : conPlan && e.minutos && !e.caben ? ' no-cabe' : ''}`,
        el('div', 'cola-cab', irPedido, p.estado === 'Pendiente' ? el('span', 'sin-confirmar', 'sin confirmar') : null, marca),
        el('div', 'linea', fotoProducto(l), el('div', 'linea-datos',
          el('div', 'cola-que', `${n} × `, el('span', 'nombre-producto', l.nombre),
            e.faltan && e.faltan < n ? el('span', 'faltan', ` · ${e.faltan === 1 ? 'falta 1' : `faltan ${e.faltan}`}`) : null),
          l.detalle ? eleccion(l.detalle) : null,
          l.ref ? referencia(l.ref, (p.enlaces || {})[l.ref]) : null,
          tiempoLinea(l, conPlan && e.minutos ? e : null),
          pasosLinea(p, l))),
        nota(p.numero));
    }

    // Desde «Por imprimir», el pedido entero: en su pestaña, desplegado
    function verPedido(p) {
      $('buscar').value = '';
      abiertos.add(p.numero);
      ponerFiltro(seccion(p));
      const caja = tarjetas.get(p.numero);
      if (caja) caja.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    // ---- Cambios: se ven al momento y se guardan en la hoja (guardar) ----
    // Las piezas y lo cobrado de una línea (`nuevo`: [piezas, cobradas], de los pasos). Lo que avanza en un pedido sin
    // confirmar lo confirma (y `confirmar`, aunque no avance nada); su estado sigue a las piezas y «Pagado», a lo cobrado.
    // Si es lo primero que se cobra de un pedido sin forma de pago, antes se pregunta cómo ha pagado, en `donde`
    function cambiarLinea(p, l, nuevo, donde, { confirmar = false, forma } = {}) {
      if (!nuevo) return;
      const [nuevas, cobradas] = nuevo;
      const progreso = (pz, k) => pz[1] + 2 * pz[2] + k;
      const confirma = p.estado === 'Pendiente' && (confirmar || progreso(nuevas, cobradas) > progreso(l.piezas, l.cobradas));
      if (!confirma && cobradas === l.cobradas && nuevas.every((x, i) => x === l.piezas[i])) return;
      if (forma === undefined && donde && cobradas > l.cobradas && !p.forma && !p.lineas.some((x) => x.cobradas > 0)) {
        donde.querySelectorAll('.pregunta-forma').forEach((x) => x.remove());
        const pregunta = preguntaForma((f) => cambiarLinea(p, l, nuevo, null, { confirmar, forma: f }), () => pregunta.remove());
        donde.append(pregunta);
        return;
      }
      if (filtro === 'imprimir' || filtro === 'clientes') recien.add(`${p.numero}:${p.lineas.indexOf(l)}`);
      aplicar(p, () => {
        const avisos = [];
        if (confirma) {
          p.estado = 'Confirmado';
          avisos.push(`Nº ${p.numero} confirmado`);
        }
        l.piezas = nuevas;
        l.cobradas = cobradas;
        if (forma !== undefined) p.forma = forma;
        const estado = estadoSegunPiezas(p.estado, p.lineas.map((x) => x.piezas), p.estadoAntes);
        if (estado !== p.estado) {
          if (!AUTOMATICOS.includes(p.estado)) p.estadoAntes = p.estado;
          p.estado = estado;
          avisos.push(estado === 'Entregado' ? `Nº ${p.numero}: todo entregado → «Entregado»`
            : estado === 'Hecho' ? `Nº ${p.numero}: todo impreso → «Hecho»` : `Nº ${p.numero} vuelve a «${estado}»`);
        }
        const pagado = todoCobrado(p.lineas);
        if (pagado !== p.pagado) {
          p.pagado = pagado;
          avisos.push(pagado ? `Nº ${p.numero}: todo cobrado → pagado` : `Nº ${p.numero}: ya no está todo cobrado`);
        }
        return avisos.join(' · ');
      }, ESPERA_PIEZAS);
    }

    // `cambio` cambia el pedido (y puede devolver un aviso). Si pasa a otra pestaña (p. ej. entregado y pagado, a
    // «Entregados»), se dice
    function aplicar(p, cambio, demora = 0) {
      const antes = seccion(p);
      const avisos = [cambio()].filter(Boolean);
      if (seccion(p) !== antes) avisos.push(`Nº ${p.numero} pasa a ${NOMBRE_SECCION[seccion(p)]}`);
      if (avisos.length) aviso(avisos.join(' · '));
      repintar(p);
      guardar(p, demora);
    }

    function repintar(p) {
      datos.resumen = resumen(datos.pedidos);
      pintarResumen();
      pintarCuentas();
      if (filtro === 'imprimir') { pintarCola(); return; }
      // En «Clientes», el cliente entero: lo que debe y lo que le falta por imprimir también cambian
      if (filtro === 'clientes') { pintarLista(); return; }
      if (!FILTROS[filtro](p)) {
        abiertos.delete(p.numero);
        pintarLista();
        return;
      }
      const vieja = tarjetas.get(p.numero);
      if (vieja && vieja.isConnected) vieja.replaceWith(tarjeta(p));
    }

    // ---- Actividad: lo que está haciendo la página con la hoja, como la consola de la app pero sin panel lateral. El
    // punto late mientras lee o guarda y se pone rojo si algo falla; al tocarlo, lo último que ha hecho, con su hora ----
    const enCurso = new Map();  // lo que está haciendo ahora: id → texto
    const registro = [];  // lo que ha hecho, lo último primero: {hora, texto, error}
    const horaExacta = new Intl.DateTimeFormat('es-ES', { timeStyle: 'medium' });
    const botonActividad = $('actividad'), listaActividad = $('actividadLista');
    let reposo = 'Cargando…';  // lo que dice cuando no está haciendo nada
    let errorSinVer = false;
    const segundos = (desde) => `${((performance.now() - desde) / 1000).toFixed(1).replace('.', ',')} s`;

    function empezar(id, texto) {
      enCurso.set(id, texto);
      pintarActividad();
    }
    function terminar(id, texto, error = false) {
      enCurso.delete(id);
      if (texto) anotar(texto, error);
      pintarActividad();
    }
    function anotar(texto, error = false) {
      registro.unshift({ hora: new Date(), texto, error });
      registro.length = Math.min(registro.length, 40);
      if (error && listaActividad.hidden) errorSinVer = true;
      if (!listaActividad.hidden) pintarRegistro();
    }
    function pintarActividad() {
      const haciendo = [...enCurso.values()];
      botonActividad.classList.toggle('ocupada', haciendo.length > 0);
      botonActividad.classList.toggle('con-error', errorSinVer && !haciendo.length);
      $('estado').textContent = haciendo.length ? `${haciendo[0]}${haciendo.length > 1 ? ` (+${haciendo.length - 1})` : ''}` : reposo;
      botonActividad.title = haciendo.length ? haciendo.join(' · ') : 'Lo que ha hecho la página con la hoja';
    }
    function pintarRegistro() {
      listaActividad.replaceChildren(...(registro.length
        ? registro.map((r) => el('p', r.error ? 'error' : '', el('span', 'hora', horaExacta.format(r.hora)), r.texto))
        : [el('p', 'vacia', 'Aún no ha hecho nada.')]));
    }
    function abrirActividad(si) {
      listaActividad.hidden = !si;
      botonActividad.setAttribute('aria-expanded', String(si));
      if (si) {
        errorSinVer = false;
        pintarRegistro();
        pintarActividad();
      }
    }
    botonActividad.addEventListener('click', () => abrirActividad(listaActividad.hidden));
    document.addEventListener('click', (e) => { if (!listaActividad.hidden && !e.target.closest('.actividad-caja')) abrirActividad(false); });

    // Lo que se ha guardado de un pedido, para el registro: «pagado, forma de pago Bizum»
    function describir(c) {
      return [
        'estado' in c ? `estado «${c.estado}»` : '',
        'pagado' in c ? (c.pagado ? 'pagado' : 'sin pagar') : '',
        'forma' in c ? (c.forma ? `forma de pago ${c.forma}` : 'sin forma de pago') : '',
        'piezas' in c ? `piezas: ${c.piezas.filter(Boolean).join(' / ')}` : '',
        'cobros' in c ? `cobro: ${c.cobros.filter(Boolean).join(' / ')}` : '',
      ].filter(Boolean).join(', ');
    }

    // Lo que tiene la hoja de un pedido (`p.enHoja`: lo último que se leyó o se guardó). Se manda solo lo que cambia;
    // los cambios de cada pedido van de uno en uno (si llega otro mientras se guarda, después) y, si falla, el pedido
    // vuelve a lo que tiene la hoja
    const enHoja = (p) => ({ estado: p.estado, pagado: p.pagado, forma: p.forma,
      piezas: p.lineas.map((l) => textoPiezas(l.piezas)),
      cobros: p.lineas.map((l) => textoCobro(piezasDeLinea(l.piezas), l.cobradas)) });
    const guardando = new Map();  // número → {temporizador, enVuelo, otraVez}

    function guardar(p, demora) {
      let g = guardando.get(p.numero);
      if (!g) {
        g = { temporizador: 0, enVuelo: false, otraVez: false };
        guardando.set(p.numero, g);
        ocupada++;
        empezar(`guardar${p.numero}`, `Guardando Nº ${p.numero}…`);
      }
      ponerNota(p.numero, 'Guardando en la hoja…');
      if (g.enVuelo) { g.otraVez = true; return; }
      clearTimeout(g.temporizador);
      g.temporizador = setTimeout(() => enviar(p, g), demora);
    }

    async function enviar(p, g) {
      g.enVuelo = true;
      const ahora = enHoja(p), antes = p.enHoja, cambios = {};
      for (const k of ['estado', 'pagado', 'forma']) if (ahora[k] !== antes[k]) cambios[k] = ahora[k];
      for (const k of ['piezas', 'cobros']) if (ahora[k].join('\n') !== antes[k].join('\n')) cambios[k] = ahora[k];
      let fallo = null;
      const desde = performance.now();
      try {
        if (Object.keys(cambios).length) await fuente.actualizar(p.numero, cambios);
        p.enHoja = ahora;
        if (Object.keys(cambios).length) {
          anotar(`Nº ${p.numero} guardado: ${describir(cambios)} (${segundos(desde)})`);
          guardarCopia();
        }
      } catch (e) {
        fallo = e;
      }
      g.enVuelo = false;
      if (!fallo && g.otraVez) {
        g.otraVez = false;
        enviar(p, g);
        return;
      }
      guardando.delete(p.numero);
      ocupada--;
      if (!fallo) {
        terminar(`guardar${p.numero}`);
        ponerNota(p.numero, '✓ Guardado');
        setTimeout(() => { if (notas.get(p.numero) === '✓ Guardado') ponerNota(p.numero, ''); }, 2000);
        // Lo que se leyó mientras se guardaba no lo tenía: se vuelve a leer
        if (releer && !guardando.size) cargar();
        return;
      }
      terminar(`guardar${p.numero}`, `Nº ${p.numero}: no se pudo guardar (${fallo.message}). Vuelve a lo que tiene la hoja.`,
        true);
      const h = p.enHoja;
      Object.assign(p, { estado: h.estado, pagado: h.pagado, forma: h.forma });
      piezas(h.piezas.join('\n'), p.lineas, h.estado).forEach((c, i) => { p.lineas[i].piezas = c; });
      cobros(h.cobros.join('\n'), p.lineas, h.pagado).forEach((k, i) => { p.lineas[i].cobradas = k; });
      ponerNota(p.numero, '');
      aviso(`No se pudo guardar: ${fallo.message}`);
      datos.resumen = resumen(datos.pedidos);
      pintarResumen();
      pintarCuentas();
      pintarLista();
      if (releer && !guardando.size) cargar();
    }

    // Pinta lo que devuelve la hoja (o la copia guardada en este navegador)
    function mostrar(j) {
      // Lo que se sabe de cada producto por su código (pedidos.productos: la app lo saca del catálogo y el móvil lo
      // lleva en la página): lo que tarda una pieza (0 = no se sabe) y su foto. Los pedidos de antes de los códigos
      // lo buscan por el nombre
      const fichas = { minutos: {}, fotos: {}, nombres: {}, colores: {}, ...j.productos };
      rollos = Object.fromEntries(Object.entries(fichas.colores).filter(([, c]) => /^#[0-9a-f]{6}$/i.test(c))
        .map(([n, c]) => [normalizar(n).replace(/\s+/g, ' ').trim(), c]));
      const pedidos = (j.pedidos || []).map((p) => {
        const lista = lineas(p.productos);
        const cobradas = cobros(p.cobros, lista, p.pagado);
        piezas(p.piezas, lista, p.estado).forEach((c, i) => {
          const l = lista[i];
          l.piezas = c;
          l.cobradas = cobradas[i];
          l.ref = l.ref || fichas.nombres[normalizar(l.nombre).replace(/\s+/g, ' ').trim()] || '';
          l.minutos = fichas.minutos[l.ref] || 0;
          l.foto = fichas.fotos[l.ref] || '';
        });
        // Tal cual está en la hoja (vacío en los de antes): al primer cambio se escribe lo que se ve
        const tal = (texto) => { const t = String(texto || '').split(/\r?\n/); return lista.map((_, i) => (t[i] || '').trim()); };
        return { ...p, lineas: lista, enHoja: { estado: p.estado, pagado: p.pagado, forma: p.forma,
          piezas: tal(p.piezas), cobros: tal(p.cobros) } };
      }).sort((a, b) => (b.numero || 0) - (a.numero || 0));  // el más nuevo primero
      datos = { ...j, pedidos, resumen: resumen(pedidos) };
      $('contenido').hidden = false;
      if (j.hoja) { $('abrirHoja').href = j.hoja; $('abrirHoja').hidden = false; }
      pintarResumen();
      pintarCuentas();
      pintarLista();
    }

    // La última lectura se guarda en este navegador: al abrir la página se enseña al momento (leer la hoja tarda de 2 a
    // 10 s) y se pone al día en cuanto llega la hoja. En el móvil, «Olvidar la clave» la borra
    const COPIA = 'negoqr-pedidos-copia';
    let copiaDe = 0;  // cuándo se leyó lo que se ve, si es la copia
    let releer = false;  // se leyó mientras se guardaba algo: hay que volver a leer cuando acabe

    // La copia es lo que tiene la hoja: lo último leído con lo guardado después (así, al abrir, ya sale lo marcado)
    function guardarCopia() {
      const { resumen: _, pedidos: lista, ...resto } = datos;
      const pedidos = lista.map(({ lineas: __, enHoja: h, ...p }) => ({ ...p, estado: h.estado, pagado: h.pagado,
        forma: h.forma, piezas: h.piezas.join('\n'), cobros: h.cobros.join('\n') }));
      try { localStorage.setItem(COPIA, JSON.stringify({ leida: leido || copiaDe, j: { ...resto, pedidos } })); } catch { /* sin almacén */ }
    }

    async function cargar() {
      if (ocupada) return;
      ocupada++;
      empezar('leer', 'Leyendo la hoja…');
      $('actualizar').disabled = true;
      const desde = performance.now();
      try {
        const j = await fuente.leer();
        // Un cambio hecho mientras se leía no viene en lo leído: se lee otra vez cuando esté guardado
        if (guardando.size) {
          releer = true;
          terminar('leer', `Leída la hoja (${segundos(desde)}), pero hay cambios guardándose: se vuelve a leer después`);
          return;
        }
        releer = false;
        mostrar(j);
        leido = Date.now();
        copiaDe = 0;
        $('sinConexion').hidden = true;
        guardarCopia();
        reposo = `${datos.pedidos.length} pedidos · ${hora.format(new Date())}`;
        terminar('leer', `Leída la hoja: ${datos.pedidos.length} pedidos (${segundos(desde)})`);
      } catch (e) {
        $('sinConexionMotivo').textContent = e.message;
        $('sinConexion').hidden = false;
        $('contenido').hidden = !datos;
        reposo = copiaDe ? `Sin conexión · copia de las ${hora.format(new Date(copiaDe))}` : 'Sin conexión con la hoja';
        terminar('leer', `No se pudo leer la hoja (${segundos(desde)}): ${e.message}`, true);
      } finally {
        ocupada--;
        $('actualizar').disabled = false;
      }
    }
    $('actualizar').addEventListener('click', cargar);
    // Al volver a la página (en el móvil, p. ej. desde WhatsApp) se vuelve a leer si hace rato: por si hay pedidos nuevos
