<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos · Catálogo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070c33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<!--
  Página de pedidos para el móvil (la genera catalogo/web.py y se publica con el catálogo, en pedidos/). Es la página
  «Pedidos» de la app (static/js/pedidos.js y static/css/pedidos.css van aquí dentro), pero habla directamente con el
  script de la hoja de Google, sin la app. No lleva ningún pedido ni la clave: la clave llega tras «#» al escanear el
  QR de la app (Pedidos → «En el móvil») y se queda en este móvil.
-->
<style>
/* Lo de static/css/base.css que usa la página, con el mismo aspecto (tema «neón»: azul marino, azul eléctrico, violeta
   y cian) pero sin desenfoques (en el móvil van a tirones) */
:root{
  --bg: #060a26;
  --panel: rgba(20, 26, 78, .86);
  --line: rgba(150, 170, 255, .14);
  --line-fuerte: rgba(150, 170, 255, .26);
  --acrilico: none;
  --radio: 16px;
  --ink: #f2f5ff;
  --ink-dim: #aab4e0;
  --ink-faint: #6b74a8;
  --accent: #29e0ff;
  --accent-rgb: 41, 224, 255;
  --accent-dim: #1596c4;
  --grad-boton: linear-gradient(135deg, #6ef2ff, #1fc8f5 55%, #2f9bff);
  --sobre-acento: #04123a;
  --bien: #3ddc97;
  --bien-rgb: 61, 220, 151;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --sans: system-ui, "Segoe UI", Roboto, sans-serif;
  --borde-x: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
}
*{ box-sizing: border-box; }
html{ background: var(--bg); color-scheme: dark; -webkit-text-size-adjust: 100%; }
body{ margin: 0; min-height: 100vh; color: var(--ink); background: linear-gradient(165deg, #070c33 0%, #080b2b 45%, #120a3d 100%) fixed;
  font-family: var(--sans); line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before{ content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vmax 40vmax at 0% 0%, rgba(45, 95, 255, .3), transparent 70%),
    radial-gradient(50vmax 40vmax at 100% 10%, rgba(140, 60, 255, .26), transparent 70%),
    radial-gradient(60vmax 40vmax at 70% 100%, rgba(170, 40, 240, .22), transparent 70%); }
a{ color: var(--accent); }
[hidden]{ display: none !important; }

input, select{ width: 100%; background: rgba(4, 6, 28, .5); border: 1px solid var(--line-fuerte); color: var(--ink);
  padding: 8px 10px; border-radius: 10px; font-family: var(--sans); font-size: 16px; outline: none; }
select option{ background: #151a4a; }
input::placeholder{ color: var(--ink-faint); }
input:focus, select:focus{ border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .16); }
button{ font-family: var(--sans); font-weight: 600; font-size: 14px; border-radius: 10px; border: 1px solid transparent;
  padding: 10px 14px; cursor: pointer; touch-action: manipulation; color: var(--ink); }
button:active:not(:disabled){ transform: translateY(1px); }
.btn-primary{ background: var(--grad-boton); color: var(--sobre-acento); font-weight: 700;
  box-shadow: 0 8px 22px -10px rgba(var(--accent-rgb), .85); }
.btn-primary:disabled{ background: rgba(70, 78, 130, .45); color: #7d86b5; box-shadow: none; }
.btn-ghost{ background: rgba(255, 255, 255, .04); border-color: var(--line-fuerte); color: var(--ink); }
.btn-link{ background: none; border: none; padding: 0; color: var(--accent); font-size: inherit; font-weight: 600; }
.hint{ font-size: 13px; color: var(--ink-dim); margin: 6px 0 0; }
.panel{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radio); padding: 14px; }
.panel h2{ margin: 0 0 6px; font-size: 18px; }
.panel p{ margin: 0 0 8px; }

/* Cabecera fija arriba: el título, cuándo se leyó y los botones (siempre a mano al bajar por la lista) */
.cabecera{ position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) var(--borde-x) 10px; background: #070c33;
  border-bottom: 1px solid var(--line); }
/* La línea de neón bajo la cabecera, como la barra de la app */
.cabecera::after{ content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(41, 224, 255, .55) 25%, rgba(61, 107, 255, .55) 55%,
    rgba(155, 77, 255, .5) 80%, transparent); }
.cabecera h1{ margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15;
  background: linear-gradient(100deg, #ffffff 25%, #8eeaff 65%, #b9a2ff); -webkit-background-clip: text; background-clip: text;
  color: transparent; }
.cabecera .estado{ display: flex; max-width: 100%; padding: 2px 0; border: 0; border-radius: 0; background: none;
  font: 500 12px/1.4 var(--mono); color: var(--accent); text-align: left; }
/* Lo que hace, en dos líneas como mucho («Sin conexión · copia de las 22:30» no cabe en una al lado de los botones) */
.cabecera .estado #estado{ overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.cabecera .actividad-caja{ min-width: 0; }
.cabecera .actividad-lista{ left: 0; right: auto; }
.cab-acciones{ display: flex; align-items: center; gap: 8px; flex: none; }
.cab-acciones .boton-enlace, .cab-acciones button{ min-height: 42px; padding: 0 14px; font-size: 14px; }
.cab-acciones .boton-enlace{ color: var(--ink); background: rgba(255, 255, 255, .04); }

.wrap{ padding: 12px var(--borde-x) max(28px, env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
.columna-pedidos{ padding: 12px; }
/* En el ordenador, todo el ancho (el panel «Por imprimir» a la izquierda y los pedidos a la derecha: pedidos.css), y la
   cabecera alineada con lo de debajo */
@media (min-width: 1100px){
  .wrap{ max-width: 1440px; padding-top: 18px; }
  .cabecera{ padding-left: max(var(--borde-x), calc((100% - 1440px) / 2 + 16px));
    padding-right: max(var(--borde-x), calc((100% - 1440px) / 2 + 16px)); }
  .columna-pedidos{ padding: 14px 16px; }
}
.pie{ margin-top: 22px; text-align: center; }
.pie .hint{ margin-top: 10px; }
#instalar{ width: 100%; min-height: 46px; }

.toast{ position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 50; width: max-content;
  max-width: calc(100vw - 32px); transform: translateX(-50%) translateY(20px); padding: 11px 16px; border-radius: 12px;
  background: var(--grad-boton); color: var(--sobre-acento); font-size: 14px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none;
  box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .7); transition: opacity .18s ease, transform .18s ease; }
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

/* static/css/pedidos.css, igual que en la app */
/* Pedidos de la web (static/js/pedidos.js): resumen arriba y una tarjeta por pedido con su estado, su cobro y sus piezas;
   o, en «Por imprimir», una entrada por línea con piezas que faltan. La página del móvil (web/pedidos.html) lleva este
   mismo archivo dentro: lo de pantallas estrechas va al final */
/* Qué es cada cosa, siempre con el mismo color: los pedidos (su número y su borde), en violeta; los clientes (su nombre,
   su avatar y su borde), en rosa; los productos (su nombre, su foto, su código y su borde), en azul. Cómo va cada uno es
   aparte: ámbar, lo que falta (cobrar, confirmar); verde, lo hecho (cobrado, impreso, entregado). Cada color en r, g, b
   para ponerle transparencia (rgba(var(--pedido), .12)) sin color-mix(), que los móviles antiguos no tienen; el
   `-texto`, más claro, para los nombres */
:root{
  --pedido: 177, 151, 252;  --pedido-texto: #cdbdff;
  --cliente: 247, 131, 172;  --cliente-texto: #ffb8d2;
  --producto: 92, 182, 255;  --producto-texto: #a6d6ff;
}
/* Todos del mismo ancho (hasta el Nº 99), para que los nombres empiecen a la misma altura */
.num-pedido{ flex: none; min-width: 3.7em; padding: 1px 8px; border-radius: 8px; border: 1px solid rgba(var(--pedido), .4);
  background: rgba(var(--pedido), .14); color: var(--pedido-texto); font-weight: 800; font-variant-numeric: tabular-nums;
  text-align: center; white-space: nowrap; }
.nombre-cliente{ color: var(--cliente-texto); }
.nombre-producto{ color: var(--producto-texto); font-weight: 650; }
/* La muestra del color de un rollo, con un aro para que el negro se vea sobre el fondo oscuro */
.muestra{ flex: none; display: inline-block; width: 11px; height: 11px; border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .4); }
.color{ display: inline-flex; align-items: center; gap: 5px; }

/* Lo que está haciendo la página con la hoja (pedidos.js, «Actividad»): el punto, verde y quieto si está al día,
   ámbar latiendo mientras lee o guarda, rojo si algo ha fallado; al tocarlo, lo que ha hecho con su hora */
.actividad-caja{ position: relative; }
button.actividad{ display:inline-flex; align-items:center; gap: 7px; cursor: pointer; }
.actividad-punto{ flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--bien); }
.actividad.ocupada .actividad-punto{ background: #f5b14a; animation: latido .8s ease-in-out infinite alternate; }
.actividad.con-error .actividad-punto{ background: #ff6b63; }
@keyframes latido{ from{ opacity: 1; transform: scale(1); } to{ opacity: .3; transform: scale(.7); } }
.actividad-lista{ position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: min(400px, calc(100vw - 32px));
  max-height: 50vh; overflow-y: auto; padding: 8px 12px; border: 1px solid var(--line-fuerte); border-radius: 12px;
  background: #0e1238; box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .75); font: 12px/1.5 var(--mono); text-align: left; }
.actividad-lista[hidden]{ display: none; }
.actividad-lista p{ margin: 3px 0; color: var(--ink-dim); white-space: normal; }
.actividad-lista .hora{ margin-right: 8px; color: var(--ink-faint); }
.actividad-lista .error{ color: #ff8a84; }
.actividad-lista .vacia{ color: var(--ink-faint); }

.boton-enlace{ display:inline-flex; align-items:center; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-fuerte);
  font-weight: 600; font-size: 13.5px; text-decoration: none; }
.aviso-pedidos h2{ margin: 0 0 6px; font-size: 18px; }
.aviso-pedidos p{ margin: 0 0 8px; max-width: 90ch; }

.resumen-pedidos{ position: relative; display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  margin-bottom: 16px; }
.cifra{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radio); padding: 14px 16px;
  backdrop-filter: var(--acrilico); }
.cifra .num{ font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.cifra .que{ font-size: 12.5px; color: var(--ink-dim); }
.cifra.aviso .num{ color: #f5b14a; }
.cifra.bien .num{ color: var(--bien); }
.cifra.de-pedidos .num{ color: var(--pedido-texto); }
.cifra.de-pedidos{ box-shadow: inset 0 3px 0 rgba(var(--pedido), .7); }
.cifra.lista summary{ display:flex; justify-content: space-between; align-items:center; gap: 8px; cursor: pointer; list-style: none; }
.cifra.lista summary::-webkit-details-marker{ display: none; }
.cifra.lista summary::after{ content: "▾"; font-size: 12px; transition: transform .15s; }
.cifra.lista:not([open]) summary::after{ transform: rotate(-90deg); }
/* «Lo más pedido»: un botón del tamaño de las cifras que despliega las dos listas por encima de lo de debajo, junto al
   borde derecho del resumen (pedidos.js, masPedido) */
.mas-pedido > summary{ display: block; height: 100%; cursor: pointer; list-style: none;
  box-shadow: inset 0 3px 0 rgba(var(--producto), .7); }
.mas-pedido > summary::-webkit-details-marker{ display: none; }
.mas-pedido > summary:hover, .mas-pedido[open] > summary{ border-color: rgba(var(--producto), .55); }
.mas-pedido > summary .que{ color: var(--producto-texto); font-weight: 600; }
.mas-pedido > summary .que::after{ content: " ▾"; }
.mas-pedido[open] > summary .que::after{ content: " ▴"; }
.mas-pedido-caja{ position: absolute; z-index: 25; top: calc(100% + 8px); right: 0; width: min(640px, 100%);
  display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; padding: 14px 16px;
  border: 1px solid var(--line-fuerte); border-radius: 14px; background: #0e1238; box-shadow: 0 18px 50px -14px rgba(0, 0, 0, .85); }
.mas-pedido-lista h3{ margin: 0 0 6px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-dim); }
.mas-pedido-lista ol{ margin: 0; padding-left: 22px; font-size: 13px; }
.mas-pedido-lista li{ margin: 3px 0; }
.mas-pedido-lista li::marker{ color: var(--ink-faint); }
.mas-pedido-lista .nombre-producto{ font-weight: 500; }
.mas-pedido-lista .n{ color: var(--ink-dim); font-variant-numeric: tabular-nums; }
/* La página: en el móvil y en pantallas medianas, una columna (el panel «Por imprimir», el resumen y los pedidos); en el
   ordenador, el panel a la izquierda, fijo al bajar (por debajo de la barra fija: --arriba, de pedidos.js), y el
   resumen y los pedidos a la derecha */
.pedidos-rejilla{ display:grid; grid-template-columns: minmax(0, 1fr); }
.columna-imprimir{ margin-bottom: 12px; }
@media (min-width: 1100px){
  .pedidos-rejilla{ grid-template-columns: minmax(340px, 410px) minmax(0, 1fr); grid-template-areas: "imprimir resumen" "imprimir pedidos";
    column-gap: 20px; align-items: start; }
  .columna-imprimir{ grid-area: imprimir; position: sticky; top: var(--arriba, 16px); margin: 0; }
  .columna-imprimir .panel-imprimir{ max-height: calc(100vh - var(--arriba, 16px) - 16px); overflow-y: auto; }
  .resumen-pedidos{ grid-area: resumen; }
  .columna-pedidos{ grid-area: pedidos; }
}

/* El panel «Por imprimir»: lo que queda de todos los pedidos, por producto (foto, código, piezas y tiempo) y lo que
   eligió el cliente (pedidos.js, panelImprimir) */
.panel-imprimir{ box-shadow: inset 0 3px 0 rgba(var(--producto), .8); }
.panel-imprimir > summary .que{ color: var(--producto-texto); }
.imprimir-lista{ display:grid; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
.cifra.lista .imprimir-lista > li{ display:grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: start;
  margin: 0; padding-top: 8px; border-top: 1px solid var(--line); }
/* La foto del producto (fotoProducto), aquí y en cada línea de los pedidos, con un borde azul de producto */
.foto{ width: 56px; height: 56px; border-radius: 10px; border: 1px solid rgba(var(--producto), .35); object-fit: cover;
  background: rgba(var(--producto), .06); }
.sin-foto{ display:grid; place-items: center; font-size: 22px; filter: grayscale(1); opacity: .5; }
.imprimir-lista .prod{ display:grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.imprimir-lista .izq, .imprimir-lista .der{ display:flex; flex-direction: column; }
.imprimir-lista .der{ align-items: flex-end; text-align: right; }
.imprimir-lista .nombre{ font-size: 14px; font-weight: 650; line-height: 1.3; }
.cifra.lista .imprimir-lista .prod .n{ font-size: 16px; font-weight: 800; color: var(--ink); }
.imprimir-lista .t{ font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.imprimir-lista .variantes{ display:grid; gap: 2px; margin: 4px 0 0; padding: 0 0 0 12px; list-style: none; font-size: 12.5px; }
.cifra.lista .imprimir-lista .variantes li{ display:flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  margin: 0; color: var(--ink-dim); }
.cifra.lista .imprimir-lista .variantes .n{ flex: none; color: var(--ink); font-weight: 700; }

.barra-pedidos{ display:flex; flex-wrap: wrap; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.barra-pedidos input[type=search]{ max-width: 340px; }
.filtros{ display:flex; flex-wrap:wrap; gap: 4px; }
/* Cada pestaña con el color de lo que enseña (un punto y, la abierta, entera): pedidos, productos o clientes */
.filtros button{ --tipo: var(--pedido); display:inline-flex; align-items:center; padding: 4px 11px; font-size: 12.5px;
  border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); }
.filtros button[data-filtro="imprimir"]{ --tipo: var(--producto); }
.filtros button[data-filtro="clientes"]{ --tipo: var(--cliente); }
.filtros button::before{ content: ""; flex: none; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%;
  background: rgba(var(--tipo), .75); }
.filtros button.activo{ border-color: rgba(var(--tipo), .65); background: rgba(var(--tipo), .14); color: rgb(var(--tipo)); }
.filtros .cuenta{ margin-left: 6px; font: 600 11px/1 var(--mono); color: var(--ink-faint); }
.filtros button.activo .cuenta{ color: inherit; }

.lista-pedidos{ display:flex; flex-direction:column; gap: 6px; }
.lista-pedidos .vacio{ margin: 0; padding: 18px 0; text-align: center; color: var(--ink-dim); }
/* El borde izquierdo, violeta de pedido; verde si está pagado y ámbar si se entregó sin cobrar */
.pedido{ border: 1px solid var(--line); border-left: 4px solid rgba(var(--pedido), .5); border-radius: 12px;
  background: rgba(255, 255, 255, .02); }
.pedido[open]{ border-color: rgba(var(--pedido), .35); background: rgba(var(--pedido), .04); }
.pedido.pagado{ border-left-color: var(--bien); }
.pedido.por-cobrar{ border-left-color: #f5b14a; }
.pedido.cancelado{ opacity: .55; }
/* Plegado: una línea con el número, el cliente y el estado; al tocarla se despliega el resto (.pedido-cuerpo) */
.pedido-linea{ display:flex; align-items:center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; }
.pedido-linea::-webkit-details-marker{ display: none; }
.pedido-linea::before{ content: "▸"; flex: none; font-size: 12px; color: var(--ink-faint); transition: transform .15s; }
.pedido[open] > .pedido-linea::before{ transform: rotate(90deg); }
/* El nombre, entero si cabe en dos líneas */
.pedido-linea .quien{ flex: 1; min-width: 0; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.pedido-linea .etiqueta{ flex: none; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-fuerte);
  font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.pedido.pagado .etiqueta{ color: var(--bien); border-color: rgba(var(--bien-rgb), .45); }
.pedido.por-cobrar .etiqueta{ color: #f5b14a; border-color: rgba(245, 177, 74, .45); }
.pedido.cancelado .etiqueta{ color: #ff8a84; border-color: rgba(255, 107, 99, .45); }
.pedido-cuerpo{ padding: 0 14px 12px; border-top: 1px solid var(--line); }
.pedido-cab{ display:flex; flex-wrap:wrap; align-items:center; gap: 4px 14px; padding-top: 10px; }
.pedido-cab .fecha, .pedido-cab .tel{ color: var(--ink-dim); font-size: 13px; }
.pedido-cab .total{ font-size: 17px; font-weight: 800; white-space: nowrap; }
.pedido-cab .tel{ margin-left: auto; }
/* Cada línea del pedido (y de «Por imprimir»): la foto del producto y al lado lo demás */
.lineas{ display:flex; flex-direction: column; gap: 10px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
.linea{ display:grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; }
.linea .foto{ width: 48px; height: 48px; font-size: 19px; }
.cola-item .linea{ margin-top: 6px; }
.linea-que{ font-weight: 600; }
.linea-que .precio{ color: var(--ink-dim); font-weight: 500; }
/* Lo que eligió el cliente: cada color con su muestra y el texto que escribió */
.detalle{ display:flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; margin: 2px 0; color: var(--ink-dim); font-size: 12.5px; }
.detalle .escrito{ color: var(--ink); font-style: italic; overflow-wrap: anywhere; }
/* El código del producto (P-037) y, si es enlace, a su modelo en Printables o a su ficha: azul de producto */
.pedido .ref, .cola-item .ref, .producto-cliente .ref, .panel-imprimir .ref{ display:flex; width: fit-content; margin: 3px 0 4px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line-fuerte); font: 600 12px/1.5 var(--mono); color: var(--ink-dim); text-decoration: none; }
.pedido a.ref, .cola-item a.ref, .producto-cliente a.ref, .panel-imprimir a.ref{ color: rgb(var(--producto)); border-color: rgba(var(--producto), .45);
  background: rgba(var(--producto), .08); }
.pedido a.ref:hover, .cola-item a.ref:hover, .producto-cliente a.ref:hover, .panel-imprimir a.ref:hover{ background: rgba(var(--producto), .16); }
/* Lo que tarda cada pieza y cuándo acabaría (tiempoLinea); en la cabecera del pedido, lo que le falta */
.tiempo{ display:block; margin: 2px 0; font-size: 12.5px; color: var(--ink-dim); }
.tiempo.sin{ color: var(--ink-faint); }
.tiempo .fin, .plan-texto .fin{ color: var(--ink); font-weight: 600; }
.pedido-cab .falta{ font-size: 13px; font-weight: 600; }
/* Cómo va cada línea, en pasos seguidos (pedidos.js, pasosLinea): «Confirmado · Impreso · Entregado · Cobrado», una
   barra que se toca o se desliza. Lo hecho, en verde claro, y el paso en que está, en verde lleno (el azul es de los
   productos); con varias piezas, cada paso se llena según cuántas han llegado. En ámbar, lo que falta: confirmar el
   pedido o cobrar lo entregado. Arriba y abajo, el dedo sigue moviendo la página (touch-action) */
.pasos-caja{ margin: 6px 0 9px; container-type: inline-size; }
.pasos-pieza{ display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; max-width: 480px;
  border: 1px solid var(--line-fuerte); border-radius: 12px; overflow: hidden; touch-action: pan-y; user-select: none;
  -webkit-user-select: none; }
.pasos-pieza .paso{ display:flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0;
  min-height: 40px; padding: 4px 3px; border: 0; border-radius: 0; color: var(--ink-dim); font-size: 12.5px; line-height: 1.15;
  background: linear-gradient(to right, rgba(var(--bien-rgb), .16) var(--lleno, 0%), transparent var(--lleno, 0%)); }
.pasos-pieza .paso + .paso{ border-left: 1px solid var(--line-fuerte); }
.pasos-pieza .paso .nombre{ max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pasos-pieza .paso .sub{ max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 600 11px/1.1 var(--mono); opacity: .9; }
.pasos-pieza .paso:hover{ box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .14); }
.pasos-pieza .paso.parcial{ color: var(--ink); }
.pasos-pieza .paso.hecho{ background: rgba(var(--bien-rgb), .22); color: var(--bien); }
.pasos-pieza .paso.actual{ background: var(--bien); color: #06120d; }
.pasos-pieza .paso.sin-confirmar, .pasos-pieza .paso.por-cobrar{ color: #f5b14a; background-color: rgba(245, 177, 74, .1); }
.pasos-pieza .paso.apuntado{ box-shadow: inset 0 0 0 2px var(--accent); }
.pasos-pieza.deslizando{ cursor: grabbing; }
/* Estrecha (en el móvil, la barra mide unos 270 px): letra más pequeña y junta, para que quepa «Confirmado» entero */
@container (max-width: 340px){
  .pasos-pieza .paso{ padding: 4px 1px; font-size: 11.5px; letter-spacing: -.02em; }
  .pasos-pieza .paso .sub{ font-size: 10.5px; letter-spacing: -.03em; }
}
.pedido .comentario{ margin: 6px 0 0; font-size: 13px; color: var(--ink-dim); white-space: pre-line; }
.pedido-acciones{ display:flex; flex-wrap:wrap; align-items:center; gap: 8px 16px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--line); }
.pedido-acciones label{ display:flex; align-items:center; gap: 6px; font-size: 13px; margin: 0; }
.pedido-acciones select{ width: auto; padding: 5px 8px; font-size: 13px; }
.pedido-acciones input[type=checkbox]{ width: 18px; height: 18px; accent-color: var(--bien); margin: 0; }
.pedido-acciones .guardando{ font-size: 12px; color: var(--ink-faint); }
.campo-pagado .en-parte{ color: #f5b14a; font-size: 12px; font-variant-numeric: tabular-nums; }  /* cobrado a medias */
/* Al marcarlo pagado (o cobrar lo primero de un pedido) sin forma de pago: «¿Cómo ha pagado?» con un botón por forma */
.pregunta-forma{ display:flex; flex-wrap:wrap; align-items:center; gap: 6px; }
.pasos-caja .pregunta-forma{ margin-top: 8px; }
.pregunta-forma[hidden]{ display: none; }
.pregunta-forma .que{ font-size: 13px; font-weight: 600; }
.pregunta-forma button{ padding: 5px 12px; border-radius: 999px; border: 1px solid var(--bien); background: transparent;
  color: var(--bien); font-size: 13px; font-weight: 600; }
.pregunta-forma button.cancelar{ border-color: var(--line-fuerte); color: var(--ink-dim); }

/* «Clientes»: una fila por cliente (por su teléfono), como una lista de contactos; al tocarla, su ficha con sus
   productos y sus pedidos (pedidos.js, filaCliente y fichaCliente). Si hay sitio (lo que mide la columna de los
   pedidos, no la pantalla: @container), la lista a la izquierda, fija al bajar y con su propio scroll, y la ficha al
   lado; si no, o la lista o la ficha. pedidos.js mira --lado-a-lado para saber cómo está */
.columna-pedidos{ container-type: inline-size; }
.clientes-lista{ display:flex; flex-direction: column; gap: 6px; }
.clientes-ficha{ display: none; }
.clientes-panel.con-ficha .clientes-lista{ display: none; }
.clientes-panel.con-ficha .clientes-ficha{ display: block; }
.ficha-vacia{ margin: 0; padding: 40px 16px; border: 1px dashed var(--line-fuerte); border-radius: 12px; text-align: center;
  color: var(--ink-dim); }
@container (min-width: 760px){
  .clientes-panel{ --lado-a-lado: 1; display:grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 16px;
    align-items: start; }
  .clientes-panel .clientes-lista, .clientes-panel.con-ficha .clientes-lista{ display:flex; position: sticky;
    top: var(--arriba, 16px); max-height: calc(100vh - var(--arriba, 16px) - 16px); overflow-y: auto; padding-right: 4px; }
  .clientes-panel .clientes-ficha{ display: block; }
  .clientes-panel .ficha-cliente .volver{ display: none; }
  .clientes-panel .cliente-fila{ padding: 8px 10px; gap: 10px; }
  .clientes-panel .cliente-fila .avatar{ width: 36px; height: 36px; font-size: 13px; }
  .clientes-panel .cliente-fila .quien{ font-size: 14px; }
}
.cliente-fila.activo{ border-color: rgba(var(--cliente), .6); border-left-color: rgb(var(--cliente)); background: rgba(var(--cliente), .12); }
/* El avatar, del color de ese cliente con un aro rosa de cliente; la fila, con el borde izquierdo rosa */
.avatar{ flex: none; display:grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
  font-size: 15px; font-weight: 800; color: #fff; letter-spacing: .02em; box-shadow: 0 0 0 2px rgba(var(--cliente), .55); }
.cliente-fila{ display:flex; align-items:center; gap: 12px; width: 100%; padding: 10px 14px; border: 1px solid var(--line);
  border-left: 4px solid rgba(var(--cliente), .55); border-radius: 12px; background: rgba(255, 255, 255, .02);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.cliente-fila:hover{ background: rgba(var(--cliente), .07); }
.cliente-fila .quien-caja, .ficha-cab .quien-caja{ flex: 1; min-width: 0; display:flex; flex-direction: column; gap: 2px; }
.cliente-fila .quien{ font-size: 15px; font-weight: 750; line-height: 1.25; overflow-wrap: anywhere; }
.tel-texto{ font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.chips{ display:flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 4px; }
.chips:empty{ display: none; }
.chip{ padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-fuerte); font-size: 12px; color: var(--ink-dim);
  white-space: nowrap; }
.chip.debe{ color: #f5b14a; border-color: rgba(245, 177, 74, .45); background: rgba(245, 177, 74, .08); font-weight: 650; }
.chip.al-dia{ color: var(--bien); border-color: rgba(var(--bien-rgb), .45); }
.chip.piezas{ color: rgb(var(--producto)); border-color: rgba(var(--producto), .4); }
.chip.entregar{ color: #8eeabf; border-color: rgba(var(--bien-rgb), .35); }
.cliente-fila .ir{ flex: none; font-size: 24px; line-height: 1; color: rgba(var(--cliente), .7); }

.ficha-cliente{ display:flex; flex-direction: column; gap: 12px; }
.ficha-arriba{ display:flex; align-items:center; justify-content: space-between; gap: 10px; }
.ficha-cliente .volver{ padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-fuerte);
  background: transparent; color: var(--ink-dim); font-size: 13.5px; font-weight: 600; }
.ficha-cab{ display:flex; align-items:center; gap: 12px; padding: 12px 14px; border: 1px solid rgba(var(--cliente), .3);
  border-left: 4px solid rgba(var(--cliente), .55); border-radius: 12px; background: rgba(var(--cliente), .06); }
.ficha-cab .avatar{ width: 52px; height: 52px; font-size: 18px; }
.ficha-cab .quien{ margin: 0; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.boton-wa{ flex: none; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; text-decoration: none;
  color: #74e3a4; background: rgba(37, 211, 102, .12); border: 1px solid rgba(37, 211, 102, .35); white-space: nowrap; }
.ficha-datos{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ficha-datos .dato{ padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .02); }
.ficha-datos .num{ font-size: 17px; font-weight: 800; white-space: nowrap; }
.ficha-datos .que{ font-size: 12px; color: var(--ink-dim); }
.ficha-datos .aviso .num{ color: #f5b14a; }
.ficha-datos .bien .num{ color: var(--bien); }
.ficha-titulo{ margin: 4px 0 -4px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: rgba(var(--pedido), .85); }
.ficha-pedidos{ display:flex; flex-direction: column; gap: 6px; }
/* Sus productos uno a uno (pedidos.js, productosCliente): arriba lo que se ve (piezas, lo que debe, lo que falta
   imprimir) y los filtros, «Todo» y dos grupos que se encienden y apagan, cada uno con un punto de su color (ámbar lo que
   falta, verde lo hecho); cada producto con su borde azul (verde, si ya está entregado y cobrado) */
.productos-cliente{ display:flex; flex-direction: column; gap: 8px; }
.productos-cab{ display:flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.productos-cab .ficha-titulo{ margin: 4px 0 0; }
.productos-cuenta{ font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.filtros-productos{ display:flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.filtros-productos .grupo{ display:flex; flex-wrap: wrap; gap: 4px; }
.filtro-producto{ --tono: 255, 255, 255; display:inline-flex; align-items:center; padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--ink-dim); font-size: 12.5px; }
.filtro-producto::before{ content: ""; flex: none; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%;
  background: rgba(var(--tono), .8); }
.filtro-producto.f-todo::before{ display: none; }
.filtro-producto.f-imprimir, .filtro-producto.f-cobrar{ --tono: 245, 177, 74; }
.filtro-producto.f-entregar{ --tono: 142, 234, 191; }
.filtro-producto.f-entregado, .filtro-producto.f-cobrado{ --tono: var(--bien-rgb); }
.filtro-producto.activo{ border-color: rgba(var(--tono), .65); background: rgba(var(--tono), .14); color: rgb(var(--tono)); }
.filtro-producto .cuenta{ margin-left: 6px; font: 600 11px/1 var(--mono); color: var(--ink-faint); }
.filtro-producto.activo .cuenta{ color: inherit; }
.productos-lista{ display:flex; flex-direction: column; gap: 6px; }
.producto-cliente{ padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid rgba(var(--producto), .55);
  border-radius: 12px; background: rgba(255, 255, 255, .02); font-size: 13.5px; }
.producto-cliente.hecho{ border-left-color: var(--bien); }
.producto-cliente.hecho .linea-datos > :not(.pasos-caja){ opacity: .75; }
.producto-cliente .linea{ margin-top: 6px; }
.ir-pedido .cuando{ color: var(--ink-dim); font-weight: 500; }
.cola-que .precio{ color: var(--ink-dim); font-weight: 500; }
.cola-cab .marca.debe{ color: #f5b14a; border-color: rgba(245, 177, 74, .45); background: rgba(245, 177, 74, .08); }
.cola-cab .marca.cobrada{ color: var(--bien); border-color: rgba(var(--bien-rgb), .45); }
.comentario-pedido{ margin: 4px 0 0; font-size: 12.5px; font-style: italic; color: var(--ink-dim); white-space: pre-line; }
/* Con varias piezas, debajo de los pasos: todas al siguiente y una atrás */
.pasar{ display:flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pasar button{ padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 650; }
.pasar .hacer{ border: 1px solid rgba(var(--bien-rgb), .45); background: rgba(var(--bien-rgb), .12); color: var(--bien); }
.pasar .hacer:hover{ background: rgba(var(--bien-rgb), .22); }
.pasar .deshacer{ border: 1px solid var(--line-fuerte); background: transparent; color: var(--ink-dim); }
/* En la ficha, la línea del pedido lleva la fecha y el total (el nombre ya está arriba) y, si va a otro nombre, lo dice */
.pedido-linea .quien.en-ficha{ display:flex; flex-direction: column; gap: 1px; font-weight: 600; }
.quien.en-ficha .cuando{ font-variant-numeric: tabular-nums; }
.quien.en-ficha .cuando > span{ white-space: nowrap; }
.quien.en-ficha .otro-nombre{ font-size: 12.5px; font-weight: 500; color: var(--ink-dim); }

/* «Por imprimir»: cuántas horas hay y lo que cabe (plan-dia), y una entrada por línea con piezas que faltan */
.plan-dia{ display:flex; flex-wrap:wrap; align-items:center; gap: 8px 16px; margin-bottom: 12px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .02); }
.plan-dia[hidden]{ display: none; }
.plan-horas{ display:flex; align-items:center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.plan-horas input{ width: 76px; }
.plan-horas .num-paso{ width: 148px; }
.plan-texto{ flex: 1; min-width: 220px; margin: 0; font-size: 13px; color: var(--ink-dim); }
/* Cada entrada es un producto que imprimir: borde azul de producto (verde, si ya está impreso) */
.cola-item{ padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid rgba(var(--producto), .55); border-radius: 12px;
  background: rgba(255, 255, 255, .02); font-size: 13.5px; }
.cola-item.hecho{ border-left-color: var(--bien); opacity: .65; }
.cola-item.no-cabe{ opacity: .6; }
.cola-cab{ display:flex; flex-wrap:wrap; align-items:center; gap: 4px 10px; }
.ir-pedido{ display:inline-flex; align-items:center; gap: 2px 8px; flex-wrap: wrap; padding: 0; border: 0; background: none;
  font-size: 12.5px; font-weight: 600; text-align: left; }
.ir-pedido:hover .nombre-cliente{ text-decoration: underline; }
.ir-pedido:hover .num-pedido{ background: rgba(var(--pedido), .26); }
.sin-confirmar{ font-size: 12px; color: #f5b14a; }
.cola-cab .marca{ margin-left: auto; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-fuerte); font-size: 12px;
  color: var(--ink-dim); white-space: nowrap; }
.cola-cab .marca.cabe, .cola-cab .marca.hecha{ color: var(--bien); border-color: rgba(var(--bien-rgb), .45); }
.cola-cab .marca.no{ color: var(--ink-faint); }
.cola-cab .marca.sin{ color: #f5b14a; border-color: rgba(245, 177, 74, .45); }
.cola-que{ font-size: 14.5px; font-weight: 650; }
.cola-que .faltan{ color: #f5b14a; font-weight: 600; }
.cola-item .guardando{ font-size: 12px; color: var(--ink-faint); }

/* «📱 En el móvil» (static/js/pedidos-app.js): el QR con el enlace y la clave */
.qr-movil{ width: 210px; margin: 0 auto 12px; border-radius: 12px; overflow: hidden; background: #fff; }
.qr-movil svg{ display:block; width: 100%; height: auto; }
.qr-estado{ color: var(--bien); }
.qr-estado:empty{ display: none; }

/* ---- Pantallas estrechas: el móvil (393 px de ancho en un POCO X5 Pro) y la app en una ventana estrecha ----
   Cada pedido, plegado en una línea de 52 px; desplegado, la fecha, el total y el WhatsApp arriba y, para marcarlo,
   controles grandes (46 px de alto, letra de 16 px) con «Pagado» ocupando toda la fila para acertar con el dedo */
@media (max-width: 600px){
  .resumen-pedidos{ grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .cifra{ padding: 10px 12px; border-radius: 12px; }
  .cifra .num{ font-size: 19px; }
  .cifra .que{ font-size: 12px; }
  /* «Lo más pedido», una fila estrecha a todo el ancho; lo desplegado, a todo el ancho y con su propio scroll */
  .mas-pedido{ grid-column: 1 / -1; }
  .mas-pedido > summary{ display:flex; align-items:center; gap: 10px; min-height: 46px; padding: 8px 12px; }
  .mas-pedido > summary .num{ font-size: 18px; }
  .mas-pedido > summary .que{ font-size: 14.5px; }
  .mas-pedido-caja{ left: 0; width: auto; grid-template-columns: minmax(0, 1fr); max-height: 65vh; overflow-y: auto; }
  .mas-pedido-lista ol{ font-size: 14.5px; }
  .mas-pedido-lista li{ margin: 5px 0; }
  .columna-imprimir{ margin-bottom: 8px; }
  .cifra.lista .imprimir-lista > li{ grid-template-columns: 64px minmax(0, 1fr); }
  .imprimir-lista .foto{ width: 64px; height: 64px; }
  .panel-imprimir span.ref{ margin: 4px 0 2px; padding: 2px 9px; }  /* sin enlace no hay que tocarlo: no tan alto */
  .imprimir-lista .nombre{ font-size: 15.5px; }
  .cifra.lista .imprimir-lista .prod .n{ font-size: 18px; }
  .imprimir-lista .t{ font-size: 13px; }
  .imprimir-lista .variantes{ font-size: 14px; }
  .cifra.lista summary{ min-height: 26px; font-size: 13px; }

  .barra-pedidos{ flex-direction: column; align-items: stretch; gap: 10px; }
  .barra-pedidos input[type=search]{ max-width: none; padding: 11px 12px; font-size: 16px; }
  .filtros{ gap: 6px; }
  .filtros button{ padding: 8px 12px; font-size: 13.5px; }

  /* La línea plegada, alta para acertar con el dedo; desplegado: la fecha y el total, y el WhatsApp a la derecha */
  .pedido-linea{ min-height: 52px; padding: 8px 12px; gap: 8px; font-size: 15.5px; }
  .pedido-linea .etiqueta{ font-size: 12.5px; }
  .pedido-cuerpo{ padding: 0 12px 12px; }
  .pedido-cab{ gap: 4px 10px; }
  .pedido-cab .tel{ padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    text-decoration: none; color: #74e3a4; background: rgba(37, 211, 102, .12); border: 1px solid rgba(37, 211, 102, .35); }
  .pedido-cab .tel::before{ content: "💬 "; }
  .cliente-fila{ min-height: 64px; padding: 10px 12px; gap: 10px; }
  .cliente-fila .quien{ font-size: 16.5px; }
  .tel-texto{ font-size: 14px; }
  .chip{ font-size: 13px; padding: 3px 10px; }
  .ficha-cliente .volver{ min-height: 44px; padding: 0 16px; font-size: 15px; }
  .ficha-cab .quien{ font-size: 21px; }
  .boton-wa{ min-height: 44px; display:inline-flex; align-items:center; font-size: 15px; }
  .ficha-datos{ gap: 6px; }
  .ficha-datos .dato{ padding: 8px 10px; }
  .ficha-datos .num{ font-size: 16px; }
  .ficha-datos .que{ font-size: 12.5px; }
  .quien.en-ficha .otro-nombre{ font-size: 13.5px; }
  .lineas{ font-size: 14.5px; }
  /* La foto, a la izquierda del nombre, y los pasos por debajo, a todo el ancho: al lado de la foto no caben */
  .linea{ display: block; }
  .linea::after{ content: ""; display: block; clear: both; }
  .linea .foto{ float: left; width: 52px; height: 52px; margin: 2px 10px 6px 0; }
  .linea .pasos-caja{ clear: both; }
  /* Los pasos, de 48 px para acertar con el dedo; los botones de debajo (varias piezas), de 44 px y a lo ancho */
  .pasos-pieza{ max-width: none; }
  .pasos-pieza .paso{ min-height: 48px; }
  .pasar{ gap: 8px; }
  .pasar button{ flex: 1; min-height: 44px; font-size: 15px; }
  .pasar .deshacer{ flex: none; }
  .producto-cliente{ padding: 10px 12px; }
  .filtros-productos{ gap: 6px; }
  .filtro-producto{ padding: 8px 12px; font-size: 13.5px; }
  .productos-cuenta{ font-size: 14px; }
  .comentario-pedido{ font-size: 13.5px; }
  .detalle{ font-size: 13.5px; }
  .muestra{ width: 13px; height: 13px; }
  .pedido .ref, .cola-item .ref, .producto-cliente .ref, .panel-imprimir .ref{ margin: 5px 0 6px; padding: 7px 12px; font-size: 13.5px; }  /* para acertar con el dedo */
  .panel-imprimir a.ref{ padding: 7px 10px; font-size: 12.5px; white-space: nowrap; }  /* en una línea, al lado de las piezas */
  .pedido .comentario{ font-size: 14px; }

  .plan-dia{ flex-direction: column; align-items: stretch; }

  .pedido-acciones{ display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px;
    grid-template-areas: "estado forma" "pagado pagado" "pregunta pregunta" "nota nota"; }
  .pregunta-forma{ grid-area: pregunta; display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .pregunta-forma .que{ grid-column: 1 / -1; font-size: 15px; }
  .pregunta-forma button{ min-height: 44px; padding: 0 6px; border-radius: 10px; font-size: 15px; }
  .pedido-acciones label{ flex-direction: column; align-items: stretch; gap: 4px; font-size: 12px; color: var(--ink-dim); }
  .pedido-acciones .campo-estado{ grid-area: estado; }

  .pedido-acciones .campo-pagado{ grid-area: pagado; flex-direction: row; align-items: center; gap: 10px; min-height: 46px;
    padding: 0 12px; border: 1px solid var(--line-fuerte); border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .pedido.pagado .campo-pagado{ color: var(--bien); border-color: rgba(var(--bien-rgb), .55); background: rgba(var(--bien-rgb), .1); }
  .pedido-acciones select{ width: 100%; min-height: 46px; font-size: 16px; }

<body>

   <div class="pedidos-rejilla">

        <div class="filtros" role="group" aria-label="Filtrar">

          <button type="button" data-filtro="imprimir">Por imprimir</button>

      inicio».</p>

      id="olvidar">Olvidar la clave en este móvil</button></span></p>
