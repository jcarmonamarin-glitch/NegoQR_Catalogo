al pedirlo.\nCon corazón o sin él (dínoslo en el comentario).","medidas":"","filamento":"PLA+","tiempo":"","colores":null,"piezas":["Nombre","Corazón"],"personalizar":"Nombres de los invitados","destacado":true,"credito":"","img":"mvfxm6ijpgrk-1792455381739","ancho":960,"alto":720},{"id":"mvfxm6j6tw4w","nombre":"Topper de tarta personalizado","categoria":"Bodas y eventos","ref":"P-314","printables":"","precio":3.2,"descripcion":"Para cumpleaños, comuniones, bodas y bautizos: eliges los colores y escribes el texto al pedirlo.\nHasta 3 líneas y un dibujo: corazón, estrella, cruz o anillos (dinos cuál en el comentario).","medidas":"","filamento":"PLA+","tiempo":"","colores":null,"piezas":["Base","Letras"],"personalizar":"Texto del topper","destacado":true,"credito":"","img":"mvfxm6j6tw4w-1792455381756","ancho":960,"alto":720}],"fecha":"25/10/2026"}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('datos').textContent);
  const $ = (id) => document.getElementById(id);
  const euros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  const precio = (n) => euros.format(n);
  const quitarTildes = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  const normalizar = (t) => quitarTildes(String(t || '').toLowerCase());
  // Los colores de cada producto: null = todos los rollos del taller; si no, sus posiciones en D.filamentos
  D.productos.forEach((p) => { p.colores = p.colores ? p.colores.map((i) => D.filamentos[i]) : D.filamentos; });
  const porId = new Map(D.productos.map((p) => [p.id, p]));
  const URL_WEB = 'https://jcarmonamarin-glitch.github.io/NegoQR_Catalogo/';  // la publicada, también en la vista previa local: es la que se comparte

  function el(tag, clase, ...hijos) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    for (const h of hijos) if (h !== null && h !== undefined && h !== false) e.append(h);
    return e;
  }
  const ICONOS = {
    medidas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>',
    filamento: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>',
    reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    wa: document.querySelector('#porWhatsapp svg').outerHTML,
    corazon: '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.6-4.6-9.4-9.4C1.3 7.6 3.6 4 7.2 4c2 0 3.5 1.1 4.8 2.9C13.3 5.1 14.8 4 16.8 4c3.6 0 5.9 3.6 4.6 7.1-1.8 4.8-9.4 9.4-9.4 9.4Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>',
    deslizar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="m9.5 10 2.5-2.5 2.5 2.5M9.5 14l2.5 2.5 2.5-2.5"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    cerrar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    bolsa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
    subir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/><path d="m6 20 6-6 6 6" opacity=".45"/></svg>',
    arriba: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    anterior: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
    siguiente: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  };
  // Los botones de la página con icono ([data-icono]): el icono, delante de lo que ya tengan
  document.querySelectorAll('[data-icono]').forEach((e) => e.insertAdjacentHTML('afterbegin', ICONOS[e.dataset.icono]));
  const conIcono = (etiqueta, clase, icono, ...hijos) => {
    const e = el(etiqueta, clase, ...hijos);
    e.insertAdjacentHTML('afterbegin', ICONOS[icono]);
    return e;
  };
  // Quien pide menos movimiento en su móvil: sin animaciones (las ventanas se abren y cierran sin más)
  const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Los iconos son constantes de esta página (nunca texto de los productos): por eso van por innerHTML
  function dato(icono, texto) {
    const d = el('span', 'dato');
    d.insertAdjacentHTML('afterbegin', ICONOS[icono]);
    d.append(texto);
    return d;
  }

  // ---- Colores: los rollos del taller con su color (web.py los manda ya como {n: nombre, c: #rrggbb}) ----
  function punto(color) {
    const p = el('span', 'punto');
    p.style.setProperty('--c', color.c);
    return p;
  }

  // ---- Lo que elige el cliente de cada producto: un color por parte (o uno solo) y, si es personalizado, un texto ----
  const partesDe = (p) => (p.colores.length ? (p.piezas.length ? p.piezas : ['Color']) : []);
  // Con un solo color posible no hay nada que elegir
  const eleccionInicial = (p) => partesDe(p).map(() => (p.colores.length === 1 ? p.colores[0].n : ''));
  // Hay que abrir la ficha para añadirlo (elegir color o escribir el texto)
  const hayQueElegir = (p) => p.colores.length > 1 || !!p.personalizar;
  const falta = (p, l) => {
    const partes = partesDe(p);
    const sin = partes.filter((_, i) => !l.colores[i]);
    if (sin.length) return partes.length > 1 ? `Elige el color de: ${sin.join(', ')}` : 'Elige el color';
    if (p.personalizar && !l.texto.trim()) return `Escribe: ${p.personalizar}`;
    return '';
  };
  // «Chapa: Negro · Borde y letras: Amarillo · Nombre y teléfono: «Milo 600…»» (va así al pedido y a WhatsApp)
  function detalleLinea(p, l) {
    const partes = partesDe(p);
    const colores = partes.map((parte, i) => (!l.colores[i] ? '' : partes.length > 1 ? `${parte}: ${l.colores[i]}` : l.colores[i]));
    return [...colores, l.texto ? `${p.personalizar}: «${l.texto}»` : ''].filter(Boolean).join(' · ');
  }

  // ---- Cesta (se recuerda en este navegador): una línea por producto + lo que se eligió ----
  const GUARDADO = 'catalogo-cesta-v2';
  const cesta = new Map();  // clave → {id, n, colores: [nombre por parte], texto}
  const claveLinea = (id, colores, texto) => JSON.stringify([id, colores, texto]);
  function meter(l) {
    const p = porId.get(l.id);
    if (!p || !(l.n > 0)) return;
    const colores = partesDe(p).map((_, i) => {
      const c = (l.colores || [])[i] || '';
      return p.colores.some((x) => x.n === c) ? c : '';  // un color que ya no hay: queda por elegir
    });
    const texto = String(l.texto || '').slice(0, 600);
    cesta.set(claveLinea(l.id, colores, texto), { id: l.id, n: Math.min(99, Math.round(l.n)), colores, texto });
  }
  try {
    JSON.parse(localStorage.getItem(GUARDADO) || '[]').forEach(meter);
    // La cesta de antes (hasta el 20/10/2026: [[id, n]], sin colores)
    JSON.parse(localStorage.getItem('catalogo-cesta-v1') || '[]').forEach(([id, n]) => meter({ id, n, colores: [], texto: '' }));
    localStorage.removeItem('catalogo-cesta-v1');
  } catch (e) { /* sin almacenamiento: la cesta dura lo que la visita */ }
  const guardarCesta = () => { try { localStorage.setItem(GUARDADO, JSON.stringify([...cesta.values()])); } catch (e) { /* nada */ } };
  const lineasDe = (id) => [...cesta.values()].filter((l) => l.id === id);
  const unidades = () => [...cesta.values()].reduce((a, l) => a + l.n, 0);
  const unidadesDe = (id) => lineasDe(id).reduce((a, l) => a + l.n, 0);
  const totalCesta = () => [...cesta.values()].reduce((t, l) => t + porId.get(l.id).precio * l.n, 0);

  // Pone `n` unidades de esa línea (0 la quita); si ya había otra igual, es la misma
  function poner(l, n) {
    const clave = claveLinea(l.id, l.colores, l.texto);
    if (n > 0) cesta.set(clave, { id: l.id, colores: [...l.colores], texto: l.texto, n: Math.min(99, n) });
    else cesta.delete(clave);
    guardarCesta();
    pintarCesta();
  }

  // La foto (la de 480 px en la tarjeta, la de 960 en la ficha): mientras llega, un reflejo; al llegar, un fundido. Las
  // que se ven enteras, sobre el color de su borde
  function foto(p, lado) {
    const f = el('div', `foto${p.entera ? ' entera' : ''}`);
    if (!p.img) { f.classList.add('lista'); f.append(el('span', 'sin', 'Sin foto')); return f; }
    if (p.entera && p.fondo) f.style.background = p.fondo;
    const img = el('img');
    const lista = () => f.classList.add('lista');
    img.addEventListener('load', lista);
    img.addEventListener('error', lista);
    img.src = `img/${p.img}-${lado}.webp`;
    img.alt = p.nombre;
    img.width = lado === 960 ? p.ancho : Math.round(p.ancho / 2);
    img.height = lado === 960 ? p.alto : Math.round(p.alto / 2);
    if (lado !== 960) { img.loading = 'lazy'; img.decoding = 'async'; }
    if (p.pos) img.style.objectPosition = p.pos;
    f.append(img);
    return f;
  }

  // ---- Favoritos: lo que el cliente marca con el corazón (se recuerda en su navegador) ----
  const FAVORITOS = 'catalogo-favoritos-v1';
  let favoritos = new Set();
  try { favoritos = new Set(JSON.parse(localStorage.getItem(FAVORITOS) || '[]').filter((id) => porId.has(id))); } catch (e) { /* nada */ }
  function botonFavorito(id, clase, ...hijos) {
    const b = el('button', clase, ...hijos);
    b.type = 'button';
    b.dataset.fav = id;
    b.setAttribute('aria-label', `Me gusta: ${porId.get(id).nombre}`);
    b.addEventListener('click', (ev) => { ev.stopPropagation(); alternarFavorito(id); });
    pintarFavorito(b, favoritos.has(id));
    return b;
  }
  function pintarFavorito(b, si) {
    b.classList.toggle('si', si);
    b.setAttribute('aria-pressed', String(si));
  }
  function alternarFavorito(id, si = !favoritos.has(id)) {
    if (si === favoritos.has(id)) return;
    if (si) favoritos.add(id); else favoritos.delete(id);
    try { localStorage.setItem(FAVORITOS, JSON.stringify([...favoritos])); } catch (e) { /* nada */ }
    document.querySelectorAll(`[data-fav="${id}"]`).forEach((b) => {
      pintarFavorito(b, si);
      if (si && !reducir) { b.classList.remove('latido'); void b.offsetWidth; b.classList.add('latido'); }
    });
    pintarChipFavoritos();
    if (categoria === FAV) filtrar();
    aviso(si ? 'Guardado en tus favoritos' : 'Quitado de tus favoritos');
  }

  // ---- Lista de productos por categoría (y arriba, los destacados) ----
  let categoria = '';
  const DESTACADOS = '★';  // data-categoria de la sección de destacados
  const FAV = '♥';  // la categoría «Favoritos» (los que tienen el corazón)
  const tarjetas = new Map();  // id → [botones de cada tarjeta suya: {mas, paso (− N +), cuenta, menos, masP}]
  let enFeed = [];  // los mismos botones en «Descubrir»: [{id, b}] (se quitan al cerrarla)

  // El «+» suma o resta en la última línea de este producto (el mismo color); la primera vez, si hay que elegir color o
  // escribir algo, abre la ficha
  function sumarProducto(p, d) {
    const l = lineasDe(p.id).pop();
    if (!l) {
      if (hayQueElegir(p)) { abrirFicha(p.id); return; }
      poner({ id: p.id, colores: eleccionInicial(p), texto: '' }, 1);
      aviso(`Añadido: ${p.nombre}`);
      return;
    }
    const n = Math.min(99, l.n + d);
    poner(l, n);
    const que = detalleLinea(p, l);
    if (d > 0) aviso(`Añadido: ${p.nombre}${que ? ` (${que})` : ''}`);
    else if (!n) aviso(`Quitado: ${p.nombre}${que ? ` (${que})` : ''}`);
    else $('aviso').classList.remove('ver');  // que no siga el «Añadido» del «+» de antes
  }
  // El «+» (con `texto`) y el «− N +» de un producto, en su tarjeta o en «Descubrir»
  function botonesCompra(p, texto) {
    const mas = el('button', 'mas', texto);
    const menosP = el('button', '', '−');
    const masP = el('button', '', '+');
    const cuenta = el('span');
    const paso = el('div', 'paso', menosP, cuenta, masP);
    paso.setAttribute('role', 'group');
    [mas, menosP, masP].forEach((b) => { b.type = 'button'; });
    mas.setAttribute('aria-label', hayQueElegir(p) ? `Elegir y añadir ${p.nombre}` : `Añadir ${p.nombre} al pedido`);
    masP.setAttribute('aria-label', 'Una más');
    mas.addEventListener('click', () => sumarProducto(p, 1));
    masP.addEventListener('click', () => sumarProducto(p, 1));
    menosP.addEventListener('click', () => sumarProducto(p, -1));
    return { mas, paso, cuenta, menos: menosP, masP };
  }

  function tarjeta(p) {
    const abrir = el('button', 'abrir', foto(p, 480), el('div', 'cuerpo', el('h3', '', p.nombre)));
    abrir.type = 'button';
    abrir.addEventListener('click', () => abrirFicha(p.id));
    const b = botonesCompra(p, '+');
    const t = el('article', 'tarjeta', abrir, botonFavorito(p.id, 'fav', conIcono('span', '', 'corazon')),
      el('div', 'pie', el('span', 'precio', precio(p.precio)), b.mas, b.paso));
    t.dataset.id = p.id;
    tarjetas.set(p.id, [...(tarjetas.get(p.id) || []), b]);
    pintarBoton(p.id);
    tarjetaQueEntra(t);
    return t;
  }

  // Las tarjetas entran con un fundido, subiendo un poco, la primera vez que se ven al bajar; las de una misma fila,
  // escalonadas
  const entrada = 'IntersectionObserver' in window && !reducir ? new IntersectionObserver((vistas) => {
    let k = 0;
    vistas.forEach((v) => {
      if (!v.isIntersecting) return;
      const t = v.target;
      entrada.unobserve(t);
      t.style.setProperty('--retraso', `${Math.min(k++, 5) * 55}ms`);
      t.classList.replace('entra', 'aparece');
      t.addEventListener('animationend', () => t.classList.remove('aparece'), { once: true });
    });
  }, { rootMargin: '0px 0px -4% 0px' }) : null;
  function tarjetaQueEntra(t) {
    if (!entrada) return;
    t.classList.add('entra');
    entrada.observe(t);
  }

  function pintarBoton(id) {
    const n = unidadesDe(id);
    const foco = document.activeElement;
    [...(tarjetas.get(id) || []), ...enFeed.filter((x) => x.id === id).map((x) => x.b)].forEach((t) => {
      t.mas.classList.toggle('oculto', n > 0);
      t.paso.classList.toggle('oculto', !n);
      t.cuenta.textContent = String(n);
      t.masP.disabled = n >= 99;
      t.paso.setAttribute('aria-label', `${n} en el pedido`);
      t.menos.setAttribute('aria-label', n > 1 ? 'Una menos' : 'Quitar del pedido');
      // Con teclado, que el foco no se pierda al cambiar de «+» a «− N +» y al revés
      if (n && foco === t.mas) t.masP.focus();
      else if (!n && t.paso.contains(foco)) t.mas.focus();
    });
  }

  function pintarProductos() {
    const seccion = (titulo, c, lista) => {
      // «Deslizar»: los de esta sección (los que se ven ahora) en «Descubrir»
      const ver = conIcono('button', 'ver-feed', 'deslizar', 'Deslizar');
      ver.type = 'button';
      ver.setAttribute('aria-label', `Ver ${titulo} deslizando`);
      const s = el('section', `seccion${c === DESTACADOS ? ' destacados' : ''}`,
        el('div', 'seccion-cab', el('h2', '', titulo, el('small', '', String(lista.length))), ver),
        el('div', 'rejilla', ...lista.map(tarjeta)));
      s.dataset.categoria = c;
      ver.addEventListener('click', () => abrirFeed(visibles(s)));
      return s;
    };
    const destacados = D.productos.filter((p) => p.destacado);
    const secciones = D.categorias.map((c) => seccion(c, c, D.productos.filter((p) => p.categoria === c)));
    if (destacados.length) secciones.unshift(seccion('Destacados', DESTACADOS, destacados));
    const nada = el('p', 'vacio oculto', 'No hay productos que coincidan.');
    nada.id = 'sinResultados';
    $('productos').replaceChildren(...secciones, nada);
  }

  function filtrar() {
    const busca = normalizar($('buscar').value.trim());
    const fav = categoria === FAV;
    let algo = false;
    document.querySelectorAll('.seccion').forEach((s) => {
      let cuantos = 0;
      // Los destacados, solo en «Todo» y sin buscar (si no, saldrían dos veces)
      const destacados = s.dataset.categoria === DESTACADOS;
      if (destacados ? !categoria && !busca : !categoria || fav || s.dataset.categoria === categoria) {
        s.querySelectorAll('.tarjeta').forEach((t) => {
          const ver = (!busca || porId.get(t.dataset.id).buscar.includes(busca)) && (!fav || favoritos.has(t.dataset.id));
          t.classList.toggle('oculto', !ver);
          if (ver) cuantos++;
        });
      }
      s.classList.toggle('oculto', !cuantos);
      if (cuantos) algo = true;
    });
    $('sinResultados').textContent = fav && !favoritos.size
      ? 'Aún no tienes favoritos: toca el ♥ de un producto para guardarlo aquí.' : 'No hay productos que coincidan.';
    $('sinResultados').classList.toggle('oculto', algo);
  }

  // Los productos que se ven ahora en la lista (o en una sección), en su orden y sin repetir (un destacado sale también
  // en su categoría)
  function visibles(dentro = document) {
    const vistos = new Set();
    return [...dentro.querySelectorAll('.tarjeta')].filter((t) => t.offsetParent !== null).map((t) => t.dataset.id)
      .filter((id) => !vistos.has(id) && vistos.add(id));
  }

  function pintarChips() {
    const chip = (texto, valor, clase = '') => {
      const b = el('button', `chip${clase}${valor === categoria ? ' activo' : ''}`, texto);
      b.type = 'button';
      b.addEventListener('click', () => {
        categoria = valor;
        document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('activo', x === b));
        filtrar();
        pintarChipFavoritos();
        irAlPrincipio();
        // El chip, en medio de su fila (solo esa fila: scrollIntoView movería también la página y cortaría lo de arriba)
        const fila = $('chips'), r = b.getBoundingClientRect(), c = fila.getBoundingClientRect();
        fila.scrollBy({ left: r.left - c.left - (c.width - r.width) / 2, behavior: reducir ? 'auto' : 'smooth' });
      });
      return b;
    };
    const fav = chip('', FAV, ' favoritos');
    fav.id = 'chipFavoritos';
    $('chips').replaceChildren(chip('Todo', ''), fav, ...D.categorias.map((c) => chip(c, c)));
    pintarChipFavoritos();
  }
  // Al elegir una categoría: al principio de lo que se ve (su título, justo debajo de la barra fija). La posición se
  // mide con getBoundingClientRect: el offsetTop de la barra fija es el de donde está pegada ahora, no el de su sitio.
  // Si está cerca, se desliza hasta allí; si está lejos, se va de golpe (deslizando pasaría toda la lista por delante)
  // y lo nuevo aparece con un fundido
  function irAlPrincipio() {
    const m = $('productos');
    const s = m.querySelector('.seccion:not(.oculto)') || m;
    const destino = Math.max(0, s.getBoundingClientRect().top + scrollY - document.querySelector('.barra').offsetHeight - 6);
    const lejos = Math.abs(destino - scrollY) > innerHeight * 1.2;
    window.scrollTo({ top: destino, behavior: reducir || lejos ? 'auto' : 'smooth' });
    if (reducir) return;
    m.classList.remove('cambio');
    void m.offsetWidth;  // para que la animación vuelva a empezar
    m.classList.add('cambio');
  }
  // «♥ Favoritos (3)»: solo si hay alguno (o si es el que está elegido)
  function pintarChipFavoritos() {
    const c = $('chipFavoritos');
    if (!c) return;
    c.textContent = `♥ Favoritos${favoritos.size ? ` (${favoritos.size})` : ''}`;
    c.classList.toggle('oculto', !favoritos.size && categoria !== FAV);
  }

  // ---- Ventanas: el botón «atrás» del móvil las cierra en lugar de salir de la página ----
  function abrirDialogo(d) {
    const otra = [...document.querySelectorAll('dialog[open]')].some((x) => x !== d && !x.classList.contains('cerrando'));
    document.querySelectorAll('dialog[open]').forEach((x) => { if (x !== d) { sinCierre(x); x.close(); } });
    sinCierre(d);
    if (d.open) return;
    d.showModal();
    // De una ventana a otra (de la cesta a la ficha y vuelta): la misma entrada del historial
    if (otra && history.state && history.state.dialogo) history.replaceState({ dialogo: d.id }, '');
    else history.pushState({ dialogo: d.id }, '');
  }
  function cerrarDialogo(d) {
    if (!d.open) return;
    if (history.state && history.state.dialogo === d.id) history.back(); else cerrarYa(d);
  }
  // Se cierra bajando (o con un fundido en pantallas anchas); sin animación si ya se ha bajado con el dedo
  function cerrarYa(d) {
    if (!d.open || d.classList.contains('cerrando')) return;
    if (reducir || d.dataset.arrastrada) {
      delete d.dataset.arrastrada;
      d.close();
      d.style.transform = '';
      d.style.transition = '';
      return;
    }
    d.classList.add('cerrando');
    d.cierre = setTimeout(() => { d.classList.remove('cerrando'); d.close(); }, 230);
  }
  function sinCierre(d) {
    clearTimeout(d.cierre);
    d.classList.remove('cerrando');
  }
  window.addEventListener('popstate', () => document.querySelectorAll('dialog[open]').forEach(cerrarYa));
  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('cancel', (ev) => { ev.preventDefault(); cerrarDialogo(d); });
    d.addEventListener('click', (ev) => { if (ev.target === d || ev.target.closest('[data-cerrar]')) cerrarDialogo(d); });
    arrastrarParaCerrar(d);
  });

  // En el móvil, la hoja se baja con el dedo para cerrarla: desde arriba del todo (el asa o la foto) o desde cualquier
  // sitio si lo de dentro ya está arriba del todo; si no se baja lo bastante, vuelve a su sitio
  function arrastrarParaCerrar(d) {
    let y0 = null, dy = 0, cuerpo = null;
    d.addEventListener('touchstart', (ev) => {
      y0 = null;
      // (sobre el fondo oscuro de fuera, el toque es para cerrar: no se arrastra nada)
      if (innerWidth >= 700 || ev.touches.length !== 1 || ev.target === d
        || ev.target.closest('input, textarea, .opciones-color')) return;
      cuerpo = d.querySelector('.dlg-cuerpo');
      const arriba = ev.touches[0].clientY - d.getBoundingClientRect().top < 64;
      if (!arriba && cuerpo && cuerpo.scrollTop > 0) return;
      y0 = ev.touches[0].clientY;
      dy = 0;
    }, { passive: true });
    d.addEventListener('touchmove', (ev) => {
      if (y0 === null) return;
      dy = ev.touches[0].clientY - y0;
      if (dy <= 0 || (cuerpo && cuerpo.scrollTop > 0)) {  // hacia arriba: es mover lo de dentro, no la hoja
        if (dy < -6) { y0 = null; d.style.transform = ''; }
        return;
      }
      ev.preventDefault();
      d.style.transition = 'none';
      d.style.transform = `translateY(${dy}px)`;
    }, { passive: false });
    d.addEventListener('touchend', () => {
      if (y0 === null) return;
      y0 = null;
      d.style.transition = 'transform .26s cubic-bezier(.22, .61, .36, 1)';
      if (dy > Math.min(140, d.offsetHeight * .22)) {
        d.style.transform = 'translateY(105%)';
        d.dataset.arrastrada = '1';
        setTimeout(() => cerrarDialogo(d), 240);
      } else {
        d.style.transform = '';
      }
    });
  }

  // ---- Compartir un producto ----
  // El enlace es su página (p/<id>.html, la genera web.py al publicar): la vista previa de WhatsApp enseña su foto,
  // nombre y precio, y al abrirla lleva aquí con la ficha abierta (#p=<id>). Sin número: WhatsApp pregunta a quién.
  function compartir(p) {
    const a = el('a', 'compartir');
    a.insertAdjacentHTML('afterbegin', ICONOS.wa);
    a.append('Compartir por WhatsApp');
    const enlace = `${URL_WEB}p/${p.id}.html`;
    a.href = `https://wa.me/?text=${encodeURIComponent(`Mira esto: ${p.nombre} (${precio(p.precio)})\n${enlace}`)}`;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }
  function abrirDelEnlace() {
    const m = /^#p=([a-z0-9]+)$/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);  // que «atrás» no la vuelva a abrir
    if (porId.has(m[1])) abrirFicha(m[1]);
  }

  // ---- Ficha de un producto ----
  // Se elige el color (uno por parte) y, si es personalizado, se escribe el texto. Si esa misma combinación ya está
  // en el pedido, el − / + es lo que hay en él y baja hasta 0 (quitarla); si no, cuántas añadir.
  // `editar`: una línea de la cesta que se quiere cambiar (color, texto o cantidad): al guardar, se sustituye.
  function abrirFicha(id, editar = null) {
    const p = porId.get(id);
    const partes = partesDe(p);
    const base = editar || lineasDe(id).pop() || null;
    const sel = { id, colores: base ? [...base.colores] : eleccionInicial(p), texto: base ? base.texto : '' };
    const enPedido = (s) => cesta.get(claveLinea(id, s.colores, s.texto.trim()));
    let ya = 0;
    let cuantos = 1;
    const reiniciar = () => {  // al cambiar lo elegido: el − / + empieza en lo que haya de eso en el pedido
      ya = editar ? editar.n : (enPedido(sel) || {}).n || 0;
      cuantos = ya || 1;
    };
    reiniciar();

    const f = foto(p, 960);
    const cerrar = el('button', 'cerrar', '×');
    cerrar.type = 'button';
    cerrar.dataset.cerrar = '';
    cerrar.setAttribute('aria-label', 'Cerrar');
    f.append(cerrar);
    const texto = el('div', 'texto', el('h2', '', p.nombre), el('span', 'precio', precio(p.precio)), compartir(p));
    if (p.descripcion) texto.append(el('p', 'desc', p.descripcion));
    const datos = [p.medidas && dato('medidas', p.medidas), p.filamento && dato('filamento', p.filamento),
      p.tiempo && dato('reloj', `${p.tiempo} de impresión`)].filter(Boolean);
    if (datos.length) texto.append(el('div', 'datos', ...datos));

    // Colores: un grupo de círculos por parte
    const grupos = partes.map((parte, i) => {
      const botones = p.colores.map((c) => {
        const b = el('button', 'opcion-color', punto(c), c.n);
        b.type = 'button';
        b.addEventListener('click', () => { sel.colores[i] = c.n; reiniciar(); pintar(); });
        return b;
      });
      const titulo = partes.length > 1 ? parte : (p.colores.length > 1 ? 'Elige el color' : 'Color');
      const g = el('div', 'elegir', el('h3', '', titulo), el('div', 'opciones-color', ...botones));
      g.setAttribute('role', 'group');
      g.setAttribute('aria-label', titulo);
      texto.append(g);
      return { botones, g };
    });
    // Texto del cliente (productos personalizados)
    let campoTexto = null;
    if (p.personalizar) {
      campoTexto = el('textarea');
      campoTexto.id = 'textoCliente';
      campoTexto.maxLength = 600;
      campoTexto.rows = 2;
      campoTexto.value = sel.texto;
      campoTexto.placeholder = 'Escríbelo tal cual quieres que salga';
      campoTexto.addEventListener('input', () => { sel.texto = campoTexto.value; reiniciar(); pintar(); });
      const etiqueta = el('label', '', p.personalizar);
      etiqueta.htmlFor = 'textoCliente';
      texto.append(el('div', 'elegir personalizar', etiqueta, campoTexto));
    }
    // Abajo y en pequeño: el código (por si el cliente pregunta o escribe por WhatsApp) y el autor si hay que citarlo
    const referencia = [p.ref && `Ref. ${p.ref}`, p.credito].filter(Boolean).join(' · ');
    if (referencia) texto.append(el('p', 'credito', referencia));

    const n = el('span', '', String(cuantos));
    const menos = el('button', '', '−');
    const masB = el('button', '', '+');
    [menos, masB].forEach((b) => { b.type = 'button'; });
    menos.setAttribute('aria-label', 'Una menos');
    masB.setAttribute('aria-label', 'Una más');
    const anadir = el('button', 'boton', '');
    anadir.type = 'button';
    const nota = el('p', 'nota-cesta');
    const faltaAqui = el('p', 'falta oculto');
    faltaAqui.setAttribute('role', 'alert');

    function pintar() {
      grupos.forEach(({ botones }, i) => botones.forEach((b, j) => {
        const si = sel.colores[i] === p.colores[j].n;
        b.classList.toggle('sel', si);
        b.setAttribute('aria-pressed', String(si));
      }));
      const minimo = ya ? 0 : 1;
      n.textContent = String(cuantos);
      menos.disabled = cuantos <= minimo;
      masB.disabled = cuantos >= 99;
      anadir.classList.toggle('quitar', ya > 0 && !cuantos);
      anadir.textContent = editar ? (!cuantos ? 'Quitar del pedido' : `Guardar · ${precio(p.precio * cuantos)}`)
        : !ya ? `Añadir · ${precio(p.precio * cuantos)}`
        : !cuantos ? 'Quitar del pedido'
        : cuantos === ya ? `En tu pedido · ${precio(p.precio * cuantos)}`
        : `Actualizar · ${precio(p.precio * cuantos)}`;
      // Lo que ya hay de este producto en el pedido (tocando uno, se elige eso)
      const otras = editar ? [] : lineasDe(id);
      nota.replaceChildren(...(otras.length ? ['En tu pedido: ', ...otras.flatMap((l, k) => {
        const b = el('button', 'en-pedido', `${l.n} × ${detalleLinea(p, l) || p.nombre}`);
        b.type = 'button';
        b.addEventListener('click', () => {
          sel.colores = [...l.colores];
          sel.texto = l.texto;
          if (campoTexto) campoTexto.value = l.texto;
          reiniciar();
          pintar();
        });
        return k ? [' ', b] : [b];
      })] : []));
      faltaAqui.classList.add('oculto');
    }
    menos.addEventListener('click', () => { cuantos = Math.max(ya ? 0 : 1, cuantos - 1); pintar(); });
    masB.addEventListener('click', () => { cuantos = Math.min(99, cuantos + 1); pintar(); });
    anadir.addEventListener('click', () => {
      const linea = { id, colores: [...sel.colores], texto: sel.texto.trim() };
      const queFalta = cuantos > 0 ? falta(p, linea) : '';
      if (queFalta) {  // falta elegir algo: se dice y se lleva al sitio
        faltaAqui.textContent = queFalta;
        faltaAqui.classList.remove('oculto');
        const i = partes.findIndex((_, k) => !linea.colores[k]);
        const sitio = i >= 0 ? grupos[i].g : campoTexto;
        if (sitio) {
          sitio.scrollIntoView({ behavior: 'smooth', block: 'center' });
          sitio.classList.remove('marcar');
          void sitio.offsetWidth;  // para que la animación vuelva a empezar
          sitio.classList.add('marcar');
          if (sitio === campoTexto) campoTexto.focus({ preventScroll: true });
        }
        return;
      }
      const que = detalleLinea(p, linea);
      const etiqueta = `${p.nombre}${que ? ` (${que})` : ''}`;
      if (editar) {
        cesta.delete(claveLinea(editar.id, editar.colores, editar.texto));
        const otra = cesta.get(claveLinea(id, linea.colores, linea.texto));  // ya había otra igual: se juntan
        poner(linea, cuantos + (otra ? otra.n : 0));
        abrirDialogo($('dlgCesta'));
        pintarLineas();
        aviso(cuantos ? `Cambiado: ${etiqueta}` : `Quitado: ${etiqueta}`);
        return;
      }
      cerrarDialogo($('dlgFicha'));
      if (cuantos === ya) return;
      poner(linea, cuantos);
      aviso(`${!ya ? 'Añadido' : !cuantos ? 'Quitado' : 'Actualizado'}: ${etiqueta}`);
    });
    pintar();
    const pie = el('div', 'dlg-pie', faltaAqui, el('div', 'comprar', el('div', 'paso', menos, n, masB), anadir), nota);
    const asa = el('span', 'asa');
    asa.setAttribute('aria-hidden', 'true');
    $('ficha').replaceChildren(asa, el('div', 'dlg-cuerpo', f, texto), pie);
    $('dlgFicha').setAttribute('aria-label', p.nombre);
    abrirDialogo($('dlgFicha'));
  }

  // ---- Cesta y pedido ----
  let unidadesAntes = null;
  function pintarCesta() {
    const u = unidades();
    $('cestaBarra').classList.toggle('oculto', !u);
    document.body.classList.toggle('con-cesta', u > 0);
    $('cestaCuantos').textContent = String(u);
    $('cestaTotal').textContent = precio(totalCesta());
    // Al añadir algo, el número salta (si ya se veía la barra: si no, la barra entra subiendo)
    if (unidadesAntes && u > unidadesAntes && !reducir) {
      $('cestaCuantos').classList.remove('salto');
      void $('cestaCuantos').offsetWidth;
      $('cestaCuantos').classList.add('salto');
    }
    unidadesAntes = u;
    $('feedCestaNum').textContent = String(u);
    $('feedCestaNum').classList.toggle('oculto', !u);
    tarjetas.forEach((_, id) => pintarBoton(id));
    if ($('dlgCesta').open) pintarLineas();
  }

  function pintarLineas() {
    if (!cesta.size) {
      $('lineas').replaceChildren(el('li', 'vacio', 'Tu pedido está vacío.'));
    } else {
      $('lineas').replaceChildren(...[...cesta.values()].map((l) => {
        const p = porId.get(l.id);
        const mini = el('div', 'mini');
        if (p.img) mini.style.backgroundImage = `url("img/${p.img}-480.webp")`;
        const menos = el('button', '', l.n > 1 ? '−' : '×');
        const masB = el('button', '', '+');
        [menos, masB].forEach((b) => { b.type = 'button'; });
        menos.setAttribute('aria-label', l.n > 1 ? 'Una menos' : 'Quitar del pedido');
        masB.setAttribute('aria-label', 'Una más');
        menos.addEventListener('click', () => poner(l, l.n - 1));
        masB.addEventListener('click', () => poner(l, l.n + 1));
        // Color y texto: se cambian desde aquí (abre la ficha con esta línea)
        const que = detalleLinea(p, l);
        const pendiente = falta(p, l);
        let cambiar = null;
        if (que || pendiente) {
          cambiar = el('button', `opciones${pendiente ? ' falta' : ''}`, pendiente ? `${pendiente} →` : que);
          cambiar.type = 'button';
          cambiar.title = 'Cambiar';
          cambiar.addEventListener('click', () => abrirFicha(l.id, l));
        }
        return el('li', 'linea', mini,
          el('div', '', el('div', 'nom', p.nombre), cambiar, el('div', 'uni', `${precio(p.precio)} / ud.`)),
          el('div', 'der', el('span', 'sub', precio(p.precio * l.n)), el('div', 'paso', menos, el('span', '', String(l.n)), masB)));
      }));
    }
    $('totalCesta').textContent = precio(totalCesta());
    $('enviar').disabled = !cesta.size;
    $('enviar').classList.toggle('oculto', !D.pedidos);
    pintarWhatsapp();
  }

  // Lo que aún falta por elegir en el pedido («Elige el color» de cada producto), o nada
  const faltas = () => [...cesta.values()].map((l) => {
    const p = porId.get(l.id);
    const que = falta(p, l);
    return que ? `${p.nombre}: ${que.toLowerCase()}` : '';
  }).filter(Boolean);

  // WhatsApp como alternativa (o como única vía si aún no hay dónde recibir los pedidos)
  function textoPedido() {
    const lineas = [...cesta.values()].map((l) => {
      const p = porId.get(l.id);
      const que = detalleLinea(p, l);
      return `• ${l.n} × ${p.nombre} (${precio(p.precio * l.n)})${p.ref ? ` · Ref. ${p.ref}` : ''}${que ? `\n   ${que}` : ''}`;
    });
    const quien = [$('fNombre').value.trim(), $('fApellidos').value.trim()].filter(Boolean).join(' ');
    const coment = $('fComentario').value.trim();
    return ['Hola, quiero hacer este pedido del catálogo:', ...lineas, `Total: ${precio(totalCesta())}`,
      quien ? `\nA nombre de: ${quien}` : '', coment ? `Comentario: ${coment}` : ''].filter(Boolean).join('\n');
  }
  function pintarWhatsapp() {
    const a = $('porWhatsapp');
    a.classList.toggle('oculto', !D.whatsapp || !cesta.size);
    if (!D.whatsapp) return;
    a.href = `https://wa.me/${D.whatsapp.telefono}?text=${encodeURIComponent(textoPedido())}`;
    $('porWhatsappTexto').textContent = D.pedidos ? '¿Prefieres WhatsApp? Envíalo por ahí' : `Enviar pedido por WhatsApp a ${D.whatsapp.nombre}`;
    a.classList.toggle('boton-principal', !D.pedidos);
  }
  ['fNombre', 'fApellidos', 'fComentario'].forEach((id) => $(id).addEventListener('input', pintarWhatsapp));

  // Datos del cliente: se recuerdan en su navegador para el próximo pedido
  const CLIENTE = 'catalogo-cliente-v1';
  try {
    const c = JSON.parse(localStorage.getItem(CLIENTE) || '{}');
    ['nombre', 'apellidos', 'telefono'].forEach((k) => { if (c[k]) $(`f${k[0].toUpperCase()}${k.slice(1)}`).value = c[k]; });
  } catch (e) { /* nada */ }

  $('cestaBarra').addEventListener('click', () => { pintarLineas(); mostrarFormulario(true); abrirDialogo($('dlgCesta')); });

  function mostrarFormulario(si) {
    $('cestaPie').classList.toggle('oculto', !si);
    if (si && $('cestaCuerpo').querySelector('.hecho')) {
      $('cestaCuerpo').querySelector('.hecho').remove();
      [...$('cestaCuerpo').children].forEach((c) => c.classList.remove('oculto'));
    }
  }

  function error(texto) {
    $('errorPedido').textContent = texto;
    $('errorPedido').classList.toggle('oculto', !texto);
  }

  // El autocompletado del móvil escribe el teléfono con +34 y quien lo escribe a mano, sin él: uno español va a la hoja
  // con sus 9 cifras, sin prefijo ni espacios, para que estén todos igual (uno de otro país, tal cual)
  function sinPrefijo(telefono) {
    const m = telefono.replace(/\D/g, '').match(/^(?:0034|34)?(\d{9})$/);
    return m ? m[1] : telefono.trim();
  }

  $('formPedido').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    error('');
    const campos = { nombre: $('fNombre'), apellidos: $('fApellidos'), telefono: $('fTelefono') };
    const vacios = Object.values(campos).filter((c) => !c.value.trim());
    const digitos = campos.telefono.value.replace(/\D/g, '');
    Object.values(campos).forEach((c) => c.setAttribute('aria-invalid', String(vacios.includes(c))));
    if (vacios.length) { error('Rellena nombre, apellidos y teléfono.'); vacios[0].focus(); return; }
    if (digitos.length < 9 || digitos.length > 15) {
      campos.telefono.setAttribute('aria-invalid', 'true');
      error('Revisa el teléfono: debe tener al menos 9 cifras.');
      campos.telefono.focus();
      return;
    }
    if (!$('fAcepto').checked) { error('Marca la casilla para poder enviarnos tus datos.'); return; }
    if (!cesta.size) { error('Tu pedido está vacío.'); return; }
    const pendientes = faltas();
    if (pendientes.length) { error(`Falta: ${pendientes.join('; ')}. Tócalo en tu pedido para elegirlo.`); return; }
    // `detalle`: los colores y el texto de cada línea (web/pedidos.gs lo pone en la hoja junto al producto); `ref` y
    // `printables`: su código y su modelo en Printables (con ellos la hoja apunta el código y el enlace al modelo)
    const pedido = {
      nombre: campos.nombre.value.trim(), apellidos: campos.apellidos.value.trim(), telefono: sinPrefijo(campos.telefono.value),
      comentario: $('fComentario').value.trim(), web: $('fWeb').value,
      lineas: [...cesta.values()].map((l) => {
        const p = porId.get(l.id);
        return { id: l.id, ref: p.ref, printables: p.printables, nombre: p.nombre, categoria: p.categoria, cantidad: l.n,
          precio: p.precio, detalle: detalleLinea(p, l) };
      }),
      total: Math.round(totalCesta() * 100) / 100,
    };
    try { localStorage.setItem(CLIENTE, JSON.stringify({ nombre: pedido.nombre, apellidos: pedido.apellidos, telefono: pedido.telefono })); } catch (e) { /* nada */ }
    const boton = $('enviar');
    boton.disabled = true;
    boton.textContent = 'Enviando…';
    const parar = new AbortController();
    const reloj = setTimeout(() => parar.abort(), 30000);
    try {
      // Como texto plano para que el navegador no pida permiso antes (el script de Google no lo contesta)
      const r = await fetch(D.pedidos, { method: 'POST', body: JSON.stringify(pedido), signal: parar.signal });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'No se pudo enviar.');
      cesta.clear();
      guardarCesta();
      pintarCesta();
      $('fComentario').value = '';
      [...$('cestaCuerpo').children].forEach((c) => c.classList.add('oculto'));
      $('cestaCuerpo').append(el('div', 'hecho', el('div', 'ok', '✓'), el('h2', '', '¡Pedido enviado!'),
        el('p', '', `${j.numero ? `Pedido nº ${j.numero}. ` : ''}Te llamaremos o escribiremos al ${pedido.telefono} para confirmarlo.`)));
      $('cestaPie').classList.add('oculto');
    } catch (e) {
      error(`${e.name === 'AbortError' ? 'No hay respuesta.' : e.message} Inténtalo de nuevo${D.whatsapp ? ' o envíalo por WhatsApp' : ''}.`);
    } finally {
      clearTimeout(reloj);
      boton.disabled = !cesta.size;
      boton.textContent = 'Enviar pedido';
    }
  });

  // ---- «Descubrir»: los productos uno a uno a pantalla completa, deslizando con el dedo hacia arriba (el siguiente) y
  // hacia abajo (el anterior), como en TikTok. Son los que se ven en la lista en ese momento (la categoría y la
  // búsqueda), en su orden. Cada uno, con su foto grande sobre la misma foto desenfocada, su precio y el botón de
  // añadirlo, y a la derecha «Me gusta», «Compartir» y «Detalles» (la ficha); dos toques en la foto, me gusta. Se
  // pasa de una en una (pasarFeed): el carril sigue al dedo y al soltarlo va a la siguiente si se ha arrastrado un poco
  // o se ha lanzado rápido; si no, vuelve a la misma. Las fotos se piden según se acercan (la que se ve, la de antes y
  // las dos siguientes) ----
  const feed = $('feed'), feedVista = $('feedScroll'), carril = $('feedCarril');
  let feedLista = [], feedActual = -1, feedFoco = null, feedCierre = 0;

  function abrirFeed(ids, desde = 0) {
    if (!ids.length) return;
    clearTimeout(feedCierre);
    feedLista = ids;
    enFeed = [];
    carril.replaceChildren(...ids.map(diapositiva), finFeed());
    feedFoco = document.activeElement;
    feed.hidden = false;
    document.documentElement.classList.add('con-feed');
    feedActual = -1;
    pasarFeed(desde, false);
    ids.forEach((id) => pintarBoton(id));
    // Sube desde abajo (un fotograma después de verse, para que la transición arranque)
    requestAnimationFrame(() => requestAnimationFrame(() => feed.classList.add('abierto')));
    if (!(history.state && history.state.feed)) history.pushState({ feed: true }, '');
    $('feedCerrar').focus({ preventScroll: true });
    pista();
  }
  // Con ✕ o Esc se vuelve atrás en el historial (popstate la cierra): así el «atrás» del móvil también la cierra
  function cerrarFeed() {
    if (history.state && history.state.feed) history.back(); else cerrarFeedYa();
  }
  function cerrarFeedYa() {
    if (feed.hidden) return;
    feed.classList.remove('abierto');
    document.documentElement.classList.remove('con-feed');
    const fin = () => { feed.hidden = true; carril.replaceChildren(); enFeed = []; feedLista = []; };
    if (reducir) fin(); else feedCierre = setTimeout(fin, 450);
    if (feedFoco && feedFoco.isConnected) feedFoco.focus({ preventScroll: true });
  }
  window.addEventListener('popstate', () => { if (!feed.hidden && !(history.state && history.state.feed)) cerrarFeedYa(); });

  // La `k`-ésima, en su sitio del carril
  function diapositiva(id, k) {
    const p = porId.get(id);
    const s = el('section', 'slide');
    s.dataset.id = id;
    s.style.transform = `translateY(${k * 100}%)`;
    const fondo = el('div', 'slide-fondo');
    if (p.fondo) fondo.style.backgroundColor = p.fondo;
    const dentro = el('div', 'slide-foto-in');
    const caja = el('div', 'slide-foto', dentro);
    if (p.img) {
      const img = el('img');
      img.alt = p.nombre;
      img.width = p.ancho;
      img.height = p.alto;
      img.decoding = 'async';
      img.draggable = false;
      img.addEventListener('load', () => img.classList.add('lista'));
      dentro.append(img);
    } else {
      dentro.append(el('div', 'slide-sin', p.nombre));
    }
    // Lo que se ve abajo: categoría, nombre, descripción (toca para leerla entera), colores y comprar
    const etiquetas = el('div', 'slide-etiquetas', el('span', 'slide-etiqueta', p.categoria),
      p.destacado ? el('span', 'slide-etiqueta marca', '★ Destacado') : null,
      p.personalizar ? el('span', 'slide-etiqueta', '✎ Personalizable') : null);
    const desc = p.descripcion ? el('p', 'slide-desc', p.descripcion) : null;
    if (desc) desc.addEventListener('click', () => desc.classList.toggle('abierta'));
    const colores = p.colores.length > 1 ? el('div', 'slide-colores', ...p.colores.slice(0, 10).map(punto),
      el('span', 'que', `${p.colores.length > 10 ? `+${p.colores.length - 10} · ` : ''}${p.colores.length} colores`)) : null;
    const b = botonesCompra(p, hayQueElegir(p) ? 'Elegir y añadir' : 'Añadir al pedido');
    enFeed.push({ id, b });
    const info = el('div', 'slide-info', etiquetas, el('h2', '', p.nombre), desc, colores,
      el('div', 'slide-compra', el('span', 'slide-precio', precio(p.precio)), b.mas, b.paso));
    // A la derecha: me gusta, compartir por WhatsApp y la ficha entera
    const fav = botonFavorito(id, 'accion accion-fav', conIcono('span', 'circulo', 'corazon'), el('span', '', 'Me gusta'));
    const comp = el('a', 'accion', conIcono('span', 'circulo', 'wa'), el('span', '', 'Compartir'));
    comp.href = compartir(p).href;
    comp.target = '_blank';
    comp.rel = 'noopener';
    const det = el('button', 'accion', conIcono('span', 'circulo', 'info'), el('span', '', 'Detalles'));
    det.type = 'button';
    det.addEventListener('click', () => abrirFicha(id));
    const marco = el('div', 'slide-marco', caja, el('div', 'slide-velo-arriba'), el('div', 'slide-velo'), info,
      el('div', 'slide-acciones', fav, comp, det));
    // Dos toques en la foto: me gusta (como en TikTok, solo lo pone; quitarlo, con el botón) y un corazón que salta
    let ultimo = 0;
    marco.addEventListener('click', (ev) => {
      if (ev.target.closest('button, a, .slide-desc')) return;
      const ahora = Date.now();
      if (ahora - ultimo > 320) { ultimo = ahora; return; }
      ultimo = 0;
      alternarFavorito(id, true);
      if (reducir) return;
      const r = marco.getBoundingClientRect();
      const c = conIcono('span', 'corazon-grande', 'corazon');
      c.style.left = `${ev.clientX - r.left}px`;
      c.style.top = `${ev.clientY - r.top}px`;
      c.addEventListener('animationend', () => c.remove(), { once: true });
      marco.append(c);
    });
    s.append(fondo, marco);
    return s;
  }

  // La última: ya se ha visto todo; volver al principio o ir al pedido
  function finFeed() {
    const volver = el('button', 'boton', 'Volver al principio');
    volver.type = 'button';
    volver.addEventListener('click', () => pasarFeed(0, false));  // de golpe: deslizando pasarían todas por delante
    const pedido = el('button', 'boton sec', 'Ver mi pedido');
    pedido.type = 'button';
    pedido.addEventListener('click', abrirCestaDesdeFeed);
    const s = el('section', 'slide fin', el('div', 'fin-caja', el('div', 'icono', '✓'), el('h2', '', '¡Ya lo has visto todo!'),
      el('p', '', `${feedLista.length} ${feedLista.length === 1 ? 'producto' : 'productos'}. Si te gusta algo, añádelo y envíanos el pedido.`),
      volver, pedido));
    s.dataset.fin = '1';
    s.style.transform = `translateY(${feedLista.length * 100}%)`;  // detrás de la última
    return s;
  }

  // La foto de una diapositiva, cuando se acerca: la grande delante y la pequeña, desenfocada, detrás
  function cargar(s) {
    if (!s || s.dataset.cargada || s.dataset.fin) return;
    s.dataset.cargada = '1';
    const p = porId.get(s.dataset.id);
    if (!p.img) return;
    s.querySelector('.slide-fondo').style.backgroundImage = `url("img/${p.img}-480.webp")`;
    s.querySelector('.slide-foto img').src = `img/${p.img}-960.webp`;
  }

  // A la diapositiva `i` (la última es la del final): el carril se mueve a su sitio, deslizándose (o de golpe)
  function pasarFeed(i, animar = true) {
    const n = feedLista.length;
    if (!n) return;
    i = Math.max(0, Math.min(n, i));
    carril.classList.toggle('sin-transicion', !animar || reducir);
    carril.style.transform = `translateY(${-i * 100}%)`;
    actualizarFeed(i);
  }
  const irFeed = (d) => pasarFeed(feedActual + d);

  // Con el dedo: el carril lo sigue (en la primera y en la última, con resistencia) y al soltar se decide. Pasa a la
  // siguiente (o a la de antes) si se ha arrastrado más de un 15 % de la pantalla o se ha lanzado rápido; si no, vuelve.
  // Lo de lado no cuenta (p. ej. pasar los colores): solo se mueve si el gesto es sobre todo vertical
  let toque = null, sinClic = false;
  feedVista.addEventListener('touchstart', (ev) => {
    sinClic = false;
    if (ev.touches.length !== 1) { toque = null; return; }
    const t = ev.touches[0];
    toque = { x0: t.clientX, y0: t.clientY, dy: 0, vertical: null, puntos: [[performance.now(), t.clientY]] };
  }, { passive: true });
  feedVista.addEventListener('touchmove', (ev) => {
    if (!toque) return;
    const t = ev.touches[0];
    const dx = t.clientX - toque.x0, dy = t.clientY - toque.y0;
    if (toque.vertical === null && Math.abs(dx) + Math.abs(dy) > 8) toque.vertical = Math.abs(dy) >= Math.abs(dx);
    if (!toque.vertical) return;
    toque.dy = dy;
    toque.puntos.push([performance.now(), t.clientY]);
    if (toque.puntos.length > 6) toque.puntos.shift();  // los últimos ~100 ms: para la velocidad al soltar
    const enUnExtremo = (feedActual === 0 && dy > 0) || (feedActual >= feedLista.length && dy < 0);
    carril.classList.add('arrastrando');
    carril.style.transform = `translateY(calc(${-feedActual * 100}% + ${enUnExtremo ? dy * .3 : dy}px))`;
  }, { passive: true });
  const soltar = (cancelado) => {
    if (!toque) return;
    const { dy, vertical, puntos } = toque;
    toque = null;
    carril.classList.remove('arrastrando');
    if (!vertical) return;
    sinClic = Math.abs(dy) > 10;  // un arrastre no es un toque: que no pulse lo que haya debajo
    const [t1, y1] = puntos[0], [t2, y2] = puntos[puntos.length - 1];
    const v = (y2 - y1) / Math.max(1, t2 - t1);  // px/ms; hacia arriba, negativa
    const lejos = Math.abs(dy) > feedVista.clientHeight * .15;
    const lanzado = Math.abs(v) > .35 && Math.abs(dy) > 24 && Math.sign(v) === Math.sign(dy);
    pasarFeed(feedActual + (!cancelado && (lejos || lanzado) ? (dy < 0 ? 1 : -1) : 0));
  };
  feedVista.addEventListener('touchend', () => soltar(false));
  feedVista.addEventListener('touchcancel', () => soltar(true));
  feedVista.addEventListener('click', (ev) => {
    if (!sinClic) return;
    sinClic = false;
    ev.preventDefault();
    ev.stopPropagation();
  }, true);
  // Con la rueda del ratón (o el panel táctil del portátil): de una en una; la siguiente, después de una pausa (si no,
  // la inercia del panel pasaría varias)
  let rueda = 0, ruedaQuieta = 0, ruedaParada = false;
  feedVista.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    clearTimeout(ruedaQuieta);
    ruedaQuieta = setTimeout(() => { ruedaParada = false; rueda = 0; }, 180);
    if (ruedaParada) return;
    rueda += ev.deltaY;
    if (Math.abs(rueda) < 40) return;
    irFeed(Math.sign(rueda));
    ruedaParada = true;
    rueda = 0;
  }, { passive: false });

  // Cuál se está viendo: se marca (lo suyo entra con su animación), se cargan sus fotos y las de al lado y arriba se
  // pone dónde se está
  function actualizarFeed(i) {
    const n = feedLista.length;
    if (!n || i === feedActual) return;
    const slides = carril.children;
    if (slides[feedActual]) slides[feedActual].classList.remove('activa');
    feedActual = i;
    slides[i].classList.add('activa');
    for (let k = i - 1; k <= i + 2; k++) cargar(slides[k]);
    const p = porId.get(feedLista[i]);
    $('feedTitulo').textContent = p ? p.categoria : 'Fin';
    $('feedPos').textContent = `${Math.min(i + 1, n)} de ${n}`;
    $('feedProgreso').style.width = `${(Math.min(i + 1, n) / n) * 100}%`;
    $('feedAnterior').disabled = i === 0;
    $('feedSiguiente').disabled = i >= n;
    if (i > 0) quitarPista();
  }
  // Con teclado: flechas (o j / k) para pasar y Esc para salir
  document.addEventListener('keydown', (ev) => {
    if (feed.hidden || document.querySelector('dialog[open]')) return;
    if (ev.key === 'Escape') { ev.preventDefault(); cerrarFeed(); }
    else if (['ArrowDown', 'PageDown', 'j'].includes(ev.key)) { ev.preventDefault(); irFeed(1); }
    else if (['ArrowUp', 'PageUp', 'k'].includes(ev.key)) { ev.preventDefault(); irFeed(-1); }
  });
  $('feedCerrar').addEventListener('click', cerrarFeed);
  $('feedAnterior').addEventListener('click', () => irFeed(-1));
  $('feedSiguiente').addEventListener('click', () => irFeed(1));
  function abrirCestaDesdeFeed() {
    pintarLineas();
    mostrarFormulario(true);
    abrirDialogo($('dlgCesta'));
  }
  $('feedCesta').addEventListener('click', abrirCestaDesdeFeed);

  // La primera vez, cómo se pasa: «Desliza hacia arriba» con una flecha que sube (se va al deslizar o a los 5 s)
  const PISTA = 'catalogo-pista-descubrir';
  function pista() {
    let vista = false;
    try { vista = localStorage.getItem(PISTA) === '1'; } catch (e) { /* nada */ }
    $('feedPista').classList.toggle('oculto', vista);
    $('feedPista').classList.remove('fuera');
    if (!vista) setTimeout(quitarPista, 5000);
  }
  function quitarPista() {
    const p = $('feedPista');
    if (p.classList.contains('oculto') || p.classList.contains('fuera')) return;
    p.classList.add('fuera');
    try { localStorage.setItem(PISTA, '1'); } catch (e) { /* nada */ }
    setTimeout(() => p.classList.add('oculto'), 450);
  }

  $('ctaFeed').addEventListener('click', () => abrirFeed(visibles()));
  $('botonFeed').addEventListener('click', () => abrirFeed(visibles()));

  // ---- Volver arriba: aparece al bajar mucho por la lista ----
  let arribaPendiente = false;
  window.addEventListener('scroll', () => {
    if (arribaPendiente) return;
    arribaPendiente = true;
    requestAnimationFrame(() => {
      arribaPendiente = false;
      $('arriba').classList.toggle('ver', scrollY > 1400);
    });
  }, { passive: true });
  $('arriba').addEventListener('click', () => window.scrollTo({ top: 0, behavior: reducir ? 'auto' : 'smooth' }));

  // ---- Aviso breve ----
  let reloj = null;
  function aviso(texto) {
    $('aviso').textContent = texto;
    $('aviso').classList.add('ver');
    clearTimeout(reloj);
    reloj = setTimeout(() => $('aviso').classList.remove('ver'), 1800);
  }

  // ---- Portada y pie ----
  function pintarPie() {
    const pie = [];
    if (D.contactos.length) {
      pie.push(el('p', 'bloque-tit', '¿Dudas? Escríbenos'));
      pie.push(el('div', 'contactos', ...D.contactos.map((c) => {
        const a = el('a', 'contacto');
        a.insertAdjacentHTML('afterbegin', ICONOS.wa);
        a.append(el('div', '', el('strong', '', c.nombre), el('span', '', [c.motivo, c.bonito].filter(Boolean).join(' · '))));
        a.href = `https://wa.me/${c.telefono}?text=${encodeURIComponent('Hola, he visto vuestro catálogo. ')}`;
        a.target = '_blank';
        a.rel = 'noopener';
        return a;
      })));
    }
    pie.push(el('p', 'legal', `${D.contacto ? `${D.contacto} · ` : ''}Catálogo actualizado el ${D.fecha}. `
      + 'Algunos diseños son de autores de la comunidad Printables y se citan en su ficha.'));
    $('pie').replaceChildren(...pie);
  }

  $('titulo').textContent = D.titulo;
  $('subtitulo').textContent = D.subtitulo;
  $('meta').textContent = `${D.productos.length} productos · Elige, añade a tu pedido y envíanoslo`;
  // El código también se busca, con y sin el guion («P-037» y «p037»)
  D.productos.forEach((p) => {
    p.buscar = normalizar(`${p.nombre} ${p.categoria} ${p.descripcion} ${p.ref} ${p.ref.replace('-', '')}`);
  });
  pintarChips();
  pintarProductos();
  pintarPie();
  pintarCesta();
  $('buscar').addEventListener('input', filtrar);
  window.addEventListener('hashchange', abrirDelEnlace);
  abrirDelEnlace();
})();
</script>
</body>
