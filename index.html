<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="description" content="Impresión 3D personalizada. 314 productos. Elige y haz tu pedido.">
<!-- Solo la ve quien tiene el enlace: que los buscadores no la indexen -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c111d">
<!-- Ya trae su tema: que el «modo oscuro» de algunos navegadores del móvil no le cambie los colores -->
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo">
<meta property="og:description" content="Impresión 3D personalizada. 314 productos. Elige y haz tu pedido.">
<meta property="og:image" content="https://jcarmonamarin-glitch.github.io/NegoQR_Catalogo/portada.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jcarmonamarin-glitch.github.io/NegoQR_Catalogo/">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%278%27%20fill%3D%27%232850E0%27/%3E%3Cpath%20d%3D%27M9%2021l7-11%207%2011z%27%20fill%3D%27%23fff%27/%3E%3C/svg%3E">
<style>
:root{
  --marca: #2850E0;
  --marca-texto: #9eb0f1;  /* calculado en web.py: color-mix() no lo entienden los móviles antiguos */
  --fondo: #0c111d; --panel: #151c2b; --panel-2: #1c2538; --linea: rgba(255, 255, 255, .08);
  --texto: #eef2f8; --tenue: #a3adbf; --suave: #6f7a8f; --ok: #22c55e; --error: #f87171;
  --sombra: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
[data-tema="claro"]{
  --marca-texto: #2244be;
  --fondo: #f3f5f9; --panel: #fff; --panel-2: #eef1f6; --linea: rgba(15, 23, 42, .1);
  --texto: #131926; --tenue: #556072; --suave: #8892a5; --ok: #16a34a; --error: #dc2626;
  --sombra: 0 10px 30px rgba(15, 23, 42, .18);
  color-scheme: light;
}
*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{ margin: 0; background: var(--fondo); color: var(--texto); line-height: 1.45;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, textarea{ font: inherit; color: inherit; }
button{ cursor: pointer; -webkit-tap-highlight-color: transparent; }
img{ display: block; }
.oculto{ display: none !important; }

/* Portada */
.portada{ padding: 28px 16px 14px; max-width: 1180px; margin: 0 auto; }
.portada .raya{ width: 44px; height: 5px; border-radius: 3px; background: var(--marca); margin-bottom: 14px; }
.portada h1{ margin: 0; font-size: clamp(30px, 8vw, 46px); line-height: 1.02; font-weight: 850; letter-spacing: -.02em; }
.portada .sub{ margin: 8px 0 0; color: var(--marca-texto); font-size: 17px; font-weight: 600; }
.portada .meta{ margin: 10px 0 0; color: var(--tenue); font-size: 13.5px; }

/* Buscador y categorías, fijos arriba */
.barra{ position: sticky; top: 0; z-index: 5; background: var(--fondo); border-bottom: 1px solid var(--linea); }
.barra-in{ max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; }
.buscar{ position: relative; }
.buscar svg{ position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--suave); }
.buscar input{ width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: 12px; border: 1px solid var(--linea);
  background: var(--panel); outline: none; font-size: 16px; }
.buscar input:focus{ border-color: var(--marca); }
.chips{ display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar{ display: none; }
.chip{ flex: none; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--linea); background: var(--panel);
  color: var(--tenue); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip.activo{ background: var(--marca); border-color: var(--marca); color: #fff; }

/* Productos */
main{ max-width: 1180px; margin: 0 auto; padding: 4px 16px 120px; }
.seccion h2{ margin: 22px 0 12px; font-size: 20px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
.seccion h2 small{ font-size: 13px; font-weight: 600; color: var(--suave); }
.rejilla{ display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
@media (min-width: 700px){ .rejilla{ grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; } }
.tarjeta{ position: relative; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--linea);
  border-radius: 14px; overflow: hidden; }
.tarjeta .abrir{ display: block; padding: 0; border: 0; background: none; text-align: left; flex: 1; }
.foto{ position: relative; aspect-ratio: 4 / 3; background: var(--panel-2); overflow: hidden; }
.foto img{ width: 100%; height: 100%; object-fit: cover; }
.foto.entera img{ object-fit: contain; }
.foto .sin{ position: absolute; inset: 0; display: grid; place-items: center; color: var(--suave); font-size: 13px; }
.tarjeta .cuerpo{ padding: 10px 12px 12px; }
.tarjeta h3{ margin: 0; font-size: 14.5px; line-height: 1.3; font-weight: 700;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tarjeta .pie{ display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 0 10px 10px 12px; }
.precio{ font-size: 17px; font-weight: 800; color: var(--marca-texto); white-space: nowrap; }
.mas{ flex: none; min-width: 38px; height: 38px; padding: 0 10px; border-radius: 19px; border: 0; background: var(--marca); color: #fff;
  font-size: 22px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
/* Ya en el pedido: el «+» se abre en − N + (si no cabe junto al precio, baja a otra línea a todo el ancho) */
.tarjeta .paso{ flex: 1 0 auto; justify-content: space-between; border: 0; border-radius: 19px; background: var(--marca); color: #fff; }
.tarjeta .paso button{ width: 34px; height: 38px; font-size: 21px; line-height: 1; }
.tarjeta .paso span{ min-width: 16px; font-size: 15px; }
.vacio{ padding: 40px 0; text-align: center; color: var(--tenue); }

/* Barra de la cesta */
.cesta-barra{ position: fixed; z-index: 6; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px;
  border: 0; border-radius: 16px; background: var(--marca); color: #fff; box-shadow: var(--sombra); font-weight: 700; font-size: 15.5px; }
.cesta-barra .cuantos{ min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: rgba(255, 255, 255, .22);
  display: grid; place-items: center; font-size: 14px; }
.cesta-barra .total{ margin-left: auto; }

/* Ventanas (ficha del producto y cesta): hoja que sube desde abajo en el móvil */
dialog{ width: 100%; max-width: 560px; max-height: 92vh; margin: auto auto 0; padding: 0; border: 0; border-radius: 20px 20px 0 0;
  background: var(--panel); color: var(--texto); box-shadow: var(--sombra); overflow: hidden; }
@media (min-width: 700px){ dialog{ margin: auto; border-radius: 20px; max-height: 88vh; } }
dialog::backdrop{ background: rgba(4, 7, 14, .62); }
.dlg{ display: flex; flex-direction: column; max-height: inherit; }
.dlg-cab{ display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--linea); }
.dlg-cab h2{ margin: 0; font-size: 18px; font-weight: 800; flex: 1; }
.cerrar{ flex: none; width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--panel-2); font-size: 20px; line-height: 1; }
.dlg-cuerpo{ overflow-y: auto; overscroll-behavior: contain; }
.dlg-pie{ padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linea); background: var(--panel); }

.ficha .foto{ aspect-ratio: 4 / 3; }
.ficha .foto .cerrar{ position: absolute; top: 12px; right: 12px; background: rgba(8, 12, 22, .6); color: #fff; }
.ficha .texto{ padding: 16px; }
.ficha h2{ margin: 0; font-size: 21px; line-height: 1.2; font-weight: 800; }
.ficha .precio{ display: block; margin-top: 6px; font-size: 24px; }
.ficha .desc{ margin: 12px 0 0; color: var(--tenue); white-space: pre-line; }
.datos{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.dato{ display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--panel-2);
  font-size: 13px; font-weight: 600; }
.dato svg{ width: 15px; height: 15px; color: var(--marca-texto); }
/* Lo que elige el cliente: el color de cada parte (los rollos del taller) y el texto si es personalizado */
.elegir{ margin-top: 16px; border-radius: 12px; }
.elegir h3, .elegir label, .bloque-tit{ display: block; margin: 0 0 8px; font-size: 12.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--suave); }
.opciones-color{ display: flex; flex-wrap: wrap; gap: 8px; }
.opcion-color{ display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 5px 13px 5px 6px; border-radius: 999px;
  border: 1px solid var(--linea); background: var(--panel-2); font-size: 14px; font-weight: 600; }
.opcion-color.sel{ border-color: var(--marca); outline: 2px solid var(--marca); outline-offset: -1px; }
.punto{ width: 26px; height: 26px; border-radius: 50%; background: var(--c, #999); border: 1px solid rgba(127, 127, 127, .55); flex: none; }
.personalizar textarea{ width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel-2);
  outline: none; font-size: 16px; resize: vertical; }
.personalizar textarea:focus{ border-color: var(--marca); }
@keyframes marcar{ 0%, 60%{ box-shadow: 0 0 0 3px var(--error); } 100%{ box-shadow: 0 0 0 3px transparent; } }
.elegir.marcar{ animation: marcar 1.6s ease-out; }
@media (prefers-reduced-motion: reduce){ .elegir.marcar{ animation: none; outline: 2px solid var(--error); } }
.falta{ margin: 0 0 8px; color: var(--error); font-size: 14px; font-weight: 650; text-align: center; }
.en-pedido{ margin: 2px 0; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--linea); background: var(--panel-2);
  color: var(--texto); font-size: 12.5px; font-weight: 600; }
.credito{ margin: 16px 0 0; font-size: 12px; color: var(--suave); }
.compartir{ display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--linea); background: var(--panel-2); color: var(--texto); font-size: 14px; font-weight: 650; text-decoration: none; }
.compartir svg{ width: 18px; height: 18px; color: #25d366; }
.comprar{ display: flex; gap: 10px; align-items: stretch; }
.paso{ display: flex; align-items: center; border: 1px solid var(--linea); border-radius: 14px; background: var(--panel-2); }
.paso button{ width: 44px; height: 50px; border: 0; background: none; font-size: 22px; }
.paso button:disabled{ opacity: .35; }
.paso span{ min-width: 26px; text-align: center; font-weight: 800; font-size: 17px; }
.boton{ flex: 1; height: 52px; border: 0; border-radius: 14px; background: var(--marca); color: #fff; font-weight: 750; font-size: 16px; }
.boton:disabled{ opacity: .6; cursor: progress; }
.dlg-pie > .boton{ display: block; width: 100%; }
.boton.quitar{ background: transparent; color: var(--error); border: 1.5px solid var(--error); }
.boton.wa{ background: transparent; color: var(--texto); border: 1px solid var(--linea); height: 46px; font-size: 14.5px; font-weight: 650;
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.boton.wa svg{ width: 18px; height: 18px; color: #25d366; }
.boton.wa.boton-principal{ height: 52px; border: 0; background: #1fa855; color: #fff; font-size: 16px; font-weight: 750; }
.boton.wa.boton-principal svg{ color: #fff; }
.boton + .boton{ margin-top: 10px; }
.nota-cesta{ margin: 8px 0 0; font-size: 13px; color: var(--tenue); text-align: center; }

/* Cesta */
.lineas{ list-style: none; margin: 0; padding: 4px 16px; }
.linea{ display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.linea .mini{ width: 56px; height: 42px; border-radius: 8px; background: var(--panel-2) center / cover no-repeat; }
.linea .nom{ font-weight: 650; font-size: 14px; line-height: 1.3; }
.linea .uni{ font-size: 12.5px; color: var(--tenue); }
.linea .opciones{ display: block; margin: 2px 0; padding: 0; border: 0; background: none; color: var(--marca-texto); font-size: 12.5px;
  font-weight: 650; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.linea .opciones.falta{ color: var(--error); }
.linea .der{ display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.linea .sub{ font-weight: 750; white-space: nowrap; }
.linea .paso{ border-radius: 10px; }
.linea .paso button{ width: 32px; height: 32px; font-size: 18px; }
.linea .paso span{ min-width: 20px; font-size: 14px; }
.total-cesta{ display: flex; justify-content: space-between; padding: 14px 16px 4px; font-size: 17px; font-weight: 800; }
.total-cesta small{ display: block; font-size: 12px; font-weight: 500; color: var(--suave); }
form.datos-cliente{ padding: 8px 16px 6px; }
.campos{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campo{ display: flex; flex-direction: column; gap: 5px; }
.campo.ancho{ grid-column: 1 / -1; }
.campo label{ font-size: 13px; font-weight: 650; color: var(--tenue); }
.campo input, .campo textarea{ width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel-2);
  outline: none; font-size: 16px; }
.campo textarea{ min-height: 84px; resize: vertical; }
.campo input:focus, .campo textarea:focus{ border-color: var(--marca); }
.campo input[aria-invalid="true"]{ border-color: var(--error); }
.trampa{ position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.acepto{ display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 0; font-size: 13px; color: var(--tenue); }
.acepto input{ width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--marca); }
.error{ margin: 10px 0 0; color: var(--error); font-size: 14px; font-weight: 600; }
.hecho{ padding: 34px 20px 26px; text-align: center; }
.hecho .ok{ width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 34px; }
.hecho h2{ margin: 0; font-size: 22px; }
.hecho p{ margin: 10px 0 0; color: var(--tenue); }

/* Pie */
footer{ max-width: 1180px; margin: 0 auto; padding: 8px 16px 140px; color: var(--tenue); font-size: 13.5px; }
.contactos{ display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.contacto{ display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--linea);
  color: var(--texto); text-decoration: none; }
.contacto svg{ width: 26px; height: 26px; color: #25d366; flex: none; }
.contacto strong{ display: block; }
.contacto span{ font-size: 12.5px; color: var(--tenue); }
footer .legal{ margin-top: 18px; font-size: 12px; color: var(--suave); }

.aviso{ position: fixed; z-index: 20; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
  padding: 10px 16px; border-radius: 12px; background: var(--texto); color: var(--fondo); font-weight: 650; font-size: 14px;
  transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); }
.aviso.ver{ opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce){ .aviso{ transition: none; } }
</style>
</head>
<body>
<header class="portada">
  <div class="raya"></div>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
  <p class="meta" id="meta"></p>
</header>

<div class="barra">
  <div class="barra-in">
    <label class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="buscar" placeholder="Buscar productos…" autocomplete="off" aria-label="Buscar productos">
    </label>
    <nav class="chips" id="chips" aria-label="Categorías"></nav>
  </div>
</div>

<main id="productos"></main>

<footer id="pie"></footer>

<button type="button" class="cesta-barra oculto" id="cestaBarra">
  <span class="cuantos" id="cestaCuantos">0</span><span>Ver pedido</span><span class="total" id="cestaTotal"></span>
</button>

<dialog id="dlgFicha" aria-label="Producto"><div class="dlg ficha" id="ficha"></div></dialog>

<dialog id="dlgCesta" aria-labelledby="cestaTitulo">
  <div class="dlg">
    <div class="dlg-cab"><h2 id="cestaTitulo">Tu pedido</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo" id="cestaCuerpo">
      <ul class="lineas" id="lineas"></ul>
      <div class="total-cesta"><span>Total<small>Te confirmamos el pedido antes de hacerlo</small></span><span id="totalCesta"></span></div>
      <form class="datos-cliente" id="formPedido" novalidate>
        <p class="bloque-tit" style="margin-top:10px">Tus datos</p>
        <div class="campos">
          <div class="campo"><label for="fNombre">Nombre</label><input id="fNombre" name="nombre" autocomplete="given-name" maxlength="60" required></div>
          <div class="campo"><label for="fApellidos">Apellidos</label><input id="fApellidos" name="apellidos" autocomplete="family-name" maxlength="80" required></div>
          <div class="campo ancho"><label for="fTelefono">Teléfono</label><input id="fTelefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="600 000 000" required></div>
          <div class="campo ancho"><label for="fComentario">Comentario <span style="font-weight:400">(opcional)</span></label>
            <textarea id="fComentario" name="comentario" maxlength="1000" placeholder="Para cuándo lo necesitas o cualquier detalle…"></textarea></div>
        </div>
        <div class="trampa" aria-hidden="true"><label>No rellenar <input id="fWeb" name="web" tabindex="-1" autocomplete="off"></label></div>
        <label class="acepto"><input type="checkbox" id="fAcepto" required>
          <span>Acepto que uséis mi nombre y teléfono solo para gestionar este pedido. No se ceden a nadie.</span></label>
        <p class="error oculto" id="errorPedido" role="alert"></p>
      </form>
    </div>
    <div class="dlg-pie" id="cestaPie">
      <button type="submit" form="formPedido" class="boton" id="enviar">Enviar pedido</button>
      <a class="boton wa oculto" id="porWhatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
        <span id="porWhatsappTexto">¿Prefieres WhatsApp? Envíalo por ahí</span></a>
    </div>
  </div>

<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('datos').textContent);
  const $ = (id) => document.getElementById(id);
  const euros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  const precio = (n) => euros.format(n);
  const quitarTildes = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  const normalizar = (t) => quitarTildes(String(t || '').toLowerCase());
  // Los colores de cada producto: null = todos los rollos del taller; si no, sus posiciones en D.filamentos
  D.productos.forEach((p) => { p.colores = p.colores ? p.colores.map((i) => D.filamentos[i]) : D.filamentos; });
  const porId = new Map(D.productos.map((p) => [p.id, p]));
  const URL_WEB = 'https://jcarmonamarin-glitch.github.io/NegoQR_Catalogo/';  // la publicada, también en la vista previa local: es la que se comparte

  function el(tag, clase, ...hijos) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    for (const h of hijos) if (h !== null && h !== undefined && h !== false) e.append(h);
    return e;
  }
  const ICONOS = {
    medidas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>',
    filamento: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>',
    reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    wa: document.querySelector('#porWhatsapp svg').outerHTML,
  };
  // Los iconos son constantes de esta página (nunca texto de los productos): por eso van por innerHTML
  function dato(icono, texto) {
    const d = el('span', 'dato');
    d.insertAdjacentHTML('afterbegin', ICONOS[icono]);
    d.append(texto);
    return d;
  }

  // ---- Colores: los rollos del taller con su color (web.py los manda ya como {n: nombre, c: #rrggbb}) ----
  function punto(color) {
    const p = el('span', 'punto');
    p.style.setProperty('--c', color.c);
    return p;
  }

  // ---- Lo que elige el cliente de cada producto: un color por parte (o uno solo) y, si es personalizado, un texto ----
  const partesDe = (p) => (p.colores.length ? (p.piezas.length ? p.piezas : ['Color']) : []);
  // Con un solo color posible no hay nada que elegir
  const eleccionInicial = (p) => partesDe(p).map(() => (p.colores.length === 1 ? p.colores[0].n : ''));
  // Hay que abrir la ficha para añadirlo (elegir color o escribir el texto)
  const hayQueElegir = (p) => p.colores.length > 1 || !!p.personalizar;
  const falta = (p, l) => {
    const partes = partesDe(p);
    const sin = partes.filter((_, i) => !l.colores[i]);
    if (sin.length) return partes.length > 1 ? `Elige el color de: ${sin.join(', ')}` : 'Elige el color';
    if (p.personalizar && !l.texto.trim()) return `Escribe: ${p.personalizar}`;
    return '';
  };
  // «Chapa: Negro · Borde y letras: Amarillo · Nombre y teléfono: «Milo 600…»» (va así al pedido y a WhatsApp)
  function detalleLinea(p, l) {
    const partes = partesDe(p);
    const colores = partes.map((parte, i) => (!l.colores[i] ? '' : partes.length > 1 ? `${parte}: ${l.colores[i]}` : l.colores[i]));
    return [...colores, l.texto ? `${p.personalizar}: «${l.texto}»` : ''].filter(Boolean).join(' · ');
  }

  // ---- Cesta (se recuerda en este navegador): una línea por producto + lo que se eligió ----
  const GUARDADO = 'catalogo-cesta-v2';
  const cesta = new Map();  // clave → {id, n, colores: [nombre por parte], texto}
  const claveLinea = (id, colores, texto) => JSON.stringify([id, colores, texto]);
  function meter(l) {
    const p = porId.get(l.id);
    if (!p || !(l.n > 0)) return;
    const colores = partesDe(p).map((_, i) => {
      const c = (l.colores || [])[i] || '';
      return p.colores.some((x) => x.n === c) ? c : '';  // un color que ya no hay: queda por elegir
    });
    const texto = String(l.texto || '').slice(0, 600);
    cesta.set(claveLinea(l.id, colores, texto), { id: l.id, n: Math.min(99, Math.round(l.n)), colores, texto });
  }
  try {
    JSON.parse(localStorage.getItem(GUARDADO) || '[]').forEach(meter);
    // La cesta de antes (hasta el 20/10/2026: [[id, n]], sin colores)
    JSON.parse(localStorage.getItem('catalogo-cesta-v1') || '[]').forEach(([id, n]) => meter({ id, n, colores: [], texto: '' }));
    localStorage.removeItem('catalogo-cesta-v1');
  } catch (e) { /* sin almacenamiento: la cesta dura lo que la visita */ }
  const guardarCesta = () => { try { localStorage.setItem(GUARDADO, JSON.stringify([...cesta.values()])); } catch (e) { /* nada */ } };
  const lineasDe = (id) => [...cesta.values()].filter((l) => l.id === id);
  const unidades = () => [...cesta.values()].reduce((a, l) => a + l.n, 0);
  const unidadesDe = (id) => lineasDe(id).reduce((a, l) => a + l.n, 0);
  const totalCesta = () => [...cesta.values()].reduce((t, l) => t + porId.get(l.id).precio * l.n, 0);

  // Pone `n` unidades de esa línea (0 la quita); si ya había otra igual, es la misma
  function poner(l, n) {
    const clave = claveLinea(l.id, l.colores, l.texto);
    if (n > 0) cesta.set(clave, { id: l.id, colores: [...l.colores], texto: l.texto, n: Math.min(99, n) });
    else cesta.delete(clave);
    guardarCesta();
    pintarCesta();
  }

  function foto(p, lado) {
    const f = el('div', `foto${p.entera ? ' entera' : ''}`);
    if (!p.img) { f.append(el('span', 'sin', 'Sin foto')); return f; }
    const img = el('img');
    img.src = `img/${p.img}-${lado}.webp`;
    img.alt = p.nombre;
    img.width = lado === 960 ? p.ancho : Math.round(p.ancho / 2);
    img.height = lado === 960 ? p.alto : Math.round(p.alto / 2);
    if (lado !== 960) { img.loading = 'lazy'; img.decoding = 'async'; }
    if (p.pos) img.style.objectPosition = p.pos;
    f.append(img);
    return f;
  }

  // ---- Lista de productos por categoría (y arriba, los destacados) ----
  let categoria = '';
  const DESTACADOS = '★';  // data-categoria de la sección de destacados
  const tarjetas = new Map();  // id → [botones de cada tarjeta suya: {mas, paso (− N +), cuenta, menos, masP}]

  function tarjeta(p) {
    const abrir = el('button', 'abrir', foto(p, 480), el('div', 'cuerpo', el('h3', '', p.nombre)));
    abrir.type = 'button';
    abrir.addEventListener('click', () => abrirFicha(p.id));
    const mas = el('button', 'mas', '+');
    const menosP = el('button', '', '−');
    const masP = el('button', '', '+');
    const cuenta = el('span');
    const paso = el('div', 'paso', menosP, cuenta, masP);
    paso.setAttribute('role', 'group');
    [mas, menosP, masP].forEach((b) => { b.type = 'button'; });
    mas.setAttribute('aria-label', hayQueElegir(p) ? `Elegir y añadir ${p.nombre}` : `Añadir ${p.nombre} al pedido`);
    masP.setAttribute('aria-label', 'Una más');
    // El «+» de la tarjeta suma o resta en la última línea de este producto (el mismo color); la primera vez, si hay
    // que elegir color o escribir algo, abre la ficha
    const sumar = (d) => {
      const l = lineasDe(p.id).pop();
      if (!l) {
        if (hayQueElegir(p)) { abrirFicha(p.id); return; }
        poner({ id: p.id, colores: eleccionInicial(p), texto: '' }, 1);
        aviso(`Añadido: ${p.nombre}`);
        return;
      }
      const n = Math.min(99, l.n + d);
      poner(l, n);
      const que = detalleLinea(p, l);
      if (d > 0) aviso(`Añadido: ${p.nombre}${que ? ` (${que})` : ''}`);
      else if (!n) aviso(`Quitado: ${p.nombre}${que ? ` (${que})` : ''}`);
      else $('aviso').classList.remove('ver');  // que no siga el «Añadido» del «+» de antes
    };
    mas.addEventListener('click', () => sumar(1));
    masP.addEventListener('click', () => sumar(1));
    menosP.addEventListener('click', () => sumar(-1));
    const t = el('article', 'tarjeta', abrir, el('div', 'pie', el('span', 'precio', precio(p.precio)), mas, paso));
    t.dataset.id = p.id;
    tarjetas.set(p.id, [...(tarjetas.get(p.id) || []), { mas, paso, cuenta, menos: menosP, masP }]);
    pintarBoton(p.id);
    return t;
  }
  function pintarBoton(id) {
    const n = unidadesDe(id);
    const foco = document.activeElement;
    (tarjetas.get(id) || []).forEach((t) => {
      t.mas.classList.toggle('oculto', n > 0);
      t.paso.classList.toggle('oculto', !n);
      t.cuenta.textContent = String(n);
      t.masP.disabled = n >= 99;
      t.paso.setAttribute('aria-label', `${n} en el pedido`);
      t.menos.setAttribute('aria-label', n > 1 ? 'Una menos' : 'Quitar del pedido');
      // Con teclado, que el foco no se pierda al cambiar de «+» a «− N +» y al revés
      if (n && foco === t.mas) t.masP.focus();
      else if (!n && t.paso.contains(foco)) t.mas.focus();
    });
  }

  function pintarProductos() {
    const seccion = (titulo, c, lista) => {
      const s = el('section', 'seccion', el('h2', '', titulo, el('small', '', String(lista.length))),
        el('div', 'rejilla', ...lista.map(tarjeta)));
      s.dataset.categoria = c;
      return s;
    };
    const destacados = D.productos.filter((p) => p.destacado);
    const secciones = D.categorias.map((c) => seccion(c, c, D.productos.filter((p) => p.categoria === c)));
    if (destacados.length) secciones.unshift(seccion('Destacados', DESTACADOS, destacados));
    const nada = el('p', 'vacio oculto', 'No hay productos que coincidan.');
    nada.id = 'sinResultados';
    $('productos').replaceChildren(...secciones, nada);
  }

  function filtrar() {
    const busca = normalizar($('buscar').value.trim());
    let algo = false;
    document.querySelectorAll('.seccion').forEach((s) => {
      let visibles = 0;
      // Los destacados, solo en «Todo» y sin buscar (si no, saldrían dos veces)
      const destacados = s.dataset.categoria === DESTACADOS;
      if (destacados ? !categoria && !busca : !categoria || s.dataset.categoria === categoria) {
        s.querySelectorAll('.tarjeta').forEach((t) => {
          const ver = !busca || porId.get(t.dataset.id).buscar.includes(busca);
          t.classList.toggle('oculto', !ver);
          if (ver) visibles++;
        });
      }
      s.classList.toggle('oculto', !visibles);
      if (visibles) algo = true;
    });
    $('sinResultados').classList.toggle('oculto', algo);
  }

  function pintarChips() {
    const chip = (texto, valor) => {
      const b = el('button', `chip${valor === categoria ? ' activo' : ''}`, texto);
      b.type = 'button';
      b.addEventListener('click', () => {
        categoria = valor;
        document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('activo', x === b));
        filtrar();
        window.scrollTo({ top: document.querySelector('.barra').offsetTop, behavior: 'smooth' });
      });
      return b;
    };
    $('chips').replaceChildren(chip('Todo', ''), ...D.categorias.map((c) => chip(c, c)));
  }

  // ---- Ventanas: el botón «atrás» del móvil las cierra en lugar de salir de la página ----
  function abrirDialogo(d) {
    const otra = [...document.querySelectorAll('dialog[open]')].some((x) => x !== d);
    document.querySelectorAll('dialog[open]').forEach((x) => { if (x !== d) x.close(); });
    if (d.open) return;
    d.showModal();
    // De una ventana a otra (de la cesta a la ficha y vuelta): la misma entrada del historial
    if (otra && history.state && history.state.dialogo) history.replaceState({ dialogo: d.id }, '');
    else history.pushState({ dialogo: d.id }, '');
  }
  function cerrarDialogo(d) {
    if (!d.open) return;
    if (history.state && history.state.dialogo === d.id) history.back(); else d.close();
  }
  window.addEventListener('popstate', () => document.querySelectorAll('dialog[open]').forEach((d) => d.close()));
  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('cancel', (ev) => { ev.preventDefault(); cerrarDialogo(d); });
    d.addEventListener('click', (ev) => { if (ev.target === d || ev.target.closest('[data-cerrar]')) cerrarDialogo(d); });
  });

  // ---- Compartir un producto ----
  // El enlace es su página (p/<id>.html, la genera web.py al publicar): la vista previa de WhatsApp enseña su foto,
  // nombre y precio, y al abrirla lleva aquí con la ficha abierta (#p=<id>). Sin número: WhatsApp pregunta a quién.
  function compartir(p) {
    const a = el('a', 'compartir');
    a.insertAdjacentHTML('afterbegin', ICONOS.wa);
    a.append('Compartir por WhatsApp');
    const enlace = `${URL_WEB}p/${p.id}.html`;
    a.href = `https://wa.me/?text=${encodeURIComponent(`Mira esto: ${p.nombre} (${precio(p.precio)})\n${enlace}`)}`;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }
  function abrirDelEnlace() {
    const m = /^#p=([a-z0-9]+)$/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);  // que «atrás» no la vuelva a abrir
    if (porId.has(m[1])) abrirFicha(m[1]);
  }

  // ---- Ficha de un producto ----
  // Se elige el color (uno por parte) y, si es personalizado, se escribe el texto. Si esa misma combinación ya está
  // en el pedido, el − / + es lo que hay en él y baja hasta 0 (quitarla); si no, cuántas añadir.
  // `editar`: una línea de la cesta que se quiere cambiar (color, texto o cantidad): al guardar, se sustituye.
  function abrirFicha(id, editar = null) {
    const p = porId.get(id);
    const partes = partesDe(p);
    const base = editar || lineasDe(id).pop() || null;
    const sel = { id, colores: base ? [...base.colores] : eleccionInicial(p), texto: base ? base.texto : '' };
    const enPedido = (s) => cesta.get(claveLinea(id, s.colores, s.texto.trim()));
    let ya = 0;
    let cuantos = 1;
    const reiniciar = () => {  // al cambiar lo elegido: el − / + empieza en lo que haya de eso en el pedido
      ya = editar ? editar.n : (enPedido(sel) || {}).n || 0;
      cuantos = ya || 1;
    };
    reiniciar();

    const f = foto(p, 960);
    const cerrar = el('button', 'cerrar', '×');
    cerrar.type = 'button';
    cerrar.dataset.cerrar = '';
    cerrar.setAttribute('aria-label', 'Cerrar');
    f.append(cerrar);
    const texto = el('div', 'texto', el('h2', '', p.nombre), el('span', 'precio', precio(p.precio)), compartir(p));
    if (p.descripcion) texto.append(el('p', 'desc', p.descripcion));
    const datos = [p.medidas && dato('medidas', p.medidas), p.filamento && dato('filamento', p.filamento),
      p.tiempo && dato('reloj', `${p.tiempo} de impresión`)].filter(Boolean);
    if (datos.length) texto.append(el('div', 'datos', ...datos));

    // Colores: un grupo de círculos por parte
    const grupos = partes.map((parte, i) => {
      const botones = p.colores.map((c) => {
        const b = el('button', 'opcion-color', punto(c), c.n);
        b.type = 'button';
        b.addEventListener('click', () => { sel.colores[i] = c.n; reiniciar(); pintar(); });
        return b;
      });
      const titulo = partes.length > 1 ? parte : (p.colores.length > 1 ? 'Elige el color' : 'Color');
      const g = el('div', 'elegir', el('h3', '', titulo), el('div', 'opciones-color', ...botones));
      g.setAttribute('role', 'group');
      g.setAttribute('aria-label', titulo);
      texto.append(g);
      return { botones, g };
    });
    // Texto del cliente (productos personalizados)
    let campoTexto = null;
    if (p.personalizar) {
      campoTexto = el('textarea');
      campoTexto.id = 'textoCliente';
      campoTexto.maxLength = 600;
      campoTexto.rows = 2;
      campoTexto.value = sel.texto;
      campoTexto.placeholder = 'Escríbelo tal cual quieres que salga';
      campoTexto.addEventListener('input', () => { sel.texto = campoTexto.value; reiniciar(); pintar(); });
      const etiqueta = el('label', '', p.personalizar);
      etiqueta.htmlFor = 'textoCliente';
      texto.append(el('div', 'elegir personalizar', etiqueta, campoTexto));
    }
    // Abajo y en pequeño: el código (por si el cliente pregunta o escribe por WhatsApp) y el autor si hay que citarlo
    const referencia = [p.ref && `Ref. ${p.ref}`, p.credito].filter(Boolean).join(' · ');
    if (referencia) texto.append(el('p', 'credito', referencia));

    const n = el('span', '', String(cuantos));
    const menos = el('button', '', '−');
    const masB = el('button', '', '+');
    [menos, masB].forEach((b) => { b.type = 'button'; });
    menos.setAttribute('aria-label', 'Una menos');
    masB.setAttribute('aria-label', 'Una más');
    const anadir = el('button', 'boton', '');
    anadir.type = 'button';
    const nota = el('p', 'nota-cesta');
    const faltaAqui = el('p', 'falta oculto');
    faltaAqui.setAttribute('role', 'alert');

    function pintar() {
      grupos.forEach(({ botones }, i) => botones.forEach((b, j) => {
        const si = sel.colores[i] === p.colores[j].n;
        b.classList.toggle('sel', si);
        b.setAttribute('aria-pressed', String(si));
      }));
      const minimo = ya ? 0 : 1;
      n.textContent = String(cuantos);
      menos.disabled = cuantos <= minimo;
      masB.disabled = cuantos >= 99;
      anadir.classList.toggle('quitar', ya > 0 && !cuantos);
      anadir.textContent = editar ? (!cuantos ? 'Quitar del pedido' : `Guardar · ${precio(p.precio * cuantos)}`)
        : !ya ? `Añadir · ${precio(p.precio * cuantos)}`
        : !cuantos ? 'Quitar del pedido'
        : cuantos === ya ? `En tu pedido · ${precio(p.precio * cuantos)}`
        : `Actualizar · ${precio(p.precio * cuantos)}`;
      // Lo que ya hay de este producto en el pedido (tocando uno, se elige eso)
      const otras = editar ? [] : lineasDe(id);
      nota.replaceChildren(...(otras.length ? ['En tu pedido: ', ...otras.flatMap((l, k) => {
        const b = el('button', 'en-pedido', `${l.n} × ${detalleLinea(p, l) || p.nombre}`);
        b.type = 'button';
        b.addEventListener('click', () => {
          sel.colores = [...l.colores];
          sel.texto = l.texto;
          if (campoTexto) campoTexto.value = l.texto;
          reiniciar();
          pintar();
        });
        return k ? [' ', b] : [b];
      })] : []));
      faltaAqui.classList.add('oculto');
    }
    menos.addEventListener('click', () => { cuantos = Math.max(ya ? 0 : 1, cuantos - 1); pintar(); });
    masB.addEventListener('click', () => { cuantos = Math.min(99, cuantos + 1); pintar(); });
    anadir.addEventListener('click', () => {
      const linea = { id, colores: [...sel.colores], texto: sel.texto.trim() };
      const queFalta = cuantos > 0 ? falta(p, linea) : '';
      if (queFalta) {  // falta elegir algo: se dice y se lleva al sitio
        faltaAqui.textContent = queFalta;
        faltaAqui.classList.remove('oculto');
        const i = partes.findIndex((_, k) => !linea.colores[k]);
        const sitio = i >= 0 ? grupos[i].g : campoTexto;
        if (sitio) {
          sitio.scrollIntoView({ behavior: 'smooth', block: 'center' });
          sitio.classList.remove('marcar');
          void sitio.offsetWidth;  // para que la animación vuelva a empezar
          sitio.classList.add('marcar');
          if (sitio === campoTexto) campoTexto.focus({ preventScroll: true });
        }
        return;
      }
      const que = detalleLinea(p, linea);
      const etiqueta = `${p.nombre}${que ? ` (${que})` : ''}`;
      if (editar) {
        cesta.delete(claveLinea(editar.id, editar.colores, editar.texto));
        const otra = cesta.get(claveLinea(id, linea.colores, linea.texto));  // ya había otra igual: se juntan
        poner(linea, cuantos + (otra ? otra.n : 0));
        abrirDialogo($('dlgCesta'));
        pintarLineas();
        aviso(cuantos ? `Cambiado: ${etiqueta}` : `Quitado: ${etiqueta}`);
        return;
      }
      cerrarDialogo($('dlgFicha'));
      if (cuantos === ya) return;
      poner(linea, cuantos);
      aviso(`${!ya ? 'Añadido' : !cuantos ? 'Quitado' : 'Actualizado'}: ${etiqueta}`);
    });
    pintar();
    const pie = el('div', 'dlg-pie', faltaAqui, el('div', 'comprar', el('div', 'paso', menos, n, masB), anadir), nota);
    $('ficha').replaceChildren(el('div', 'dlg-cuerpo', f, texto), pie);
    $('dlgFicha').setAttribute('aria-label', p.nombre);
    abrirDialogo($('dlgFicha'));
  }

  // ---- Cesta y pedido ----
  function pintarCesta() {
    const u = unidades();
    $('cestaBarra').classList.toggle('oculto', !u);
    $('cestaCuantos').textContent = String(u);
    $('cestaTotal').textContent = precio(totalCesta());
    tarjetas.forEach((_, id) => pintarBoton(id));
    if ($('dlgCesta').open) pintarLineas();
  }

  function pintarLineas() {
    if (!cesta.size) {
      $('lineas').replaceChildren(el('li', 'vacio', 'Tu pedido está vacío.'));
    } else {
      $('lineas').replaceChildren(...[...cesta.values()].map((l) => {
        const p = porId.get(l.id);
        const mini = el('div', 'mini');
        if (p.img) mini.style.backgroundImage = `url("img/${p.img}-480.webp")`;
        const menos = el('button', '', l.n > 1 ? '−' : '×');
        const masB = el('button', '', '+');
        [menos, masB].forEach((b) => { b.type = 'button'; });
        menos.setAttribute('aria-label', l.n > 1 ? 'Una menos' : 'Quitar del pedido');
        masB.setAttribute('aria-label', 'Una más');
        menos.addEventListener('click', () => poner(l, l.n - 1));
        masB.addEventListener('click', () => poner(l, l.n + 1));
        // Color y texto: se cambian desde aquí (abre la ficha con esta línea)
        const que = detalleLinea(p, l);
        const pendiente = falta(p, l);
        let cambiar = null;
        if (que || pendiente) {
          cambiar = el('button', `opciones${pendiente ? ' falta' : ''}`, pendiente ? `${pendiente} →` : que);
          cambiar.type = 'button';
          cambiar.title = 'Cambiar';
          cambiar.addEventListener('click', () => abrirFicha(l.id, l));
        }
        return el('li', 'linea', mini,
          el('div', '', el('div', 'nom', p.nombre), cambiar, el('div', 'uni', `${precio(p.precio)} / ud.`)),
          el('div', 'der', el('span', 'sub', precio(p.precio * l.n)), el('div', 'paso', menos, el('span', '', String(l.n)), masB)));
      }));
    }
    $('totalCesta').textContent = precio(totalCesta());
    $('enviar').disabled = !cesta.size;
    $('enviar').classList.toggle('oculto', !D.pedidos);
    pintarWhatsapp();
  }

  // Lo que aún falta por elegir en el pedido («Elige el color» de cada producto), o nada
  const faltas = () => [...cesta.values()].map((l) => {
    const p = porId.get(l.id);
    const que = falta(p, l);
    return que ? `${p.nombre}: ${que.toLowerCase()}` : '';
  }).filter(Boolean);

  // WhatsApp como alternativa (o como única vía si aún no hay dónde recibir los pedidos)
  function textoPedido() {
    const lineas = [...cesta.values()].map((l) => {
      const p = porId.get(l.id);
      const que = detalleLinea(p, l);
      return `• ${l.n} × ${p.nombre} (${precio(p.precio * l.n)})${p.ref ? ` · Ref. ${p.ref}` : ''}${que ? `\n   ${que}` : ''}`;
    });
    const quien = [$('fNombre').value.trim(), $('fApellidos').value.trim()].filter(Boolean).join(' ');
    const coment = $('fComentario').value.trim();
    return ['Hola, quiero hacer este pedido del catálogo:', ...lineas, `Total: ${precio(totalCesta())}`,
      quien ? `\nA nombre de: ${quien}` : '', coment ? `Comentario: ${coment}` : ''].filter(Boolean).join('\n');
  }
  function pintarWhatsapp() {
    const a = $('porWhatsapp');
    a.classList.toggle('oculto', !D.whatsapp || !cesta.size);
    if (!D.whatsapp) return;
    a.href = `https://wa.me/${D.whatsapp.telefono}?text=${encodeURIComponent(textoPedido())}`;
    $('porWhatsappTexto').textContent = D.pedidos ? '¿Prefieres WhatsApp? Envíalo por ahí' : `Enviar pedido por WhatsApp a ${D.whatsapp.nombre}`;
    a.classList.toggle('boton-principal', !D.pedidos);
  }
  ['fNombre', 'fApellidos', 'fComentario'].forEach((id) => $(id).addEventListener('input', pintarWhatsapp));

  // Datos del cliente: se recuerdan en su navegador para el próximo pedido
  const CLIENTE = 'catalogo-cliente-v1';
  try {
    const c = JSON.parse(localStorage.getItem(CLIENTE) || '{}');
    ['nombre', 'apellidos', 'telefono'].forEach((k) => { if (c[k]) $(`f${k[0].toUpperCase()}${k.slice(1)}`).value = c[k]; });
  } catch (e) { /* nada */ }

  $('cestaBarra').addEventListener('click', () => { pintarLineas(); mostrarFormulario(true); abrirDialogo($('dlgCesta')); });

  function mostrarFormulario(si) {
    $('cestaPie').classList.toggle('oculto', !si);
    if (si && $('cestaCuerpo').querySelector('.hecho')) {
      $('cestaCuerpo').querySelector('.hecho').remove();
      [...$('cestaCuerpo').children].forEach((c) => c.classList.remove('oculto'));
    }
  }

  function error(texto) {
    $('errorPedido').textContent = texto;
    $('errorPedido').classList.toggle('oculto', !texto);
  }

  $('formPedido').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    error('');
    const campos = { nombre: $('fNombre'), apellidos: $('fApellidos'), telefono: $('fTelefono') };
    const vacios = Object.values(campos).filter((c) => !c.value.trim());
    const digitos = campos.telefono.value.replace(/\D/g, '');
    Object.values(campos).forEach((c) => c.setAttribute('aria-invalid', String(vacios.includes(c))));
    if (vacios.length) { error('Rellena nombre, apellidos y teléfono.'); vacios[0].focus(); return; }
    if (digitos.length < 9 || digitos.length > 15) {
      campos.telefono.setAttribute('aria-invalid', 'true');
      error('Revisa el teléfono: debe tener al menos 9 cifras.');
      campos.telefono.focus();
      return;
    }
    if (!$('fAcepto').checked) { error('Marca la casilla para poder enviarnos tus datos.'); return; }
    if (!cesta.size) { error('Tu pedido está vacío.'); return; }
    const pendientes = faltas();
    if (pendientes.length) { error(`Falta: ${pendientes.join('; ')}. Tócalo en tu pedido para elegirlo.`); return; }
    // `detalle`: los colores y el texto de cada línea (web/pedidos.gs lo pone en la hoja junto al producto); `ref` y
    // `printables`: su código y su modelo en Printables (con ellos la hoja apunta el código y el enlace al modelo)
    const pedido = {
      nombre: campos.nombre.value.trim(), apellidos: campos.apellidos.value.trim(), telefono: campos.telefono.value.trim(),
      comentario: $('fComentario').value.trim(), web: $('fWeb').value,
      lineas: [...cesta.values()].map((l) => {
        const p = porId.get(l.id);
        return { id: l.id, ref: p.ref, printables: p.printables, nombre: p.nombre, categoria: p.categoria, cantidad: l.n,
          precio: p.precio, detalle: detalleLinea(p, l) };
      }),
      total: Math.round(totalCesta() * 100) / 100,
    };
    try { localStorage.setItem(CLIENTE, JSON.stringify({ nombre: pedido.nombre, apellidos: pedido.apellidos, telefono: pedido.telefono })); } catch (e) { /* nada */ }
    const boton = $('enviar');
    boton.disabled = true;
    boton.textContent = 'Enviando…';
    const parar = new AbortController();
    const reloj = setTimeout(() => parar.abort(), 30000);
    try {
      // Como texto plano para que el navegador no pida permiso antes (el script de Google no lo contesta)
      const r = await fetch(D.pedidos, { method: 'POST', body: JSON.stringify(pedido), signal: parar.signal });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'No se pudo enviar.');
      cesta.clear();
      guardarCesta();
      pintarCesta();
      $('fComentario').value = '';
      [...$('cestaCuerpo').children].forEach((c) => c.classList.add('oculto'));
      $('cestaCuerpo').append(el('div', 'hecho', el('div', 'ok', '✓'), el('h2', '', '¡Pedido enviado!'),
        el('p', '', `${j.numero ? `Pedido nº ${j.numero}. ` : ''}Te llamaremos o escribiremos al ${pedido.telefono} para confirmarlo.`)));
      $('cestaPie').classList.add('oculto');
    } catch (e) {
      error(`${e.name === 'AbortError' ? 'No hay respuesta.' : e.message} Inténtalo de nuevo${D.whatsapp ? ' o envíalo por WhatsApp' : ''}.`);
    } finally {
      clearTimeout(reloj);
      boton.disabled = !cesta.size;
      boton.textContent = 'Enviar pedido';
    }
  });

  // ---- Aviso breve ----
  let reloj = null;
  function aviso(texto) {
    $('aviso').textContent = texto;
    $('aviso').classList.add('ver');
    clearTimeout(reloj);
    reloj = setTimeout(() => $('aviso').classList.remove('ver'), 1800);
  }

  // ---- Portada y pie ----
  function pintarPie() {
    const pie = [];
    if (D.contactos.length) {
      pie.push(el('p', 'bloque-tit', '¿Dudas? Escríbenos'));
      pie.push(el('div', 'contactos', ...D.contactos.map((c) => {
        const a = el('a', 'contacto');
        a.insertAdjacentHTML('afterbegin', ICONOS.wa);
        a.append(el('div', '', el('strong', '', c.nombre), el('span', '', [c.motivo, c.bonito].filter(Boolean).join(' · '))));
        a.href = `https://wa.me/${c.telefono}?text=${encodeURIComponent('Hola, he visto vuestro catálogo. ')}`;
        a.target = '_blank';
        a.rel = 'noopener';
        return a;
      })));
    }
    pie.push(el('p', 'legal', `${D.contacto ? `${D.contacto} · ` : ''}Catálogo actualizado el ${D.fecha}. `
      + 'Algunos diseños son de autores de la comunidad Printables y se citan en su ficha.'));
    $('pie').replaceChildren(...pie);
  }

  $('titulo').textContent = D.titulo;
  $('subtitulo').textContent = D.subtitulo;
  $('meta').textContent = `${D.productos.length} productos · Elige, añade a tu pedido y envíanoslo`;
  // El código también se busca, con y sin el guion («P-037» y «p037»)
  D.productos.forEach((p) => {
    p.buscar = normalizar(`${p.nombre} ${p.categoria} ${p.descripcion} ${p.ref} ${p.ref.replace('-', '')}`);
  });
  pintarChips();
  pintarProductos();
  pintarPie();
  pintarCesta();
  $('buscar').addEventListener('input', filtrar);
  window.addEventListener('hashchange', abrirDelEnlace);
  abrirDelEnlace();
})();
</script>
</body>
</html>
