<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="description" content="Impresión 3D personalizada. 322 productos. Elige y haz tu pedido.">
<!-- Solo la ve quien tiene el enlace: que los buscadores no la indexen -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c111d">
<!-- Ya trae su tema: que el «modo oscuro» de algunos navegadores del móvil no le cambie los colores -->
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo">
<meta property="og:description" content="Impresión 3D personalizada. 322 productos. Elige y haz tu pedido.">
<meta property="og:image" content="https://jcarmonamarin-glitch.github.io/NegoQR_Catalogo/portada.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jcarmonamarin-glitch.github.io/NegoQR_Catalogo/">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%278%27%20fill%3D%27%232850E0%27/%3E%3Cpath%20d%3D%27M9%2021l7-11%207%2011z%27%20fill%3D%27%23fff%27/%3E%3C/svg%3E">
<style>
:root{
  --marca: #2850E0;
  --marca-texto: #9eb0f1;  /* calculado en web.py: color-mix() no lo entienden los móviles antiguos */
  --marca-rgb: 40, 80, 224;  /* el mismo color en r, g, b, para las transparencias (rgba(var(--marca-rgb), .3)) */
  --fondo: #0c111d; --panel: #151c2b; --panel-2: #1c2538; --linea: rgba(255, 255, 255, .08);
  --texto: #eef2f8; --tenue: #a3adbf; --suave: #6f7a8f; --ok: #22c55e; --error: #f87171;
  --sombra: 0 10px 30px rgba(0, 0, 0, .45);
  --brillo: rgba(255, 255, 255, .07);  /* el reflejo que recorre las fotos mientras cargan */
  --barra: rgba(12, 17, 29, .8);
  --ease: cubic-bezier(.22, .61, .36, 1);  /* arranca rápido y frena suave: todas las animaciones */
  color-scheme: dark;
}
[data-tema="claro"]{
  --marca-texto: #2244be;
  --fondo: #f3f5f9; --panel: #fff; --panel-2: #eef1f6; --linea: rgba(15, 23, 42, .1);
  --texto: #131926; --tenue: #556072; --suave: #8892a5; --ok: #16a34a; --error: #dc2626;
  --sombra: 0 10px 30px rgba(15, 23, 42, .18);
  --brillo: rgba(255, 255, 255, .55);
  --barra: rgba(243, 245, 249, .82);
  color-scheme: light;
}
*{ box-sizing: border-box; }
/* Sin «anclaje» del navegador: al cambiar de categoría (p. ej. de una a «Todo»), aparecen cientos de productos por
   encima y el navegador movía la página para no perder lo que se veía; aquí se coloca ella (irAlPrincipio) */
html{ -webkit-text-size-adjust: 100%; overflow-anchor: none; }
body{ margin: 0; background: var(--fondo); color: var(--texto); line-height: 1.45;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
/* Un resplandor del color de la marca arriba, quieto (no se repinta al bajar) */
body::before{ content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(90% 46% at 12% -6%, rgba(var(--marca-rgb), .3), transparent 70%),
    radial-gradient(60% 40% at 100% 0%, rgba(var(--marca-rgb), .14), transparent 70%); }
button, input, textarea{ font: inherit; color: inherit; }
button{ cursor: pointer; -webkit-tap-highlight-color: transparent; }
a{ -webkit-tap-highlight-color: transparent; }
img{ display: block; }
.oculto{ display: none !important; }

/* Portada */
.portada{ padding: 34px 16px 18px; max-width: 1180px; margin: 0 auto; }
.portada .raya{ width: 44px; height: 5px; border-radius: 3px; background: var(--marca); margin-bottom: 14px;
  box-shadow: 0 0 18px rgba(var(--marca-rgb), .8); }
.portada h1{ margin: 0; font-size: clamp(32px, 8.6vw, 50px); line-height: 1.02; font-weight: 850; letter-spacing: -.025em;
  background: linear-gradient(100deg, var(--texto) 35%, var(--marca-texto)); -webkit-background-clip: text; background-clip: text;
  color: transparent; }
.portada .sub{ margin: 8px 0 0; color: var(--marca-texto); font-size: 17px; font-weight: 600; }
.portada .meta{ margin: 10px 0 0; color: var(--tenue); font-size: 13.5px; }
/* «Descubrir deslizando»: el botón grande de la portada */
.cta{ display: inline-flex; align-items: center; gap: 10px; height: 50px; margin-top: 18px; padding: 0 22px 0 18px; border: 0;
  border-radius: 25px; background: linear-gradient(135deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, 0) 60%), var(--marca);
  color: #fff; font-size: 15.5px; font-weight: 750; box-shadow: 0 12px 30px -12px rgba(var(--marca-rgb), .95);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.cta svg{ width: 22px; height: 22px; }
.cta:active{ transform: scale(.97); }
@media (hover: hover){ .cta:hover{ transform: translateY(-2px); box-shadow: 0 16px 36px -12px rgba(var(--marca-rgb), 1); } }

/* Buscador y categorías, fijos arriba: de cristal (se ve pasar lo de debajo, desenfocado) */
.barra{ position: sticky; top: 0; z-index: 5; background: var(--barra); border-bottom: 1px solid var(--linea);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); }
.barra-in{ max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; }
.buscar-fila{ display: flex; gap: 8px; }
.buscar-fila .buscar{ flex: 1; min-width: 0; }
/* El botón de «Descubrir», siempre a mano junto al buscador */
.boton-feed{ flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(135deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 60%), var(--marca); color: #fff;
  box-shadow: 0 8px 20px -10px rgba(var(--marca-rgb), .9); transition: transform .2s var(--ease); }
.boton-feed svg{ width: 22px; height: 22px; }
.boton-feed:active{ transform: scale(.92); }
.buscar{ position: relative; }
.buscar svg{ position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--suave); }
.buscar input{ width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: 12px; border: 1px solid var(--linea);
  background: var(--panel); outline: none; font-size: 16px; }
.buscar input:focus{ border-color: var(--marca); }
.chips{ display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar{ display: none; }
.chip{ flex: none; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--linea); background: var(--panel);
  color: var(--tenue); font-size: 13.5px; font-weight: 600; white-space: nowrap;
  transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .15s var(--ease); }
.chip:active{ transform: scale(.95); }
.chip.activo{ background: var(--marca); border-color: var(--marca); color: #fff; box-shadow: 0 6px 16px -8px rgba(var(--marca-rgb), .9); }
.chip.favoritos{ color: #ff5c7c; }
.chip.favoritos.activo{ background: #ff4d6d; border-color: #ff4d6d; color: #fff; box-shadow: 0 6px 16px -8px rgba(255, 77, 109, .9); }

/* Productos */
/* Al menos el alto de la pantalla: con una categoría de pocos productos, su título también puede subir hasta arriba */
main{ max-width: 1180px; margin: 0 auto; padding: 4px 16px 120px; min-height: 100vh; }
/* Lo de la categoría elegida aparece con un fundido, subiendo un poco */
main.cambio{ animation: cambio .38s var(--ease); }
@keyframes cambio{ from{ opacity: 0; transform: translateY(12px); } }
.seccion-cab{ display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 12px; }
.seccion h2{ margin: 0; font-size: 20px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.seccion h2 small{ font-size: 13px; font-weight: 600; color: var(--suave); }
/* «Deslizar»: la sección en «Descubrir» */
.ver-feed{ flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 2px; border: 0; background: none;
  color: var(--marca-texto); font-size: 13.5px; font-weight: 700; }
.ver-feed svg{ width: 16px; height: 16px; }
.rejilla{ display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
@media (min-width: 700px){ .rejilla{ grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; } }
/* Los destacados, en el móvil, en una fila que se pasa de lado con el dedo (tarjetas más grandes) */
@media (max-width: 699px){
  .destacados .rejilla{ display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px;
    padding: 2px 16px 8px; scroll-padding: 0 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .destacados .rejilla::-webkit-scrollbar{ display: none; }
  .destacados .tarjeta{ flex: 0 0 72%; scroll-snap-align: start; }
  .destacados .tarjeta h3{ font-size: 16px; }
}
.tarjeta{ position: relative; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--linea);
  border-radius: 16px; overflow: hidden; transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s; }
.tarjeta:active{ transform: scale(.985); }
@media (hover: hover){
  .tarjeta:hover{ transform: translateY(-4px); border-color: rgba(var(--marca-rgb), .45);
    box-shadow: 0 18px 36px -18px rgba(0, 0, 0, .7), 0 0 0 1px rgba(var(--marca-rgb), .25); }
  .tarjeta:hover .foto img{ transform: scale(1.045); }
}
/* Entran desde abajo, con un fundido, la primera vez que se ven al bajar (tarjetasQueEntran) */
.tarjeta.entra{ opacity: 0; }
.tarjeta.aparece{ animation: aparecer .55s var(--ease) both; animation-delay: var(--retraso, 0ms); }
@keyframes aparecer{ from{ opacity: 0; transform: translateY(18px); } to{ opacity: 1; transform: none; } }
.tarjeta .abrir{ display: block; padding: 0; border: 0; background: none; text-align: left; flex: 1; }
/* La foto: mientras carga, un reflejo que la recorre; al llegar, aparece con un fundido */
.foto{ position: relative; aspect-ratio: 4 / 3; background: var(--panel-2); overflow: hidden; }
.foto::before{ content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, var(--brillo) 50%, transparent 70%);
  background-size: 220% 100%; animation: brillo 1.4s linear infinite; }
.foto.lista::before{ display: none; }
@keyframes brillo{ from{ background-position: 130% 0; } to{ background-position: -130% 0; } }
.foto img{ width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s var(--ease), transform .6s var(--ease); }
.foto.lista img{ opacity: 1; }
.foto.entera img{ object-fit: contain; }
.foto .sin{ position: absolute; inset: 0; display: grid; place-items: center; color: var(--suave); font-size: 13px; }
/* El corazón de favoritos, sobre la foto */
.fav{ position: absolute; z-index: 2; top: 8px; right: 8px; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: rgba(8, 12, 22, .42); color: #fff;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: transform .2s var(--ease), color .2s; }
.fav svg{ width: 19px; height: 19px; }
.fav:active{ transform: scale(.84); }
.fav.si{ color: #ff4d6d; }
.fav.si svg path, .accion-fav.si svg path{ fill: currentColor; }
.latido{ animation: latido .5s var(--ease); }
@keyframes latido{ 0%{ transform: scale(1); } 35%{ transform: scale(1.32); } 60%{ transform: scale(.92); } 100%{ transform: scale(1); } }
.tarjeta .cuerpo{ padding: 10px 12px 12px; }
.tarjeta h3{ margin: 0; font-size: 14.5px; line-height: 1.3; font-weight: 700;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tarjeta .pie{ display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 0 10px 10px 12px; }
.precio{ font-size: 17px; font-weight: 800; color: var(--marca-texto); white-space: nowrap; }
.mas{ flex: none; min-width: 38px; height: 38px; padding: 0 10px; border-radius: 19px; border: 0; background: var(--marca); color: #fff;
  font-size: 22px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
/* Ya en el pedido: el «+» se abre en − N + (si no cabe junto al precio, baja a otra línea a todo el ancho) */
.tarjeta .paso{ flex: 1 0 auto; justify-content: space-between; border: 0; border-radius: 19px; background: var(--marca); color: #fff; }
.tarjeta .paso button{ width: 34px; height: 38px; font-size: 21px; line-height: 1; }
.tarjeta .paso span{ min-width: 16px; font-size: 15px; }
.vacio{ padding: 40px 0; text-align: center; color: var(--tenue); }

/* Barra de la cesta */
.cesta-barra{ position: fixed; z-index: 6; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px;
  border: 0; border-radius: 18px; background: linear-gradient(135deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 55%), var(--marca);
  color: #fff; box-shadow: 0 14px 34px -12px rgba(var(--marca-rgb), .9), var(--sombra); font-weight: 700; font-size: 15.5px;
  animation: entrar-abajo .45s var(--ease); }
@keyframes entrar-abajo{ from{ transform: translateY(140%); opacity: 0; } }
.cesta-barra .cuantos{ min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: rgba(255, 255, 255, .22);
  display: grid; place-items: center; font-size: 14px; }
.cesta-barra .cuantos.salto{ animation: latido .5s var(--ease); }
.cesta-barra .total{ margin-left: auto; }
/* Volver arriba: aparece al bajar mucho, encima de la barra del pedido si la hay */
.arriba{ position: fixed; z-index: 6; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 46px; height: 46px;
  border: 1px solid var(--linea); border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--texto);
  box-shadow: var(--sombra); opacity: 0; transform: translateY(16px) scale(.9); pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease), bottom .3s var(--ease); }
.arriba svg{ width: 22px; height: 22px; }
.arriba.ver{ opacity: 1; transform: none; pointer-events: auto; }
.con-cesta .arriba{ bottom: calc(80px + env(safe-area-inset-bottom)); }

/* Ventanas (ficha del producto y cesta): hoja que sube desde abajo en el móvil (y se cierra arrastrándola hacia abajo);
   en pantallas anchas, una ventana en medio que aparece con un fundido */
dialog{ width: 100%; max-width: 560px; max-height: 92vh; margin: auto auto 0; padding: 0; border: 0; border-radius: 22px 22px 0 0;
  background: var(--panel); color: var(--texto); box-shadow: var(--sombra); overflow: hidden; }
@media (min-width: 700px){ dialog{ margin: auto; border-radius: 22px; max-height: 88vh; } }
dialog::backdrop{ background: rgba(4, 7, 14, .62); }
dialog[open]{ animation: hoja-sube .4s var(--ease); }
dialog[open]::backdrop{ animation: velo .35s ease; }
dialog[open].cerrando{ animation: hoja-baja .24s ease-in forwards; }
dialog[open].cerrando::backdrop{ animation: velo-fuera .24s ease-in forwards; }
@keyframes hoja-sube{ from{ transform: translateY(100%); } }
@keyframes hoja-baja{ to{ transform: translateY(100%); } }
@keyframes velo{ from{ opacity: 0; } }
@keyframes velo-fuera{ to{ opacity: 0; } }
@media (min-width: 700px){
  dialog[open]{ animation-name: aparecer-ventana; }
  dialog[open].cerrando{ animation-name: desaparecer-ventana; }
}
@keyframes aparecer-ventana{ from{ opacity: 0; transform: translateY(20px) scale(.97); } }
@keyframes desaparecer-ventana{ to{ opacity: 0; transform: translateY(14px) scale(.98); } }
.dlg{ position: relative; display: flex; flex-direction: column; max-height: inherit; }
/* El asa de arriba: se ve que la hoja se puede bajar con el dedo */
.asa{ position: absolute; z-index: 3; top: 7px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px;
  background: rgba(127, 127, 127, .55); pointer-events: none; }
.ficha .asa{ background: rgba(255, 255, 255, .75); box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
@media (min-width: 700px){ .asa{ display: none; } }
.dlg-cab{ display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--linea); }
.dlg-cab h2{ margin: 0; font-size: 18px; font-weight: 800; flex: 1; }
.cerrar{ flex: none; width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--panel-2); font-size: 20px; line-height: 1; }
.dlg-cuerpo{ overflow-y: auto; overscroll-behavior: contain; }
.dlg-pie{ padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linea); background: var(--panel); }

.ficha .foto{ aspect-ratio: 4 / 3; }
.ficha .foto .cerrar{ position: absolute; top: 12px; right: 12px; background: rgba(8, 12, 22, .6); color: #fff; }
.ficha .texto{ padding: 16px; }
.ficha h2{ margin: 0; font-size: 21px; line-height: 1.2; font-weight: 800; }
.ficha .precio{ display: block; margin-top: 6px; font-size: 24px; }
.ficha .desc{ margin: 12px 0 0; color: var(--tenue); white-space: pre-line; }
.datos{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.dato{ display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--panel-2);
  font-size: 13px; font-weight: 600; }
.dato svg{ width: 15px; height: 15px; color: var(--marca-texto); }
/* Lo que elige el cliente: el color de cada parte (los rollos del taller) y el texto si es personalizado */
.elegir{ margin-top: 16px; border-radius: 12px; }
.elegir h3, .elegir label, .bloque-tit{ display: block; margin: 0 0 8px; font-size: 12.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--suave); }
.opciones-color{ display: flex; flex-wrap: wrap; gap: 8px; }
.opcion-color{ display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 5px 13px 5px 6px; border-radius: 999px;
  border: 1px solid var(--linea); background: var(--panel-2); font-size: 14px; font-weight: 600; }
.opcion-color.sel{ border-color: var(--marca); outline: 2px solid var(--marca); outline-offset: -1px; }
.punto{ width: 26px; height: 26px; border-radius: 50%; background: var(--c, #999); border: 1px solid rgba(127, 127, 127, .55); flex: none; }
.personalizar textarea{ width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel-2);
  outline: none; font-size: 16px; resize: vertical; }
.personalizar textarea:focus{ border-color: var(--marca); }
@keyframes marcar{ 0%, 60%{ box-shadow: 0 0 0 3px var(--error); } 100%{ box-shadow: 0 0 0 3px transparent; } }
.elegir.marcar{ animation: marcar 1.6s ease-out; }
@media (prefers-reduced-motion: reduce){ .elegir.marcar{ animation: none; outline: 2px solid var(--error); } }
.falta{ margin: 0 0 8px; color: var(--error); font-size: 14px; font-weight: 650; text-align: center; }
.en-pedido{ margin: 2px 0; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--linea); background: var(--panel-2);
  color: var(--texto); font-size: 12.5px; font-weight: 600; }
.credito{ margin: 16px 0 0; font-size: 12px; color: var(--suave); }
.compartir{ display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--linea); background: var(--panel-2); color: var(--texto); font-size: 14px; font-weight: 650; text-decoration: none; }
.compartir svg{ width: 18px; height: 18px; color: #25d366; }
.comprar{ display: flex; gap: 10px; align-items: stretch; }
.paso{ display: flex; align-items: center; border: 1px solid var(--linea); border-radius: 14px; background: var(--panel-2); }
.paso button{ width: 44px; height: 50px; border: 0; background: none; font-size: 22px; }
.paso button:disabled{ opacity: .35; }
.paso span{ min-width: 26px; text-align: center; font-weight: 800; font-size: 17px; }
.boton{ flex: 1; height: 52px; border: 0; border-radius: 14px; background: var(--marca); color: #fff; font-weight: 750; font-size: 16px; }
.boton:disabled{ opacity: .6; cursor: progress; }
.dlg-pie > .boton{ display: block; width: 100%; }
.boton.quitar{ background: transparent; color: var(--error); border: 1.5px solid var(--error); }
.boton.wa{ background: transparent; color: var(--texto); border: 1px solid var(--linea); height: 46px; font-size: 14.5px; font-weight: 650;
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.boton.wa svg{ width: 18px; height: 18px; color: #25d366; }
.boton.wa.boton-principal{ height: 52px; border: 0; background: #1fa855; color: #fff; font-size: 16px; font-weight: 750; }
.boton.wa.boton-principal svg{ color: #fff; }
.boton + .boton{ margin-top: 10px; }
.nota-cesta{ margin: 8px 0 0; font-size: 13px; color: var(--tenue); text-align: center; }

/* Cesta */
.lineas{ list-style: none; margin: 0; padding: 4px 16px; }
.linea{ display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.linea .mini{ width: 56px; height: 42px; border-radius: 8px; background: var(--panel-2) center / cover no-repeat; }
.linea .nom{ font-weight: 650; font-size: 14px; line-height: 1.3; }
.linea .uni{ font-size: 12.5px; color: var(--tenue); }
.linea .opciones{ display: block; margin: 2px 0; padding: 0; border: 0; background: none; color: var(--marca-texto); font-size: 12.5px;
  font-weight: 650; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.linea .opciones.falta{ color: var(--error); }
.linea .der{ display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.linea .sub{ font-weight: 750; white-space: nowrap; }
.linea .paso{ border-radius: 10px; }
.linea .paso button{ width: 32px; height: 32px; font-size: 18px; }
.linea .paso span{ min-width: 20px; font-size: 14px; }
.total-cesta{ display: flex; justify-content: space-between; padding: 14px 16px 4px; font-size: 17px; font-weight: 800; }
.total-cesta small{ display: block; font-size: 12px; font-weight: 500; color: var(--suave); }
form.datos-cliente{ padding: 8px 16px 6px; }
.campos{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campo{ display: flex; flex-direction: column; gap: 5px; }
.campo.ancho{ grid-column: 1 / -1; }
.campo label{ font-size: 13px; font-weight: 650; color: var(--tenue); }
.campo input, .campo textarea{ width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel-2);
  outline: none; font-size: 16px; }
.campo textarea{ min-height: 84px; resize: vertical; }
.campo input:focus, .campo textarea:focus{ border-color: var(--marca); }
.campo input[aria-invalid="true"]{ border-color: var(--error); }
.trampa{ position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.acepto{ display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 0; font-size: 13px; color: var(--tenue); }
.acepto input{ width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--marca); }
.error{ margin: 10px 0 0; color: var(--error); font-size: 14px; font-weight: 600; }
.hecho{ padding: 34px 20px 26px; text-align: center; }
.hecho .ok{ width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 34px; }
.hecho h2{ margin: 0; font-size: 22px; }
.hecho p{ margin: 10px 0 0; color: var(--tenue); }

/* Pie */
footer{ max-width: 1180px; margin: 0 auto; padding: 8px 16px 140px; color: var(--tenue); font-size: 13.5px; }
.contactos{ display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.contacto{ display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--linea);
  color: var(--texto); text-decoration: none; }
.contacto svg{ width: 26px; height: 26px; color: #25d366; flex: none; }
.contacto strong{ display: block; }
.contacto span{ font-size: 12.5px; color: var(--tenue); }
footer .legal{ margin-top: 18px; font-size: 12px; color: var(--suave); }

.aviso{ position: fixed; z-index: 20; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
  padding: 10px 16px; border-radius: 12px; background: var(--texto); color: var(--fondo); font-weight: 650; font-size: 14px;
  transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); }
.aviso.ver{ opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce){ .aviso{ transition: none; } }

/* ---- «Descubrir»: los productos uno a uno a pantalla completa; se pasa al siguiente deslizando hacia arriba (y al
   anterior, hacia abajo). Las diapositivas van una debajo de otra en un carril que sigue al dedo y, al soltar, se
   coloca en la siguiente o en la misma (pasarFeed): siempre de una en una, como en TikTok. Hasta el 23/10/2026 lo hacía
   el scroll del navegador (scroll-snap), y a veces volvía a la de antes ---- */
html.con-feed, html.con-feed body{ overflow: hidden; }
.feed{ position: fixed; inset: 0; z-index: 15; background: #04060c; color: #fff;
  transform: translateY(100%); transition: transform .45s var(--ease); }
.feed.abierto{ transform: none; }
.feed[hidden]{ display: none; }
.feed-scroll{ position: absolute; inset: 0; overflow: hidden; touch-action: none; overscroll-behavior: contain; }
.feed-carril{ position: absolute; inset: 0; will-change: transform; transition: transform .42s cubic-bezier(.2, .8, .25, 1); }
.feed-carril.arrastrando, .feed-carril.sin-transicion{ transition: none; }
/* Cada una, en su sitio del carril (translateY de su número × 100 %); las que no se ven no se pintan
   (content-visibility): con 300 productos, el móvil solo trabaja con las de delante */
.slide{ position: absolute; inset: 0; overflow: hidden; display: flex; justify-content: center; content-visibility: auto; }
/* Detrás, la misma foto ampliada y desenfocada: llena la pantalla con sus colores */
.slide-fondo{ position: absolute; inset: -60px; background: #0b0f1a center / cover no-repeat;
  filter: blur(30px) saturate(150%) brightness(.5); transform: translateZ(0); }
/* En columna: la foto ocupa lo que deja libre lo de abajo (nombre, descripción, comprar), así nunca queda tapada */
.slide-marco{ position: relative; width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; }
.slide-foto{ position: relative; flex: 1; min-height: 0; }
.slide-foto-in{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(70px + env(safe-area-inset-top)) 14px 14px; }
.slide-foto img{ max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 20px;
  box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .9); opacity: 0; transform: scale(.94);
  transition: opacity .55s var(--ease), transform .7s var(--ease); }
.slide-foto img.lista{ opacity: 1; transform: none; }
.slide.activa .slide-foto img.lista{ animation: acercar 12s ease-out forwards; }
@keyframes acercar{ to{ transform: scale(1.06); } }
.slide-sin{ font-size: 30px; font-weight: 850; text-align: center; opacity: .5; }
.slide-velo{ position: absolute; left: 0; right: 0; bottom: 0; height: 50%; pointer-events: none;
  background: linear-gradient(to top, rgba(3, 5, 12, .95) 10%, rgba(3, 5, 12, .6) 50%, rgba(3, 5, 12, 0)); }
.slide-velo-arriba{ position: absolute; left: 0; right: 0; top: 0; height: 130px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(3, 5, 12, .6), rgba(3, 5, 12, 0)); }
.slide-info{ position: relative; z-index: 1; flex: none; padding: 0 84px calc(22px + env(safe-area-inset-bottom)) 16px; }
.slide-etiquetas{ display: flex; flex-wrap: wrap; gap: 6px; }
.slide-etiqueta{ display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 13px;
  background: rgba(255, 255, 255, .16); font-size: 12px; font-weight: 700; letter-spacing: .01em;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.slide-etiqueta.marca{ background: rgba(var(--marca-rgb), .55); }
.slide-info h2{ margin: 10px 0 6px; font-size: clamp(23px, 6.6vw, 32px); line-height: 1.12; font-weight: 850;
  letter-spacing: -.015em; text-shadow: 0 2px 18px rgba(0, 0, 0, .55); }
.slide-desc{ margin: 0; color: rgba(255, 255, 255, .84); font-size: 14.5px; line-height: 1.42; cursor: pointer;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slide-desc.abierta{ -webkit-line-clamp: 9; }
.slide-colores{ display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 10px; font-size: 12.5px;
  color: rgba(255, 255, 255, .78); }
.slide-colores .punto{ width: 18px; height: 18px; border: 1.5px solid rgba(255, 255, 255, .75); }
.slide-colores .que{ margin-left: 4px; }
.slide-compra{ display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.slide-precio{ font-size: 27px; font-weight: 850; letter-spacing: -.01em; white-space: nowrap; }
.slide-compra .mas{ flex: 1; max-width: 240px; height: 50px; padding: 0 18px; border-radius: 25px; font-size: 15.5px; font-weight: 750;
  background: linear-gradient(135deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0) 60%), var(--marca);
  box-shadow: 0 12px 28px -10px rgba(var(--marca-rgb), .95); transition: transform .2s var(--ease); }
.slide-compra .mas:active{ transform: scale(.96); }
.slide-compra .paso{ flex: 1; max-width: 240px; justify-content: space-between; height: 50px; border: 0; border-radius: 25px;
  background: rgba(255, 255, 255, .16); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.slide-compra .paso button{ width: 50px; height: 50px; color: #fff; }
.slide-compra .paso span{ font-size: 17px; }
/* A la derecha, como en TikTok: me gusta, compartir y ver la ficha */
.slide-acciones{ position: absolute; z-index: 2; right: 10px; bottom: calc(96px + env(safe-area-inset-bottom)); display: flex;
  flex-direction: column; align-items: center; gap: 16px; }
.accion{ display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0; border: 0; background: none;
  color: #fff; font-size: 11.5px; font-weight: 700; text-decoration: none; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
.accion .circulo{ width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .15);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: transform .2s var(--ease), background .2s; }
.accion:active .circulo{ transform: scale(.86); }
.accion svg{ width: 26px; height: 26px; }
.accion-fav.si{ color: #ff4d6d; }
.accion-fav.si .circulo{ background: rgba(255, 77, 109, .2); }
/* Lo de la diapositiva que se está viendo entra subiendo un poco, escalonado */
.slide-info > *, .slide-acciones{ opacity: 0; transform: translateY(16px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
.slide.activa .slide-info > *, .slide.activa .slide-acciones{ opacity: 1; transform: none; }
.slide.activa .slide-info > :nth-child(2){ transition-delay: .05s; }
.slide.activa .slide-info > :nth-child(3){ transition-delay: .1s; }
.slide.activa .slide-info > :nth-child(4){ transition-delay: .15s; }
.slide.activa .slide-info > :nth-child(5){ transition-delay: .2s; }
.slide.activa .slide-acciones{ transition-delay: .12s; }
/* El corazón que salta al dar dos toques en la foto */
.corazon-grande{ position: absolute; z-index: 5; width: 120px; height: 120px; margin: -60px 0 0 -60px; color: #ff4d6d;
  pointer-events: none; filter: drop-shadow(0 10px 26px rgba(255, 77, 109, .65)); animation: estallar .85s var(--ease) forwards; }
.corazon-grande path{ fill: currentColor; stroke: none; }
@keyframes estallar{ 0%{ transform: scale(.2) rotate(-14deg); opacity: 0; } 22%{ transform: scale(1.18) rotate(-8deg); opacity: 1; }
  42%{ transform: scale(.94) rotate(-8deg); } 70%{ transform: scale(1) rotate(-8deg); opacity: 1; }
  100%{ transform: scale(1.3) translateY(-50px) rotate(-8deg); opacity: 0; } }
/* La última: ya está todo visto */
.slide.fin{ align-items: center; padding: 24px; text-align: center;
  background: radial-gradient(80% 50% at 50% 40%, rgba(var(--marca-rgb), .35), transparent 70%), #04060c; }
.fin-caja{ max-width: 340px; }
.fin-caja .icono{ width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255, 255, 255, .12); font-size: 34px; }
.fin-caja h2{ margin: 0; font-size: 24px; font-weight: 850; }
.fin-caja p{ margin: 8px 0 20px; color: rgba(255, 255, 255, .75); }
.fin-caja .boton{ display: block; width: 100%; }
.fin-caja .boton.sec{ background: rgba(255, 255, 255, .14); }
/* Arriba: cerrar, dónde se está (categoría y «3 / 120») y el pedido; y una raya con lo que se lleva visto */
.feed-cab{ position: absolute; z-index: 3; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 12px 10px; pointer-events: none; }
.feed-cab > *{ pointer-events: auto; }
.feed-boton{ position: relative; flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; display: grid;
  place-items: center; background: rgba(0, 0, 0, .35); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: transform .2s var(--ease); }
.feed-boton:active{ transform: scale(.9); }
.feed-boton svg{ width: 22px; height: 22px; }
.feed-boton .num{ position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  display: grid; place-items: center; background: var(--marca); font-size: 11.5px; font-weight: 800; box-shadow: 0 0 0 2px #04060c; }
.feed-titulo{ flex: 1; min-width: 0; text-align: center; font-weight: 750; font-size: 15px; text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-titulo small{ display: block; font-size: 11.5px; font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }
.feed-progreso{ position: absolute; z-index: 4; left: 0; top: 0; height: 3px; width: 0; border-radius: 0 2px 2px 0;
  background: linear-gradient(90deg, var(--marca-texto), var(--marca)); box-shadow: 0 0 10px rgba(var(--marca-rgb), .9);
  transition: width .4s var(--ease); }
/* La primera vez: cómo se pasa al siguiente */
.feed-pista{ position: absolute; z-index: 3; left: 50%; top: 38%; transform: translate(-50%, -50%); display: flex; flex-direction: column;
  align-items: center; gap: 8px; padding: 16px 22px; border-radius: 20px; background: rgba(0, 0, 0, .5); font-weight: 700; text-align: center;
  font-size: 14.5px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none; transition: opacity .45s; }
.feed-pista svg{ width: 36px; height: 36px; animation: pista 1.5s var(--ease) infinite; }
.feed-pista.fuera{ opacity: 0; }
@keyframes pista{ 0%{ transform: translateY(14px); opacity: 0; } 35%{ opacity: 1; } 100%{ transform: translateY(-16px); opacity: 0; } }
/* Con ratón: flechas para pasar (con el dedo no hacen falta) */
.feed-flechas{ position: absolute; z-index: 3; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
@media (hover: none), (max-width: 699px){ .feed-flechas{ display: none; } }
html.con-feed .aviso{ top: calc(72px + env(safe-area-inset-top)); bottom: auto; }
@media (prefers-reduced-motion: reduce){
  .feed, .slide-info > *, .slide-acciones, .slide-foto img, .feed-progreso{ transition: none !important; }
  .slide.activa .slide-foto img.lista, .feed-pista svg, .corazon-grande, .tarjeta.aparece, dialog[open], dialog[open]::backdrop,
  .cesta-barra, .foto::before{ animation: none !important; }
}

<body>
<header class="portada">
  <div class="raya"></div>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
  <p class="meta" id="meta"></p>
  <button type="button" class="cta" id="ctaFeed" data-icono="deslizar">Descubrir deslizando</button>
</header>

<div class="barra">
  <div class="barra-in">
    <div class="buscar-fila">
      <label class="buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="buscar" placeholder="Buscar productos…" autocomplete="off" aria-label="Buscar productos">
      </label>
      <button type="button" class="boton-feed" id="botonFeed" data-icono="deslizar" aria-label="Ver los productos deslizando"
        title="Ver los productos deslizando"></button>
    </div>
    <nav class="chips" id="chips" aria-label="Categorías"></nav>
  </div>
</div>

<main id="productos"></main>

<footer id="pie"></footer>

<button type="button" class="cesta-barra oculto" id="cestaBarra">
  <span class="cuantos" id="cestaCuantos">0</span><span>Ver pedido</span><span class="total" id="cestaTotal"></span>
</button>
<button type="button" class="arriba" id="arriba" data-icono="arriba" aria-label="Volver arriba" tabindex="-1"></button>

<!-- «Descubrir»: los productos a pantalla completa, uno a uno, deslizando (las diapositivas las pone el script) -->
<div class="feed" id="feed" role="dialog" aria-modal="true" aria-label="Descubrir productos" hidden>
  <div class="feed-scroll" id="feedScroll"><div class="feed-carril" id="feedCarril"></div></div>
  <div class="feed-progreso" id="feedProgreso"></div>
  <div class="feed-cab">
    <button type="button" class="feed-boton" id="feedCerrar" data-icono="cerrar" aria-label="Cerrar"></button>

    <button type="button" class="feed-boton" id="feedCesta" data-icono="bolsa" aria-label="Ver tu pedido"><span class="num oculto" id="feedCestaNum"></span></button>
  </div>
  <div class="feed-pista oculto" id="feedPista"><span data-icono="subir"></span>Desliza hacia arriba para ver más</div>
  <div class="feed-flechas">
    <button type="button" class="feed-boton" id="feedAnterior" data-icono="anterior" aria-label="Anterior"></button>
    <button type="button" class="feed-boton" id="feedSiguiente" data-icono="siguiente" aria-label="Siguiente"></button>
  </div>
</div>

<dialog id="dlgFicha" aria-label="Producto"><div class="dlg ficha" id="ficha"></div></dialog>

<dialog id="dlgCesta" aria-labelledby="cestaTitulo">
  <div class="dlg">
    <span class="asa" aria-hidden="true"></span>
    <div class="dlg-cab"><h2 id="cestaTitulo">Tu pedido</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo" id="cestaCuerpo">
      <ul class="lineas" id="lineas"></ul>
      <div class="total-cesta"><span>Total<small>Te confirmamos el pedido antes de hacerlo</small></span><span id="totalCesta"></span></div>
      <form class="datos-cliente" id="formPedido" novalidate>
        <p class="bloque-tit" style="margin-top:10px">Tus datos</p>
        <div class="campos">
          <div class="campo"><label for="fNombre">Nombre</label><input id="fNombre" name="nombre" autocomplete="given-name" maxlength="60" required></div>
          <div class="campo"><label for="fApellidos">Apellidos</label><input id="fApellidos" name="apellidos" autocomplete="family-name" maxlength="80" required></div>
          <div class="campo ancho"><label for="fTelefono">Teléfono</label><input id="fTelefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="600 000 000" required></div>
          <div class="campo ancho"><label for="fComentario">Comentario <span style="font-weight:400">(opcional)</span></label>
            <textarea id="fComentario" name="comentario" maxlength="1000" placeholder="Para cuándo lo necesitas o cualquier detalle…"></textarea></div>
        </div>
        <div class="trampa" aria-hidden="true"><label>No rellenar <input id="fWeb" name="web" tabindex="-1" autocomplete="off"></label></div>
        <label class="acepto"><input type="checkbox" id="fAcepto" required>
          <span>Acepto que uséis mi nombre y teléfono solo para gestionar este pedido. No se ceden a nadie.</span></label>
        <p class="error oculto" id="errorPedido" role="alert"></p>
      </form>
    </div>
    <div class="dlg-pie" id="cestaPie">
      <button type="submit" form="formPedido" class="boton" id="enviar">Enviar pedido</button>
      <a class="boton wa oculto" id="porWhatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
        <span id="porWhatsappTexto">¿Prefieres WhatsApp? Envíalo por ahí</span></a>
    </div>
  </div>
